<title>SAP-C02 Question Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one working column (card-first drill), sticky tab bar; same identity as the Pattern Notes page */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#15202A; --muted:#5A6672; --line:#D8DEE3; --node:#EDF1F4;
  --accent:#0B6E78; --accent-soft:#E0F0F1; --on-accent:#FFFFFF;
  --trap:#A94A16; --trap-soft:#FBEDE3;
  --ok:#2B7648; --ok-soft:#E2F1E7;
  --miss:#B3261E; --miss-soft:#FBE6E4;
  --part:#9A6B00; --part-soft:#FAF0D6;
  --clue:#FFF1B8; --clue-ink:#15202A;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1519; --surface:#162027; --ink:#E3E9ED; --muted:#9AA7B1; --line:#2A3740; --node:#1E2931;
    --accent:#52B9C3; --accent-soft:#13333A; --on-accent:#0F1519;
    --trap:#E38C58; --trap-soft:#3A2418;
    --ok:#6CC08E; --ok-soft:#15301F;
    --miss:#F07B72; --miss-soft:#3B1B19;
    --part:#E3B64D; --part-soft:#3A2F12;
    --clue:#4A3F12; --clue-ink:#F5E6B0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1519; --surface:#162027; --ink:#E3E9ED; --muted:#9AA7B1; --line:#2A3740; --node:#1E2931;
  --accent:#52B9C3; --accent-soft:#13333A; --on-accent:#0F1519;
  --trap:#E38C58; --trap-soft:#3A2418;
  --ok:#6CC08E; --ok-soft:#15301F;
  --miss:#F07B72; --miss-soft:#3B1B19;
  --part:#E3B64D; --part-soft:#3A2F12;
  --clue:#4A3F12; --clue-ink:#F5E6B0;
}
*{box-sizing:border-box}




/* v6 */
.filters{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.filters #bq{grid-column:1/-1}
@media (max-width:640px){.filters{grid-template-columns:minmax(0,1fr)!important}}
.dayl{list-style:none;padding-left:0!important;margin:0!important;counter-reset:dp}
.dayl li{display:flex;gap:10px;align-items:baseline;counter-increment:dp}
.dayl li::before{content:counter(dp) ".";min-width:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.dayl li>label{flex:1;min-width:0}
.dayl li>.btn{flex:none;white-space:nowrap}
@media (max-width:640px){.dayl li{flex-wrap:wrap;row-gap:6px}.dayl li>label{flex-basis:calc(100% - 26px)}.dayl li>.btn{margin-left:26px}}
/* v5 */
.dayl{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px}
.dayl label{cursor:pointer}
.rulebox textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:14px/1.5 var(--sans);padding:8px 10px}
.ruleq{font:600 16px/1.45 var(--sans)}
/* v4 */
.gds{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}
.gds input,.gds select{width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:14px var(--sans)}
.gdask{display:block;margin:4px 0;padding:6px 8px;border-left:3px solid var(--accent);background:var(--surface)}
.gdw{display:block;margin-top:4px;color:var(--part)}
.gdc table th{text-align:left;white-space:nowrap}
.okc{color:var(--ok);font-weight:600}.mc{color:var(--miss);font-weight:600}
.wks{margin:0;padding-left:22px;display:grid;gap:6px;font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:12px 12px 12px 32px}
.cueq{font:600 19px/1.4 var(--sans)}
.cuea{border-left:4px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:6px}
/* v3 */
.chq.ok{border-left:4px solid var(--ok)}.chq.miss{border-left:4px solid var(--miss)}
details.lab>summary{cursor:pointer;font-size:16px;list-style-position:outside}
.lsteps{padding-left:22px;display:grid;gap:12px}
.lst{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.lst input{transform:translateY(1px)}
.codew{position:relative;max-width:100%;min-width:0}
details.lab{min-width:0;max-width:100%;overflow:hidden}
details.lab>div,details.lab>div>div,.lsteps>li{min-width:0;max-width:100%}
details.lab p,details.lab li,details.lab .mono{overflow-wrap:anywhere}
pre.code{max-width:100%}
.codew .cpy{position:absolute;top:6px;right:6px}
pre.code{background:var(--node);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font:12.5px/1.5 var(--mono);margin:6px 0 0;white-space:pre}
/* v2 */
.af{border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;display:grid;gap:8px;background:var(--accent-soft)}
.afs{margin:0;padding-left:20px;font-size:14px}
.af textarea,#v-open textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:14px/1.5 var(--sans);padding:8px 10px;resize:vertical}
.xbs{display:grid;gap:8px}
details.xb{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
details.xb>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.trl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;font-size:14px}
.trl .tx{color:var(--miss);font-weight:600}
table.dct{font-size:13px}
table.dct td.nf{color:var(--miss)}
.probs{margin:0;padding-left:22px}
.oans{margin:6px 0;padding-left:22px;display:grid;gap:6px}
.oq.known{border-left:4px solid var(--ok)}.oq.shaky{border-left:4px solid var(--part)}.oq.gap{border-left:4px solid var(--miss)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--cond);text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:600;line-height:1.2}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
a{color:var(--accent);overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* top bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.005em}
.brand .sync{font:400 12px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:2px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;padding:8px 12px 9px;font:500 14px var(--sans);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .ct{font:500 11px var(--mono);margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--node);color:var(--muted)}
main{padding-top:20px}
section.view{display:grid;gap:18px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn kbd,.kbd{font:500 11px var(--mono);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px;opacity:.7}
select,input[type=search],input[type=number]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--mono);padding:2px 8px;border-radius:4px;background:var(--node);color:var(--muted);white-space:nowrap}
.chip.type{background:var(--accent-soft);color:var(--accent)}
.chip.dec{background:var(--trap-soft);color:var(--trap)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}
.chip.part{background:var(--part-soft);color:var(--part)}
.chip.dom{background:var(--ink);color:var(--surface)}
.chip.nw{background:var(--ok-soft);color:var(--ok)}
:root{--d1:#0B6E78;--d2:#7A5BB5;--d3:#A94A16;--d4:#2B7648}
.dsum{display:grid;grid-template-columns:16px minmax(0,1fr) auto 120px auto;gap:6px 12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.dsum .chev{color:var(--muted);transition:transform .15s;font-size:12px}
details[open]>.dsum .chev{transform:rotate(90deg)}
.dsum .dn{font-weight:600}
.dsum .dst{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dsum .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
@media (max-width:640px){.dsum{grid-template-columns:16px minmax(0,1fr) auto}.dsum .dst{grid-column:2}.dsum .dm{grid-column:2}.dsum .btn{grid-row:1;grid-column:3}}
.ts-list{display:grid;gap:2px;margin:4px 0 8px}
.ts-list button{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13.5px}
.ts-list button:hover{background:var(--node)}
.ts-list .k{font:500 12px var(--mono);color:var(--muted)}
.ts-list .c{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
details.dom>summary{cursor:pointer;list-style:none}
details.dom>summary::-webkit-details-marker{display:none}
details.dom>summary .tw{font:500 12px var(--mono);color:var(--muted)}
.wbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 2px}
.wbar i{display:block;height:100%}
.wbar i:nth-child(1){background:var(--d1)}.wbar i:nth-child(2){background:var(--d2)}.wbar i:nth-child(3){background:var(--d3)}.wbar i:nth-child(4){background:var(--d4)}
.ts-list{padding-left:22px}
@media (max-width:640px){.ts-list{padding-left:0}.ts-list button{grid-template-columns:34px minmax(0,1fr) auto}.ts-list button .c:last-child{display:none}}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font:600 28px/1.1 var(--cond);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.start{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.start p{color:var(--muted);font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
tr:last-child td{border-bottom:0}
.meter{height:6px;background:var(--node);border-radius:3px;overflow:hidden;min-width:60px;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)} .meter .r{background:var(--miss)}
.svc-list{display:flex;flex-wrap:wrap;gap:6px}
.svc-list .chip{font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* question card */
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.qhead .left{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.progress{height:4px;background:var(--node);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stem{font-size:16px;line-height:1.65;max-width:72ch}
.stem p{margin:0 0 10px}.stem p:last-child{margin-bottom:0}.stem p.pre{white-space:pre-line}
.ask{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;max-width:72ch;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;font-size:16px;font-weight:600;line-height:1.55}
.ask .q{flex:1 1 320px}
.ask .pick{white-space:nowrap}
.opt .t br+img.ico{margin-left:0}
.srcs{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.srcs h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.srcs ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.6}
.expl p{margin:0 0 10px}.expl p:last-child{margin-bottom:0}
.expl p.op{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.expl .lb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:600 12px var(--mono);background:var(--miss-soft);color:var(--miss);margin-top:1px}
.expl .lb.ok{background:var(--ok-soft);color:var(--ok)}
.expl a.svc,.chain a.n{text-decoration:none}
.expl a.svc{border-bottom:1px dotted var(--accent)}
.expl a.svc:hover{border-bottom-style:solid}
a.n{color:var(--ink)} a.n:hover{border-color:var(--accent);color:var(--accent)}
mark.clue,mark.c-con{background:var(--clue);color:var(--clue-ink);border-radius:3px;padding:0 2px}
mark.c-dec{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--accent)}
mark.c-num{background:none;color:inherit;font-family:var(--mono);font-size:.9em;border:1px solid var(--muted);border-radius:4px;padding:0 3px;white-space:nowrap}
mark.c-trg{background:none;color:inherit;text-decoration:underline 2px dotted #8C4FFF;text-underline-offset:4px}
.legend-clue{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;margin:-4px 0 0}
.legend-clue mark{font-size:12px}
.trigs{display:flex;flex-wrap:wrap;gap:6px}
.trigs span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--node)}
.trigs b{font-weight:600;text-decoration:underline 2px dotted #8C4FFF;text-underline-offset:3px}
.pick{font:600 13px var(--mono);color:var(--trap)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--accent)}
.opt .L{font:600 14px var(--mono);width:26px;height:26px;border-radius:5px;background:var(--node);display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--on-accent)}
.opt.wrong{border-color:var(--miss);background:var(--miss-soft)}
.opt.wrong .L{background:var(--miss);color:var(--on-accent)}
.opt.missed{border-color:var(--part);border-style:dashed}
.opt[disabled]{cursor:default}
.opt .t{min-width:0;overflow-wrap:anywhere}
mark.diff,mark.d-u{background:var(--trap-soft);color:inherit;border-radius:3px;padding:0 2px;font-weight:600;box-shadow:inset 0 -2px 0 var(--trap)}
mark.d-p{background:none;color:inherit;text-decoration:underline 2px dotted var(--trap);text-underline-offset:3px}
.diffnote{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;margin:0}
.diffnote mark{font-size:12px}
.verdict{display:flex;align-items:center;gap:10px;font:600 18px var(--cond)}
.verdict.ok{color:var(--ok)} .verdict.miss{color:var(--miss)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.chain .n{font-size:13px;background:var(--node);border:1px solid var(--line);border-radius:5px;padding:3px 8px;white-space:nowrap}
img.ico{width:18px;height:18px;vertical-align:-4px;margin-right:4px;border-radius:3px}
.opt .t img.ico{width:17px;height:17px}
.chain .n{display:inline-flex;align-items:center;gap:0}
.chain .n img.ico{width:20px;height:20px;margin-right:6px;vertical-align:0}
.chain .ar{color:var(--muted);font-family:var(--mono);padding:0 3px}
.expl{font-size:14.5px;line-height:1.65;max-width:72ch;overflow-wrap:anywhere}
.dispute{background:var(--trap-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.dispute strong{color:var(--trap)}
.note-box{background:var(--node)}
.note-box strong{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:8px}

/* exam */
.timer{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--miss)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.navgrid button{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font:500 12px var(--mono);cursor:pointer;padding:0}
.navgrid button.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.navgrid button.mark{box-shadow:inset 0 -3px 0 var(--trap)}
.navgrid button.cur{outline:2px solid var(--ink);outline-offset:-1px}
.navgrid button.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.navgrid button.bad{background:var(--miss-soft);color:var(--miss);border-color:transparent}

/* browse */
.list{display:grid}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item:hover{background:var(--node)}
.item .id{font:500 13px var(--mono);color:var(--muted)}
.item .tx{font-size:14px;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filters{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:900px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:640px){.filters{grid-template-columns:minmax(0,1fr)}}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Pattern mastery: uses native trainer palette and typography */
.pm-head{display:grid;gap:12px}.pm-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pm-stats>div{background:var(--node);border-radius:8px;padding:10px;min-width:0}.pm-stats b{display:block;font:600 23px var(--cond);font-variant-numeric:tabular-nums}.pm-stats span{display:block;font-size:12px;color:var(--muted)}
.pm-note summary{cursor:pointer;font-weight:600;color:var(--accent)}.pm-note p{margin:7px 0;font-size:13px}

<script id="v2data" type="application/json">{"open":[{"task":"1.1","n":1,"title":"Grocery chain: one pipe, many VPCs, two-way DNS","scenario":"A grocery chain has a central network account, 45 VPCs in workload accounts across three Regions, and one on-premises data center.","problems":["The data center needs a private 10 Gbps link that reaches every VPC in all three Regions.","On-premises servers must resolve names in AWS private hosted zones.","Workloads in every account must resolve the on-premises domain corp.grocer.local.","On-premises batch jobs must upload to S3 privately over the new link."],"constraint":"Least operational overhead, managed centrally from the network account.","hint":"One virtual interface type into one global gateway into a regional hub; DNS needs a door in each direction; one S3 endpoint type is reachable from on-premises.","answer":[{"p":1,"svc":"Direct Connect dedicated 10 Gbps connection -> transit VIF -> Direct Connect gateway -> Transit Gateway in each Region (TGWs owned by the network account, shared to workload accounts with AWS RAM)","why":"One transit VIF and one DX gateway (up to 6 TGWs) reach all VPCs in all Regions through the TGW hub instead of one VIF per VPC."},{"p":2,"svc":"Route 53 Resolver inbound endpoint in a shared-services VPC + conditional forwarder on the on-prem DNS servers pointing at the inbound endpoint IPs","why":"Inbound = on-premises asks AWS; the endpoint answers for private hosted zones associated with that VPC."},{"p":3,"svc":"Route 53 Resolver outbound endpoint + forwarding rule for corp.grocer.local, shared to all accounts with AWS RAM and associated with their VPCs","why":"Outbound = AWS asks on-premises; RAM-shared rules mean workload accounts need no endpoints of their own.","also":"Route 53 Profiles shared via RAM to push the rules and private hosted zones to many VPCs"},{"p":4,"svc":"S3 interface VPC endpoint (PrivateLink) in a VPC reachable over Direct Connect","why":"Interface endpoints have private IPs routable from on-premises; gateway endpoints are not. On-premises clients use the endpoint-specific DNS names, or private DNS through the Resolver inbound endpoint."}],"traps":["Private VIF per VPC: max 50 public/private VIFs per dedicated connection and lots of work; a transit VIF to a DX gateway + TGW scales.","S3 gateway endpoint for on-premises uploads: gateway endpoints only work from inside the VPC (route table entry), not over DX or VPN.","Swapping inbound and outbound endpoints: on-prem -> AWS = inbound; AWS -> on-prem = outbound."],"extra":"Direct Connect gateway: up to 20 VGWs (private VIF) or up to 6 TGWs (transit VIF); a dedicated connection supports up to 4 transit VIFs."},{"task":"1.1","n":2,"title":"Shipping firm: why does it time out?","scenario":"A shipping company's container-tracking app runs on EC2 in a private subnet and talks to services on-premises and in S3.","problems":["Calls to an on-premises API time out; find which route table, security group or NACL blocks the path without sending test traffic.","The subnet NACL allows outbound TCP 443 and inbound TCP 443 only; responses never arrive.","Auditors want a stored record of all rejected connections in the VPC, queryable with SQL.","Another call returns AccessDenied from S3 through the VPC endpoint.","Security wants every path from the internet to database subnets reported."],"constraint":"Least operational overhead; no packet capture.","hint":"One tool reasons over configuration; NACLs are stateless; one problem is not a network problem at all.","answer":[{"p":1,"svc":"VPC Reachability Analyzer","why":"Analyses configuration between a source and destination and names the blocking component without sending packets."},{"p":2,"svc":"Add a NACL inbound rule allowing TCP 1024-65535 (ephemeral ports) from the API's CIDR","why":"NACLs are stateless, so return traffic to the client's ephemeral port needs its own inbound rule."},{"p":3,"svc":"VPC Flow Logs (REJECT or ALL) to S3, queried with Amazon Athena","why":"Flow Logs record accepted/rejected flow metadata; Athena queries them in S3 cheaply.","also":"Flow Logs to CloudWatch Logs + Logs Insights"},{"p":4,"svc":"Fix the policy: VPC endpoint policy, S3 bucket policy (e.g. aws:SourceVpce) and the role's IAM policy","why":"AccessDenied is an authorization answer, so the network path works; a timeout would mean network."},{"p":5,"svc":"Network Access Analyzer","why":"Finds unintended network access paths (e.g. internet gateway to database subnets) across the VPC configuration."}],"traps":["Traffic Mirroring to debug the timeout: it is packet capture, needs appliances, and the constraint rules it out.","Opening outbound ephemeral ports on the security group: security groups are stateful, so return traffic is already allowed; the NACL is the problem.","Using Flow Logs to find the blocking rule: they show REJECT but not which rule rejected it; Reachability Analyzer names the component."],"extra":"Timeout = network (route, SG, NACL); AccessDenied = policy (IAM, bucket, endpoint, SCP/RCP)."},{"task":"1.1","n":3,"title":"Fintech growth: IPs, overlap and latency","scenario":"A fintech is growing from 20 to 300 VPCs in AWS Organizations and has just acquired a startup.","problems":["New VPC CIDRs must be handed out centrally from approved ranges with no overlaps, and usage tracked across all accounts.","The startup's VPC uses 10.0.0.0/16, same as the main VPC; one HTTPS pricing API must be reachable from the main VPC.","An EKS cluster is running out of IP addresses for pods in its /22 subnets.","Traders in one metro area need single-digit-millisecond latency to EC2 hosts."],"constraint":"Least change to existing applications.","hint":"A central address manager with a delegated account; a one-way service-level connection that ignores CIDRs; extra non-routable space for pods; AWS infrastructure in a city.","answer":[{"p":1,"svc":"Amazon VPC IPAM integrated with AWS Organizations: from the management account delegate a network account as IPAM admin, create pools and share them with AWS RAM","why":"IPAM allocates non-overlapping CIDRs from pools and monitors usage org-wide."},{"p":2,"svc":"AWS PrivateLink: endpoint service (Network Load Balancer) in the startup VPC + interface endpoint in the main VPC","why":"PrivateLink exposes one service without routing between the VPCs, so overlapping CIDRs don't matter."},{"p":3,"svc":"Add a secondary VPC CIDR (e.g. 100.64.0.0/16) and use Amazon VPC CNI custom networking for pod subnets","why":"Pods get IPs from the new range without rebuilding the VPC or cluster.","also":"IPv6 EKS cluster for a new build"},{"p":4,"svc":"AWS Local Zones (extend the VPC with a Local Zone subnet)","why":"Puts compute in that metro area for single-digit-millisecond latency to nearby users."}],"traps":["VPC peering or Transit Gateway with the startup: neither routes between overlapping CIDRs without re-addressing or NAT appliances.","Making the management account the IPAM account: not allowed. The management account delegates IPAM to a member (network) account from the IPAM console or with enable-ipam-organization-admin-account.","AWS Wavelength for the traders: it is for 5G carrier networks; Local Zones serve a metro area over normal connectivity."],"extra":"PrivateLink is one-way (consumer -> provider) and works across accounts and with overlapping CIDRs."},{"task":"1.2","n":1,"title":"Hospital network: SSO from Entra ID","scenario":"A hospital network has 2,000 staff in Microsoft Entra ID and 60 AWS accounts in AWS Organizations. Today each account has its own IAM users.","problems":["Staff must sign in once with their Entra ID credentials and reach any account; remove IAM users.","Joiners and leavers in Entra ID must appear and disappear in AWS automatically.","DBAs need read-only in production accounts but full admin in development accounts.","Access to patient-data buckets must follow each user's department attribute from Entra ID."],"constraint":"Centrally managed, least operational overhead.","hint":"One AWS sign-in service set up once for the org, a federation standard, a provisioning standard, reusable role templates, and attributes.","answer":[{"p":1,"svc":"IAM Identity Center (organization instance enabled in the management account, admin delegated to a member account) with Entra ID as external IdP via SAML 2.0","why":"One SSO portal to all accounts in the org, federated to the existing IdP."},{"p":2,"svc":"SCIM automatic provisioning from Entra ID to IAM Identity Center","why":"Users and groups sync automatically, so leavers lose access without manual work."},{"p":3,"svc":"Permission sets (ReadOnly, AdministratorAccess) + account assignments of the DBA group: ReadOnly to prod accounts, Admin to dev accounts","why":"A permission set becomes an IAM role in each assigned account; one group gets different access per account."},{"p":4,"svc":"Attribute-based access control (ABAC) in IAM Identity Center: map the department attribute and use aws:PrincipalTag in policies","why":"One policy grants access by matching the user's Department tag (aws:PrincipalTag) to the bucket tag (S3 ABAC turned on per bucket) or to a ${aws:PrincipalTag/Department} prefix, instead of one policy per department."}],"traps":["IAM SAML identity provider in each of the 60 accounts: works but is per-account, not central.","AWS Managed Microsoft AD or AD Connector: not needed when the IdP is Entra ID (cloud SAML + SCIM).","Doing everything from the management account: delegated admin can't manage permission sets provisioned to the management account, so keep workloads out of it and use a delegated admin."],"extra":"Permission set = template; assignment = group + permission set + account. Identity Center creates the AWSReservedSSO_ roles."},{"task":"1.2","n":2,"title":"Ad-tech: cross-account data and a vendor","scenario":"An ad-tech company keeps raw click data in a bucket in its Data account (B). A Lambda function in the Analytics account (A) must read it.","problems":["Lambda reads fail; objects are encrypted with SSE-KMS using the aws/s3 key.","A third-party fraud-scoring SaaS needs read access to one prefix in account B.","Security must find any bucket, key or role that grants access to principals outside the organization.","Public HTTPS certificates for the ALBs must renew without manual work."],"constraint":"Least privilege, least operational overhead.","hint":"Cross-account access needs both sides plus the key; vendors get a role with a secret condition; one analyzer uses the org as its zone of trust.","answer":[{"p":1,"svc":"Re-encrypt with a customer managed KMS key; key policy in B allows A's role kms:Decrypt; bucket policy in B allows the role; role's IAM policy in A allows s3:GetObject + kms:Decrypt","why":"Cross-account needs permission on both sides, and the AWS managed aws/s3 key's policy can't be changed to trust another account."},{"p":2,"svc":"Cross-account IAM role in B with a trust policy for the vendor's account + sts:ExternalId condition, permissions scoped to the prefix","why":"The vendor assumes the role with STS; the external ID prevents the confused-deputy problem."},{"p":3,"svc":"IAM Access Analyzer external access analyzer with the organization as zone of trust, created in every Region from a delegated admin account","why":"Flags resource policies that grant access to anyone outside the org."},{"p":4,"svc":"AWS Certificate Manager public certificates with DNS validation","why":"ACM auto-renews DNS-validated certificates while the CNAME record stays in place."}],"traps":["Granting access to the aws/s3 key: its key policy can't be edited, so cross-account decrypt is impossible.","Creating an IAM user and giving the vendor access keys: long-term credentials and no confused-deputy protection.","Email-validated ACM certificates: renewal needs someone to approve an email."],"extra":"Same-account access: IAM policy OR resource policy is enough; cross-account: both are required (plus key policy for KMS)."},{"task":"1.2","n":3,"title":"Power utility: org-wide threat detection","scenario":"A power utility has 80 accounts in AWS Organizations across four Regions. A security tooling account exists in the Security OU.","problems":["Threat detection must run in every account and Region, including accounts created later.","Security analysts want all posture findings from all Regions in one Region.","High-severity findings must open a ServiceNow ticket automatically.","The on-call engineer must also get an SMS.","Analysts need a visual graph to investigate a compromised role."],"constraint":"Centrally managed, least operational overhead.","hint":"Delegate, auto-enable, aggregate, then route events: one target for machines, another for people.","answer":[{"p":1,"svc":"Amazon GuardDuty: from the management account designate the security tooling account as delegated admin in each Region, then turn on auto-enable for all member accounts","why":"GuardDuty is regional; delegated admin + auto-enable covers existing and new accounts."},{"p":2,"svc":"AWS Security Hub CSPM with delegated admin, central configuration and cross-Region aggregation into a home Region","why":"One place to see findings from every account and Region.","also":"The new AWS Security Hub with the same delegated-admin, home-Region setup"},{"p":3,"svc":"Amazon EventBridge rule (severity filter) in the admin account -> API destination to ServiceNow","why":"API destinations call third-party HTTP APIs directly with no code.","also":"EventBridge -> Lambda that calls ServiceNow, or the Security Hub ServiceNow integration"},{"p":4,"svc":"Amazon EventBridge -> Amazon SNS topic with SMS subscription","why":"SNS is the notification service for people (SMS, email)."},{"p":5,"svc":"Amazon Detective (delegated admin in the same tooling account)","why":"Builds behaviour graphs from CloudTrail, VPC Flow Logs and other sources for investigations."}],"traps":["Using the management account as GuardDuty admin: works but against best practice; delegate to the security tooling account.","Enabling GuardDuty in one Region only: findings and the delegated admin are per Region.","Believing Detective requires GuardDuty first: no longer a prerequisite."],"extra":"Security Hub CSPM central configuration lets the delegated admin apply configuration policies to OUs in all linked Regions."},{"task":"1.3","n":1,"title":"Pharma: org-wide backups that can't be deleted","scenario":"A pharmaceutical company has 50 accounts in AWS Organizations running EC2, RDS and EFS. Regulators require 7-year retention.","problems":["Backup schedules must be set centrally and apply automatically to new accounts by tag.","Every backup needs a copy in a central backup account in another Region.","Some RDS copies fail to copy across accounts.","Nobody, including root, may delete or shorten retention of the central copies.","Recovery must be possible even if the organization's management account is compromised."],"constraint":"Centrally managed, least operational overhead.","hint":"Org policies with a delegated admin, a copy rule, the right key type, an immutable lock, an isolated vault.","answer":[{"p":1,"svc":"AWS Backup backup policies in AWS Organizations: in the management account enable the backup policy type, register a delegated admin, attach policies to OUs (tag-based)","why":"Policies inherit to every account in the OU, including new ones."},{"p":2,"svc":"Cross-account + cross-Region copy rule to the central vault (turn on cross-account backup in the management account; vault access policy allows the org)","why":"The plan's copy action writes to a vault in another account and Region."},{"p":3,"svc":"Encrypt sources with customer managed KMS keys and share the key with the backup account","why":"Resources encrypted with AWS managed keys can't be copied across accounts."},{"p":4,"svc":"AWS Backup Vault Lock in compliance mode on the central vault","why":"After the grace period ends, the lock and retention can't be changed or removed by anyone, including root or AWS."},{"p":5,"svc":"Logically air-gapped vault associated with a multi-party approval team in a separate recovery organization","why":"If the primary organization is compromised, approvers in the recovery organization can give a recovery account access to the locked vault and restore from it.","also":"Logically air-gapped vault shared to a recovery account through AWS RAM (only covers cases where the organization itself is still trusted)"}],"traps":["Vault Lock governance mode: users with enough IAM permission can remove it.","S3 Object Lock for this: it only protects S3 objects, not EC2/RDS/EFS recovery points.","Per-account backup plans from each account: no central control and new accounts are missed."],"extra":"Backup policies need both the policy type enabled and (for cross-account copy) cross-account backup turned on in the management account."},{"task":"1.3","n":2,"title":"Travel booking: matching DR to RTO/RPO","scenario":"An online travel agency runs in eu-west-1 on Aurora MySQL with EC2 Auto Scaling app servers. It needs a DR Region.","problems":["Booking data: RPO about 1 second, RTO under 1 minute for the database.","App tier: RTO 30 minutes is acceptable and the budget is tight.","Quarterly DR tests must move the writer to the DR Region with zero data loss.","Apps must not change connection strings after the writer moves.","Users must be sent to the DR Region automatically when the primary is unhealthy."],"constraint":"Most cost-effective solution that meets RTO/RPO.","hint":"Storage-level database replication across Regions; data live but compute off; planned vs unplanned move; one endpoint name that follows the writer; DNS health.","answer":[{"p":1,"svc":"Aurora Global Database (secondary cluster in the DR Region)","why":"Storage-based replication, typically under 1 second lag, and promotion in about a minute."},{"p":2,"svc":"Pilot light: AMIs/launch templates and IaC ready, Auto Scaling group at 0 (or minimal) in the DR Region","why":"Data is replicated but compute is off, which meets a 30-minute RTO at lowest cost."},{"p":3,"svc":"Aurora Global Database switchover","why":"Planned operation that waits for replication to catch up, so no data loss; failover is for outages and may lose data."},{"p":4,"svc":"Aurora Global Database global writer endpoint","why":"Always points to the current primary, so connection strings stay the same."},{"p":5,"svc":"Route 53 failover routing with health checks","why":"Automatically answers with the DR endpoint when the primary health check fails.","also":"Route 53 ARC routing controls for manual, controlled failover"}],"traps":["Warm standby for the app tier: a scaled-down running stack costs more than a 30-minute RTO needs.","Cross-Region RDS read replica: asynchronous with more lag, and promoting it changes the endpoint.","Using failover for the DR test: it is meant for unplanned outages and can lose data."],"extra":"Backup/restore (hours) < pilot light (tens of minutes) < warm standby (minutes) < multi-site active/active (near zero)."},{"task":"1.3","n":3,"title":"Factory: recover on-prem servers and legacy EC2","scenario":"A car-parts manufacturer runs 120 Windows and Linux servers on-premises and some workloads on EC2.","problems":["On-premises servers need RPO of seconds and RTO of minutes in AWS, with low cost while idle.","DR must be tested quarterly without stopping replication.","A license-bound EC2 server can't be in an Auto Scaling group but must recover automatically if its host fails.","The web tier must survive the loss of an AZ automatically."],"constraint":"Least operational overhead, most cost-effective.","hint":"Block-level replication to a cheap staging area; non-disruptive tests; an instance-level recover action; scale out across AZs.","answer":[{"p":1,"svc":"AWS Elastic Disaster Recovery (DRS)","why":"Continuous block-level replication to a low-cost staging area; full servers are launched only at recovery."},{"p":2,"svc":"Elastic Disaster Recovery recovery drills","why":"Launch drill instances from point-in-time snapshots while replication keeps running."},{"p":3,"svc":"EC2 automatic recovery (default simplified recovery or a CloudWatch StatusCheckFailed_System alarm with the recover action)","why":"Moves the instance to healthy hardware keeping instance ID, private IP and EBS volumes.","also":"Dedicated Host auto recovery, if the license is bound to a Dedicated Host"},{"p":4,"svc":"EC2 Auto Scaling group across 3 AZs behind an Application Load Balancer with ELB health checks","why":"Scale out across AZs; unhealthy instances are replaced automatically."}],"traps":["AWS Application Migration Service: for migrating, not ongoing DR.","Scaling up the web server to a bigger instance: still one AZ, still a single point of failure.","CloudEndure Disaster Recovery: retired; Elastic Disaster Recovery replaces it."],"extra":"DRS also supports failback to on-premises and cross-Region / cross-AZ DR for EC2."},{"task":"1.4","n":1,"title":"University: landing zone and account vending","scenario":"A university wants faculties to get AWS accounts quickly while IT keeps guardrails. It has no multi-account setup yet.","problems":["Set up a governed multi-account baseline with central logging and an audit account, in the least time.","Faculties request accounts self-service with an approved network baseline; IT prefers Terraform and GitOps.","Every new account must get a custom IAM role and extra AWS Config rules automatically.","Flag untagged S3 buckets without blocking their creation.","The first faculty needs 15 accounts immediately."],"constraint":"Least operational overhead.","hint":"A managed landing-zone service, its account vending, its customization pipeline, the control type that reports, and a quota.","answer":[{"p":1,"svc":"AWS Control Tower landing zone (set up from the management account, Config and CloudTrail integrations enabled; Security OU with Log Archive and Audit accounts and mandatory controls)","why":"Ready-made, governed multi-account setup with central CloudTrail/Config logging."},{"p":2,"svc":"Account Factory for Terraform (AFT)","why":"GitOps account vending through Terraform pipelines on top of Control Tower.","also":"Account Factory (Service Catalog) if Terraform weren't required"},{"p":3,"svc":"AFT global customizations (Terraform applied to every account AFT vends)","why":"Applies baseline resources to every vended account automatically.","also":"Customizations for AWS Control Tower (CfCT) or service-managed StackSets with automatic deployment"},{"p":4,"svc":"Control Tower detective control (AWS Config rule)","why":"Detective controls report non-compliance; preventive (SCP/RCP) blocks; proactive (CloudFormation hooks) checks before provisioning.","also":"AWS Config managed rule required-tags, deployed through AFT or an organization conformance pack"},{"p":5,"svc":"Service Quotas: request an increase of the Organizations account quota","why":"A new organization's quota defaults to 10 accounts (sometimes lower). The management account requests the increase in Service Quotas in us-east-1."}],"traps":["Preventive control (SCP) for untagged buckets: it blocks creation, which the requirement forbids.","Building the landing zone by hand with Organizations + StackSets: works but far more effort.","Disabling mandatory controls to simplify: they can't be turned off."],"extra":"Don't move or delete the Log Archive and Audit accounts or change Control Tower-managed resources outside Control Tower (drift)."},{"task":"1.4","n":2,"title":"E-commerce: share networks, not headaches","scenario":"An e-commerce group has a central network account and many application accounts in AWS Organizations.","problems":["Thirty small app teams need their own accounts but must not manage VPCs, and NAT gateway costs must be minimized.","Two large business units keep their own VPCs and need routing to shared services and on-premises.","Resource shares must work across the org without invitations.","Nobody may share resources with accounts outside the organization.","Teams should launch only pre-approved architectures."],"constraint":"Least operational overhead, lowest cost.","hint":"Share subnets, share a hub, flip one setting in the sharing service, deny one API condition, publish a portfolio.","answer":[{"p":1,"svc":"VPC sharing: share subnets from the network account to the app accounts with AWS RAM","why":"Participants launch resources into central subnets and share NAT gateways and endpoints; owners keep control of the network."},{"p":2,"svc":"Transit Gateway in the network account shared with AWS RAM; BU VPCs attach to it","why":"Hub-and-spoke routing to shared services and the Direct Connect/VPN attachment."},{"p":3,"svc":"Turn on sharing with AWS Organizations in AWS RAM (from the management account)","why":"Shares to the org or OUs are accepted automatically, without invitations."},{"p":4,"svc":"SCP denying ram:CreateResourceShare and ram:UpdateResourceShare when ram:RequestedAllowsExternalPrincipals is true","why":"Blocks external sharing for every account in the org."},{"p":5,"svc":"AWS Service Catalog portfolio shared to the organization or OUs","why":"Teams launch only approved CloudFormation/Terraform products."}],"traps":["VPC peering mesh: no transitive routing and many connections to manage.","Expecting participant accounts to edit route tables in a shared VPC: only the owner can change VPCs, subnets and route tables.","Leaving RAM in invitation mode: every share needs manual acceptance."],"extra":"VPC sharing = same VPC, many accounts (cheapest); TGW = many VPCs, one router."},{"task":"1.4","n":3,"title":"Game studio: central logs and events","scenario":"A game studio has 70 accounts under AWS Control Tower in four Regions. Security and operations teams sit in separate accounts.","problems":["All API activity from every account and Region must land in tamper-proof central storage.","One view of AWS Config compliance across all accounts and Regions.","Operations wants AWS scheduled-maintenance events from all accounts in one account.","Security wants specific EventBridge events from every account forwarded to its account.","CostCenter tag values must follow a standard list."],"constraint":"Centrally managed, least operational overhead.","hint":"One trail for the org, one aggregator, an org-wide health view, a cross-account bus, an org policy type.","answer":[{"p":1,"svc":"Organization trail in AWS CloudTrail (from the management account or CloudTrail delegated admin) -> S3 bucket in the Log Archive account with S3 Object Lock","why":"One multi-Region trail logs all member accounts; Object Lock makes logs immutable."},{"p":2,"svc":"AWS Config aggregator (organization) in the Audit/delegated admin account, plus organization conformance packs","why":"Aggregates compliance data from every account and Region into one view."},{"p":3,"svc":"AWS Health organizational view with a delegated admin account (+ EventBridge rules there)","why":"Shows Health events for all member accounts in one place."},{"p":4,"svc":"EventBridge rules in each account (deployed with service-managed CloudFormation StackSets) targeting a central event bus whose resource policy allows aws:PrincipalOrgID","why":"Cross-account event bus routing collects events centrally; StackSets auto-deploys to new accounts."},{"p":5,"svc":"Tag policies in AWS Organizations","why":"Standardize tag keys and allowed values; enforcement blocks non-compliant values on supported resource types."}],"traps":["CloudTrail Lake: closed to new customers since May 31 2026; use an org trail to S3.","A separate trail in each account: more work, and account admins could stop it.","SCPs to standardize tag values: tag policies are the purpose-built answer (SCPs can require a tag to exist)."],"extra":"When its CloudTrail integration is enabled (optional since landing zone 4.0), Control Tower creates an organization trail. Adding Object Lock and a Config aggregator in Audit completes the picture."},{"task":"1.5","n":1,"title":"Logistics SaaS: pick each purchase option","scenario":"A logistics SaaS provider wants to cut its AWS bill without hurting reliability.","problems":["Steady compute baseline across EC2 families that change often, plus ECS on Fargate and Lambda.","A stable m7i fleet in one Region that won't change family for three years; maximum discount wanted.","Steady database spend that moves between RDS provisioned and Aurora Serverless v2; a 1-year commitment is fine.","Nightly route-optimization batch jobs that can restart if interrupted.","Guaranteed EC2 capacity in one AZ for a two-week peak, with no long-term commitment."],"constraint":"Most cost-effective.","hint":"Flexible compute commitment, rigid compute commitment, the newest commitment type, spare capacity, reserved capacity without a term.","answer":[{"p":1,"svc":"Compute Savings Plans","why":"Up to 66% off; applies across EC2 families, sizes and Regions plus Fargate and Lambda."},{"p":2,"svc":"EC2 Instance Savings Plans (3-year)","why":"Up to 72% off, locked to one instance family in one Region.","also":"Standard Reserved Instances (3-year)"},{"p":3,"svc":"Database Savings Plans (1-year)","why":"Introduced Dec 2025; applies across supported database services and engines, up to 35% on serverless and 20% on provisioned."},{"p":4,"svc":"EC2 Spot Instances (price-capacity-optimized allocation, several instance types)","why":"Up to 90% off for fault-tolerant, interruptible work."},{"p":5,"svc":"On-Demand Capacity Reservations","why":"Reserve capacity in a specific AZ for any duration with no term; pay On-Demand (can be covered by Savings Plans)."}],"traps":["Reserved Instances for Fargate/Lambda: RIs don't apply; only Compute Savings Plans do.","Spot for the steady baseline: can be interrupted with a 2-minute warning.","Regional RIs or Savings Plans to guarantee capacity: they give a discount, not reserved capacity (zonal RIs reserve capacity but need a 1- or 3-year term)."],"extra":"Ladder: Compute SP (most flexible) -> EC2 Instance SP / RIs (deepest discount, least flexible) -> Spot (interruptible)."},{"task":"1.5","n":2,"title":"Media group: chargeback by cost center","scenario":"A media group with 120 accounts in AWS Organizations must charge AWS costs back to cost centers.","problems":["Every resource must carry a CostCenter tag with a value from an approved list.","Creation of resources without a CostCenter tag must be blocked.","Cost Explorer must group costs by CostCenter.","Shared costs (support, shared networking) must be split across business units.","Finance wants detailed line items queryable with SQL."],"constraint":"Centrally managed, least operational overhead.","hint":"Two org policy types for values and existence, one switch in the payer account, a grouping rule with splits, the newest detailed export.","answer":[{"p":1,"svc":"Tag policies in AWS Organizations (with enforcement for supported resource types)","why":"Defines the tag key and allowed values centrally."},{"p":2,"svc":"SCP denying create actions when aws:RequestTag/CostCenter is null (Null condition)","why":"Tag policies don't block untagged resources; the SCP does."},{"p":3,"svc":"Activate CostCenter as a user-defined cost allocation tag in the management (payer) account's Billing console","why":"Tags appear in Cost Explorer and billing data only after activation in the payer account; the management account can request a backfill of up to 12 months."},{"p":4,"svc":"AWS Cost Categories with split charge rules","why":"Maps accounts and tags to business units and allocates shared costs proportionally, evenly or by fixed percentage."},{"p":5,"svc":"CUR 2.0 via AWS Data Exports to S3, queried with Amazon Athena","why":"Most detailed cost and usage data, in a fixed schema."}],"traps":["Activating cost allocation tags in member accounts: it must be done in the management (payer) account.","Relying on tag policies to block missing tags: they only check values when the tag is present.","Using Tag Editor to fix tags by hand: not preventive and doesn't scale."],"extra":"AWS-generated tags (e.g. aws:createdBy) must also be activated in the payer account."},{"task":"1.5","n":3,"title":"Agritech: rightsizing and spend alarms","scenario":"An agritech company has 40 accounts in AWS Organizations with a mix of EC2, EBS, Lambda, ECS on Fargate and S3.","problems":["Rightsizing recommendations for EC2, EBS volumes, Lambda and Fargate tasks across all accounts, including memory use.","When forecast monthly spend for a project exceeds $50,000, automatically apply a restrictive policy.","Detect unusual spend spikes without setting static thresholds.","An org-wide view of S3 usage, finding buckets with incomplete multipart uploads.","Check idle load balancers and low-utilization instances with all checks."],"constraint":"Least operational overhead.","hint":"A machine-learning recommender with org opt-in, budgets that act, an ML anomaly service, an S3 analytics dashboard, a support-plan-dependent advisor.","answer":[{"p":1,"svc":"AWS Compute Optimizer (opt in all accounts from the management account, delegated admin; CloudWatch agent for memory metrics)","why":"Covers EC2, Auto Scaling groups, EBS, Lambda, ECS on Fargate and more."},{"p":2,"svc":"AWS Budgets with budget actions (forecast-based)","why":"Actions can apply an IAM policy or SCP, or stop EC2/RDS instances, automatically or after approval."},{"p":3,"svc":"AWS Cost Anomaly Detection (monitors + alert subscriptions)","why":"Uses machine learning to find unusual spend without static thresholds."},{"p":4,"svc":"Amazon S3 Storage Lens organization-level dashboard (delegated admin)","why":"Org-wide usage and activity metrics, including incomplete multipart upload bytes."},{"p":5,"svc":"AWS Trusted Advisor (all checks need Business Support+, Enterprise Support or Unified Operations; legacy Business and Enterprise On-Ramp keep them until Jan 1, 2027)","why":"Cost optimization checks flag idle load balancers and low-utilization EC2."}],"traps":["Cost Explorer rightsizing recommendations: EC2 only; Compute Optimizer covers more resource types.","Budgets alerts alone: they notify but don't act; budget actions apply the policy.","CloudWatch billing alarm: static threshold, no ML."],"extra":"Compute Optimizer is free for basic recommendations; enhanced infrastructure metrics (3 months lookback) cost extra."},{"task":"2.1","n":1,"title":"Insurance claims API releases","scenario":"An insurer runs its claims API on AWS Lambda behind API Gateway, deployed with AWS SAM. A bad release last month hit every customer at once.","problems":["New Lambda versions must reach 10% of traffic for 10 minutes, then 100%, and roll back automatically if the error alarm fires.","A routine template update once replaced the production DynamoDB claims table; updates must never be able to modify or replace it.","If the stack is ever deleted, the S3 bucket holding claim photos must stay.","Product owners want to switch a new fraud-scoring rule on or off in seconds without a deployment, with automatic rollback on alarms."],"constraint":"Least operational overhead.","hint":"One traffic-shifting deploy tool driven by an alias, one guard on stack updates, one per-resource attribute for deletes, one managed feature-flag service.","answer":[{"p":1,"svc":"AWS CodeDeploy canary deployment (e.g. Canary10Percent10Minutes) on a Lambda alias via SAM DeploymentPreference + CloudWatch alarm","why":"CodeDeploy shifts alias weights between versions and rolls back automatically when the alarm goes into ALARM."},{"p":2,"svc":"CloudFormation stack policy denying Update:* (Modify/Replace) on the table","why":"A stack policy protects named resources from changes during stack updates."},{"p":3,"svc":"DeletionPolicy: Retain on the S3 bucket","why":"Retain keeps the resource when the stack is deleted or the resource is removed from the template."},{"p":4,"svc":"AWS AppConfig feature flags with a deployment strategy and CloudWatch alarm rollback","why":"Flags change at runtime without redeploying code, and AppConfig rolls the flag back if the alarm fires during the deployment or its bake time."}],"traps":["Termination protection for problem 2 — it only blocks deleting the whole stack, not an update that replaces one resource.","Amazon CloudWatch Evidently for feature flags — discontinued; AppConfig feature flags is the replacement.","Lambda alias weights changed by hand — works but no automatic alarm rollback; CodeDeploy gives that with no custom code."],"extra":"UpdateReplacePolicy (Retain/Snapshot) covers the old resource when an update replaces it; DeletionPolicy covers stack deletes and template removals."},{"task":"2.1","n":2,"title":"E-learning platform upgrade paths","scenario":"An e-learning company is modernizing three workloads with a five-person team that hates patching servers.","problems":["A PHP site on Elastic Beanstalk must deploy each release onto brand-new instances, keep full capacity, and roll back fast by just discarding the new instances.","A new containerized REST API should go live from only a container image, with load balancing and scaling set up for them and no servers to manage.","An existing Amazon ECS service needs blue/green releases: test the new revision on a test listener, then shift all traffic, with automatic rollback.","The production network stack must not be deleted by mistake."],"constraint":"Least operational overhead.","hint":"One Beanstalk deployment policy, one simplified ECS launch option, one native ECS deployment type, one stack-level setting.","answer":[{"p":1,"svc":"Elastic Beanstalk immutable deployment policy","why":"New instances are launched in a temporary Auto Scaling group; rollback is just terminating them, and capacity never drops."},{"p":2,"svc":"Amazon ECS Express Mode (on AWS Fargate)","why":"Takes a container image and provisions Fargate tasks, a load balancer and auto scaling with sensible defaults.","also":"Amazon ECS on AWS Fargate configured directly"},{"p":3,"svc":"Amazon ECS built-in blue/green deployments (ALB with production and test listener rules, bake time, alarm-based rollback)","why":"Since 2025 ECS does blue/green natively without CodeDeploy, including test traffic and automatic rollback.","also":"AWS CodeDeploy blue/green for ECS"},{"p":4,"svc":"CloudFormation termination protection","why":"Blocks stack deletion until someone explicitly disables it."}],"traps":["AWS App Runner for problem 2 — no longer open to new customers; AWS recommends ECS Express Mode as the migration path.","Beanstalk 'rolling with additional batch' — keeps capacity but updates existing instances in place, so rollback means another full deployment.","Beanstalk blue/green (environment URL swap) — also valid but means running and managing a whole second environment; immutable is simpler for this requirement."],"extra":"Ops ladder: EC2 → ECS on EC2 → Beanstalk → Fargate/ECS Express Mode → Lambda."},{"task":"2.1","n":3,"title":"Retail chain golden images and guardrails","scenario":"A retail chain with stores in four AWS Regions runs its point-of-sale back end on EC2 and RDS, all defined in CloudFormation.","problems":["Every month a hardened AMI with the latest patches must be built, tested and copied to all four Regions automatically.","Store developers must launch only approved, pre-configured stacks without having IAM rights to the underlying services.","If a template change forces CloudFormation to replace the RDS instance, a snapshot of the old database must be kept.","Engineers must see exactly which resources an update will modify or replace before it runs."],"constraint":"Least operational overhead.","hint":"One managed image pipeline, one self-service catalog, one update-time resource attribute, one preview feature.","answer":[{"p":1,"svc":"EC2 Image Builder pipeline (schedule, test components, distribution settings for four Regions)","why":"Builds, tests and distributes AMIs on a schedule without custom scripts."},{"p":2,"svc":"AWS Service Catalog portfolio with launch constraints (launch role)","why":"Users launch approved products; the launch role holds the service permissions, not the user."},{"p":3,"svc":"UpdateReplacePolicy: Snapshot on the AWS::RDS::DBInstance","why":"Takes a snapshot of the old instance when an update replaces it."},{"p":4,"svc":"CloudFormation change sets","why":"Show the planned adds, modifications and replacements before you execute the update."}],"traps":["DeletionPolicy: Snapshot for problem 3 — applies when the resource is deleted or removed from the template, not when an update replaces it.","Systems Manager Automation scripts for AMIs — works but needs custom runbooks; Image Builder is the managed pipeline.","CloudFormation drift detection for problem 4 — finds changes made outside CloudFormation, it does not preview an update."],"extra":"Use both DeletionPolicy and UpdateReplacePolicy on stateful resources to cover delete and replace."},{"task":"2.2","n":1,"title":"Freight company pilot-light DR","scenario":"A freight company runs in us-east-1 and needs DR in us-west-2: RPO under 1 minute for servers, RTO under 1 hour.","problems":["Twelve legacy Windows EC2 servers with hand-installed software cannot be rebuilt from code.","An Amazon RDS for PostgreSQL Multi-AZ database must have a current copy in us-west-2.","Customers must reach the DR site automatically when the primary health check fails.","Scanned shipping documents in S3 need replication with a contractual, SLA-backed 15-minute target."],"constraint":"Most cost-effective solution that meets the RPO and RTO.","hint":"Block-level server replication, a database copy in another Region, a DNS policy, and an S3 replication add-on.","answer":[{"p":1,"svc":"AWS Elastic Disaster Recovery (DRS)","why":"Continuous block-level replication to low-cost staging resources gives seconds RPO and launches servers in minutes."},{"p":2,"svc":"RDS cross-Region read replica (promote during DR)","why":"Asynchronous replication to another Region; promote it to a standalone writer on failover."},{"p":3,"svc":"Route 53 failover routing with health checks","why":"Primary record serves while healthy; Route 53 returns the secondary record when the health check fails."},{"p":4,"svc":"S3 Cross-Region Replication with Replication Time Control (RTC)","why":"RTC adds a 15-minute replication SLA and replication metrics/notifications."}],"traps":["RDS Multi-AZ (instance or DB cluster) as DR — both are single-Region; they don't survive a Region outage.","AWS Backup cross-Region copies of the Windows servers — RPO is hours, not under a minute.","Plain CRR without RTC — most objects replicate in seconds but there is no SLA."],"extra":"S3 RTC is designed to replicate 99.99% of objects within 15 minutes; the SLA commits to 99.9%."},{"task":"2.2","n":2,"title":"Sports-betting wallet across three Regions","scenario":"An online sports-betting operator runs in three Regions and must keep customer wallets correct during Regional events.","problems":["Wallet balances in DynamoDB must give strongly consistent reads in any Region with an RPO of zero.","Bet history in Aurora PostgreSQL must move its writer to another Region for a quarterly regulator drill with no data loss.","Operators need a highly reliable manual switch to move player traffic between Regions, even if the Route 53 console is impaired.","The team must prove the stack survives an AZ outage by injecting real faults in a controlled experiment."],"constraint":"Lowest RPO with the least custom code.","hint":"One DynamoDB consistency mode, one planned Aurora operation, one Route 53 recovery feature, one chaos-engineering service.","answer":[{"p":1,"svc":"DynamoDB global tables with multi-Region strong consistency (MRSC)","why":"Writes replicate synchronously, so any Region can serve strongly consistent reads and RPO is zero."},{"p":2,"svc":"Aurora Global Database switchover (managed planned)","why":"Switchover syncs the secondary before promoting it, so no data is lost; the global writer endpoint follows the new primary."},{"p":3,"svc":"Route 53 ARC routing controls","why":"On/off switches on a highly available data plane that change DNS failover without the Route 53 control plane.","also":"Route 53 ARC Region switch"},{"p":4,"svc":"AWS Fault Injection Service (FIS) AZ power-interruption scenario","why":"Runs controlled fault experiments with stop conditions tied to CloudWatch alarms."}],"traps":["DynamoDB global tables default (multi-Region eventual consistency) — last writer wins, so RPO isn't zero and reads elsewhere may be stale.","Aurora Global Database failover for a drill — it is meant for unplanned outages and can lose recently committed data.","Route 53 ARC readiness checks — closed to new customers (AWS points to Region switch plan evaluation); routing controls are the switch."],"extra":"MRSC needs three Regions (or two replicas plus a witness Region) and has higher write latency than eventual consistency."},{"task":"2.2","n":3,"title":"City government backup baseline","scenario":"A city government has 30 AWS accounts in AWS Organizations running EC2, EBS, RDS and EFS. RTO is 24 hours.","problems":["Nightly backups of all tagged resources must be enforced centrally across every account.","Backup copies must go to a separate account in another Region, and no one, not even root, may delete them early.","Leaders want each application assessed against its RTO/RPO targets, with recommendations.","The on-call team must get a ticket automatically when any backup job fails."],"constraint":"Least operational overhead and most cost-effective.","hint":"An Organizations policy type, a locked vault, a resilience assessment service, and an event rule.","answer":[{"p":1,"svc":"AWS Backup backup policies in AWS Organizations (delegated administrator account)","why":"Org-level policies create backup plans in every member account and select resources by tag."},{"p":2,"svc":"AWS Backup cross-account, cross-Region copy to a central vault with Vault Lock in compliance mode","why":"Compliance-mode Vault Lock makes recovery points immutable until retention ends, even for root, once the grace time (minimum 3 days) has passed.","also":"Logically air-gapped vault"},{"p":3,"svc":"AWS Resilience Hub","why":"Assesses each app against its resiliency policy (RTO/RPO) and recommends fixes."},{"p":4,"svc":"Amazon EventBridge rule on AWS Backup job state FAILED → Lambda or API destination to the ticket system","why":"Backup emits job-state events; EventBridge routes failures to automation."}],"traps":["AWS Elastic Disaster Recovery — far more than a 24-hour RTO needs; backup and restore is the cheaper fit.","Vault Lock governance mode — users with enough IAM permissions can remove it.","SNS email for problem 4 — notifies people but doesn't open a ticket."],"extra":"For resources AWS Backup doesn't fully manage (e.g. EBS, EC2, RDS), cross-account copies need the source encrypted with a customer managed KMS key shared with the destination account; AWS managed keys can't be shared. Fully managed types (e.g. EFS) use the vault's key."},{"task":"2.3","n":1,"title":"Pharmacy chain network controls","scenario":"A pharmacy chain runs a prescription app in a VPC with web, app and database tiers. Auditors list four findings.","problems":["Instances can reach any internet site; outbound HTTPS must be limited to a list of approved domains, centrally for all VPCs.","A known malicious IP range must be explicitly blocked at the subnet edge.","Database instances should accept traffic only from the app tier, even as app instances scale in and out.","Contract pharmacists need browser access to one internal web app, checked per request on identity and device posture, without a VPN."],"constraint":"Least operational overhead.","hint":"A managed stateful firewall, a stateless subnet control, a stateful instance control that can reference another group, and zero-trust app access.","answer":[{"p":1,"svc":"AWS Network Firewall (stateful domain allowlist rules) in a central inspection VPC via Transit Gateway","why":"Filters outbound traffic by domain (TLS SNI/HTTP host) for all attached VPCs."},{"p":2,"svc":"Network ACL deny rule","why":"NACLs support explicit deny on subnet boundaries; they are stateless."},{"p":3,"svc":"Security group on the database allowing the app tier's security group as the source","why":"Referencing a security group follows instances automatically as they scale."},{"p":4,"svc":"AWS Verified Access","why":"Evaluates identity and device-posture policies on every request to the app, with no VPN."}],"traps":["Security group deny rule — security groups only have allow rules.","AWS WAF for egress filtering — WAF protects inbound HTTP to CloudFront/ALB/API Gateway, not outbound traffic.","AWS Client VPN for contractors — gives network-level access and no per-request posture check.","Route 53 Resolver DNS Firewall alone — blocks DNS lookups for domains, but instances can still connect directly by IP; Network Firewall inspects the actual traffic."],"extra":"NACL rules are evaluated in number order and need return ephemeral ports (1024–65535) allowed; security groups are stateful."},{"task":"2.3","n":2,"title":"Defense contractor key custody","scenario":"A defense contractor is moving sensitive workloads to AWS and has strict key-custody rules.","problems":["Keys for S3 and EBS encryption must be in single-tenant HSMs that only the company controls, yet still work with AWS service integrations.","For one classified project, key material must never leave the company's own on-premises HSMs.","Public TLS certificates for 40 ALB and CloudFront domains must renew automatically.","Internal microservices need private certificates for mutual TLS from a managed internal CA."],"constraint":"Least operational overhead.","hint":"Two kinds of KMS key store, one free managed certificate service, and its private-CA sibling.","answer":[{"p":1,"svc":"AWS KMS custom key store backed by AWS CloudHSM","why":"KMS keys whose material lives in your dedicated CloudHSM cluster, usable by any KMS-integrated service."},{"p":2,"svc":"AWS KMS external key store (XKS)","why":"KMS calls your external key manager through a proxy, so key material stays outside AWS."},{"p":3,"svc":"AWS Certificate Manager (ACM) public certificates with DNS validation","why":"ACM renews DNS-validated certificates automatically on integrated services."},{"p":4,"svc":"AWS Private Certificate Authority","why":"Managed private CA for internal mTLS; private certificates requested through ACM from it renew automatically."}],"traps":["Standard AWS KMS keys for problem 1 — KMS HSMs are FIPS-validated but multi-tenant and AWS-operated, not single-tenant.","Using CloudHSM directly for S3/EBS — services integrate with KMS, not CloudHSM, so you'd need the custom key store.","ACM email validation — renewal needs someone to respond to emails; DNS validation renews by itself."],"extra":"For CloudFront, ACM certificates must be requested in us-east-1."},{"task":"2.3","n":3,"title":"Online retailer compliance findings","scenario":"An online retailer with 20 accounts in AWS Organizations must pass a PCI DSS audit.","problems":["Find which S3 buckets contain credit card numbers.","Continuously scan EC2 instances, ECR container images and Lambda functions for known CVEs.","Install critical OS patches automatically in a weekly maintenance window and show auditors patch compliance per instance.","Show one cross-account dashboard of automated PCI DSS control checks."],"constraint":"Least operational overhead.","hint":"A sensitive-data discovery service, a vulnerability scanner, a Systems Manager capability, and a posture-management service with standards.","answer":[{"p":1,"svc":"Amazon Macie","why":"Uses managed data identifiers to discover sensitive data such as card numbers in S3."},{"p":2,"svc":"Amazon Inspector","why":"Continuously scans EC2, ECR images and Lambda for software vulnerabilities and network exposure."},{"p":3,"svc":"AWS Systems Manager Patch Manager (patch baselines + Maintenance Windows or a Quick Setup patch policy)","why":"Applies approved patches on a schedule and reports compliance per instance."},{"p":4,"svc":"AWS Security Hub CSPM with the PCI DSS standard, delegated administrator and cross-Region aggregation","why":"Runs automated control checks and aggregates findings from all accounts.","also":"AWS Config conformance pack for PCI DSS"}],"traps":["Amazon GuardDuty for CVEs — it detects threats and suspicious behaviour, not software vulnerabilities.","Inspector for credit card data — scans code and packages, not the contents of S3 objects.","Run Command with custom update scripts (e.g. yum update) — no patch baseline or compliance reporting; Patch Manager provides both."],"extra":"Security Hub CSPM is the original posture service; the newer AWS Security Hub correlates findings from GuardDuty, Inspector, Macie and CSPM."},{"task":"2.4","n":1,"title":"Food-delivery order pipeline","scenario":"A food-delivery app is fixing four reliability gaps in its order pipeline.","problems":["The order workflow calls a flaky restaurant API; it must retry with backoff and, if retries run out, refund the customer.","Order-placed events must reach three teams' services filtered by content, and the team wants to replay past events after a bug fix.","The Aurora MySQL writer failed and recovery took minutes; failover should take about 30 seconds.","The session cache on a single ElastiCache node lost data when the node failed."],"constraint":"Least custom code.","hint":"A workflow service's error handling, an event bus feature, a database read copy, and a cache deployment option.","answer":[{"p":1,"svc":"AWS Step Functions Retry (exponential backoff) and Catch to a refund state","why":"Retry and Catch are built into the state machine, so there is no custom retry code."},{"p":2,"svc":"Amazon EventBridge event bus with content-filtering rules + archive and replay","why":"Rules route events by pattern to each target; archives let you replay events later."},{"p":3,"svc":"Aurora Replicas in other AZs (with failover priority tiers)","why":"Aurora promotes a replica automatically; service is typically back in under 60 seconds and often under 30. RDS Proxy can shorten failover further by avoiding DNS caching."},{"p":4,"svc":"Amazon ElastiCache (Valkey or Redis OSS) with Multi-AZ and automatic failover (a replica in another AZ)","why":"A replica is promoted if the primary fails, so the cache stays available.","also":"Amazon ElastiCache Serverless (Valkey or Redis OSS), which replicates data across multiple AZs automatically"}],"traps":["SNS → SQS fan-out for problem 2 — can filter, but has no built-in archive and replay of past events.","Relying on Aurora's six-way storage copies across three AZs — they protect the data, but with no replica instance Aurora must create a new writer, which takes minutes.","ElastiCache for Memcached — no replication or failover, so data is lost when a node fails."],"extra":"Apps connect to the cluster endpoint, which always points to the current writer, so no connection-string change is needed after failover."},{"task":"2.4","n":2,"title":"Transit agency trip planner","scenario":"A public transit agency's trip planner runs in one Region across three AZs and must stay up during storms, when demand spikes.","problems":["The EC2 web tier must keep full capacity if one AZ fails, without launching new instances during the event.","A provisioned DynamoDB table throttles at rush hours and is over-provisioned at night.","An ECS on Fargate API must scale on requests per task behind its ALB.","If the whole Region is unhealthy, riders must see a static 'service status' page from another Region."],"constraint":"Highest availability with the least manual work.","hint":"A capacity rule for surviving an AZ loss, a scaling service for non-EC2 resources (used twice), and a DNS policy with a health check.","answer":[{"p":1,"svc":"EC2 Auto Scaling group across three AZs sized so any two AZs carry peak load (≈150% capacity) — static stability","why":"Capacity already exists in the surviving AZs, so recovery doesn't depend on launching instances."},{"p":2,"svc":"Application Auto Scaling target tracking on DynamoDB read/write capacity","why":"Adjusts provisioned capacity to keep utilization at a target.","also":"DynamoDB on-demand capacity mode"},{"p":3,"svc":"Application Auto Scaling (ECS Service Auto Scaling) target tracking on ALBRequestCountPerTarget","why":"Adds or removes tasks to keep requests per task at a target."},{"p":4,"svc":"Route 53 failover routing with a health check; secondary record points to an S3 static website (or CloudFront) in another Region","why":"Route 53 answers with the static page when the primary fails its health check."}],"traps":["Relying on Auto Scaling to replace capacity after the AZ fails — launches may be slow or fail during an AZ event; static stability avoids that.","EC2 Auto Scaling for DynamoDB or ECS tasks — those scale through Application Auto Scaling.","Latency-based routing alone — it chooses the nearest Region, not a backup page, unless health checks are linked."],"extra":"Static stability = the system keeps working without control-plane actions (launching, scaling) when a dependency fails. Pair static stability with ARC zonal autoshift so traffic leaves the impaired AZ automatically."},{"task":"2.4","n":3,"title":"Diagnostics lab data reliability","scenario":"A medical diagnostics lab stores results on AWS and is reviewing failure modes.","problems":["PDF lab reports are opened about once a month and must load in milliseconds; they must survive the loss of an AZ at the lowest storage cost.","Route 53 health checks fail against an internal API that has only private IPs.","Heavy report queries slow the Aurora PostgreSQL writer.","An EventBridge rule sends results to a Lambda function that sometimes fails; no event may be lost."],"constraint":"Most cost-effective and least change.","hint":"A multi-AZ infrequent-access storage class, a health check built on a metric, a read endpoint, and target-level error handling.","answer":[{"p":1,"svc":"S3 Standard-IA","why":"Stores data across at least three AZs at a lower price for infrequent access."},{"p":2,"svc":"Route 53 health check based on a CloudWatch alarm","why":"Route 53 checkers on the internet can't reach private IPs; an alarm on an internal metric can drive the check."},{"p":3,"svc":"Aurora Replicas + reader endpoint for the report queries","why":"The reader endpoint spreads reads across replicas and takes load off the writer."},{"p":4,"svc":"Lambda asynchronous invocation config (retry attempts 0–2, maximum event age) with an on-failure destination to SQS, plus an SQS DLQ on the EventBridge target for delivery failures","why":"EventBridge hands the event to Lambda asynchronously, so function errors are retried by Lambda and then sent to the on-failure destination; the EventBridge target DLQ only catches events it couldn't deliver to Lambda."}],"traps":["S3 One Zone-IA — cheaper, but data is in one AZ and is lost if that AZ is destroyed.","Assuming S3 durability (11 nines) means availability — Standard-IA has lower availability (99.9% design) than Standard but the same durability.","A bigger writer instance — costs more and still mixes reports with transactions; replicas offload reads and add failover targets.","EventBridge target DLQ alone — it never sees Lambda function errors, because EventBridge treats the event as delivered once Lambda accepts it.","S3 Glacier Instant Retrieval — cheaper to store, but retrieval costs more and there's a 90-day minimum; it suits data read about once a quarter."],"extra":"EventBridge retries delivery to a target for up to 24 hours and 185 attempts by default; Lambda async invocations
