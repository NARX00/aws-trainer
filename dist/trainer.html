<script id="aws-routing-module-script">
(function(){'use strict';
if(document.getElementById('awsroute-launch'))return;
const isTrainer=true;
const questions=[
 {stem:'VPC A (10.1.0.0/16) and VPC B (10.2.0.0/16) are attached to a TGW. Traffic arrives from A. A’s associated TGW route table lacks a route to B. What is the most direct correction?', opts:['Propagate A’s attachment into A’s associated TGW table','Propagate B’s attachment into A’s associated TGW table','Create a Direct Connect Gateway','Share VPC B through AWS RAM'], correct:1, reason:'The route table ASSOCIATED with the incoming A attachment is consulted. It needs a destination route 10.2.0.0/16 → B attachment. Propagate B into that table (or add an appropriate static route). Propagating A instead does not supply a route to B.', trap:'Association chooses the lookup table for incoming traffic; propagation teaches selected tables reachable destinations.'},
 {stem:'A can send traffic to B through Transit Gateway, but B cannot reply. Both VPC subnet tables and security rules are otherwise correct. What should you investigate first?',opts:['The TGW route table associated with B’s attachment for a route back to A','The DX Gateway route quota','A peering connection between A and B','Whether AWS RAM was enabled for all accounts'],correct:0,reason:'The return packet enters TGW from B. That means B’s associated TGW route table must know 10.1.0.0/16 → A attachment. Bidirectional traffic needs valid forward and reverse routes.',trap:'A forward path does not guarantee a return path.'},
 {stem:'Production and Development must both access Shared Services through TGW, but must not access each other. Which design best meets that requirement?',opts:['Associate all attachments with one TGW route table containing every VPC route','Use separate TGW route tables for Production and Development, propagating Shared Services into each while withholding mutual Prod/Dev routes; configure Shared Services return routes','Use a Direct Connect Gateway to block Prod-to-Dev routing','Enable VPC peering from all VPCs to Shared Services instead'],correct:1,reason:'Route-table segmentation supports hub-and-spoke isolation. The associated tables for Production and Development each have a route to Shared Services but not to each other. Shared Services has routes back to both. Also check VPC subnet routes, attachment and security policies.',trap:'Do not forget that isolation requires controlled TGW routes in both directions; security controls add defense in depth.'},
 {stem:'A team has 40 VPCs across accounts and Regions, and needs centralized routing to an on-premises site over Direct Connect. Which architecture most directly fits?',opts:['A private VIF for every VPC','A transit VIF → Direct Connect Gateway → regional Transit Gateways, shared with workload accounts via AWS RAM','A hub VPC peered to every workload VPC for transitive routing','A public VIF connected directly to each VPC'],correct:1,reason:'A transit VIF connects to a Direct Connect Gateway, which can be associated with regional Transit Gateways. AWS RAM helps share TGWs with other accounts. Peering is non-transitive. Confirm association quotas and route policies for the actual design.',trap:'Distinguish connectivity (DX), global DX association (DX gateway), routing (TGW), and resource sharing (RAM).'}
];
let current=0;
const launch=document.createElement('button');launch.id='awsroute-launch';launch.textContent='🧭 TGW Architecture Lab';launch.setAttribute('aria-haspopup','dialog');
const mask=document.createElement('div');mask.id='awsroute-mask';mask.innerHTML=`<section id="awsroute-panel" role="dialog" aria-modal="true" aria-labelledby="awsroute-title"><button id="awsroute-close" aria-label="Close lab">✕</button><h2 id="awsroute-title">Transit Gateway — Architecture Lab</h2><p class="awsroute-muted">New practice module · 4 scenarios · Existing question bank and progress are unchanged</p><div class="awsroute-chain"><span>VPC A</span> → <span>Attachment A</span> → <span>Associated TGW route table</span> → <span>Attachment B</span> → <span>VPC B</span></div><p><b>Association:</b> selects the TGW route table used for traffic arriving on an attachment.<br><b>Propagation:</b> installs reachability information from an attachment into selected TGW route tables.<br><b>Return path:</b> the reply enters the TGW through B’s attachment, so the route table associated with B’s attachment needs a route back to A.</p><h3>Practice scenario <span id="awsroute-counter"></span></h3><p id="awsroute-stem"></p><div class="awsroute-options" id="awsroute-options"></div><button class="awsroute-cta" id="awsroute-check">Check decision</button><button id="awsroute-next" class="awsroute-cta" style="background:#edf1f4;color:#15202a">Next scenario →</button><div class="awsroute-result" id="awsroute-result" hidden aria-live="polite"></div><h3>Related study tools</h3><p><a id="awsroute-other" href="AWS_Service_Mind_Map-Pattern-Mastery.html">Open updated AWS Mind Map</a> · <a href="https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html" target="_blank" rel="noopener noreferrer">AWS Transit Gateway route tables (official)</a></p><p class="awsroute-muted">This module is intentionally self-contained. Answers here are not included in your original spaced-repetition scores. Verify evolving AWS limits against official docs.</p></section>`;
document.body.appendChild(launch);document.body.appendChild(mask);
function paint(){const q=questions[current];mask.querySelector('#awsroute-counter').textContent=`${current+1} / ${questions.length}`;mask.querySelector('#awsroute-stem').textContent=q.stem;const c=mask.querySelector('#awsroute-options');c.replaceChildren();q.opts.forEach((opt,i)=>{const l=document.createElement('label');l.className='awsroute-opt';const r=document.createElement('input');r.type='radio';r.name='awsroute-answer';r.value=i;l.append(r,document.createTextNode(String.fromCharCode(65+i)+'. '+opt));c.appendChild(l)});mask.querySelector('#awsroute-result').hidden=true;}
function close(){mask.classList.remove('awsroute-open');launch.focus()}
launch.addEventListener('click',()=>{paint();mask.classList.add('awsroute-open');mask.querySelector('#awsroute-close').focus()});mask.querySelector('#awsroute-close').addEventListener('click',close);mask.addEventListener('click',e=>{if(e.target===mask)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mask.classList.contains('awsroute-open'))close()});
mask.querySelector('#awsroute-next').addEventListener('click',()=>{current=(current+1)%questions.length;paint()});
mask.querySelector('#awsroute-check').addEventListener('click',()=>{const checked=mask.querySelector('input[name="awsroute-answer"]:checked');const result=mask.querySelector('#awsroute-result');result.hidden=false;if(!checked){result.textContent='Choose an answer first.';return}const q=questions[current],correct=Number(checked.value)===q.correct;result.replaceChildren();const b=document.createElement('b');b.textContent=correct?'Correct. ':'Not quite. Correct: '+String.fromCharCode(65+q.correct)+'. ';result.append(b,document.createTextNode(q.reason+' Exam trap: '+q.trap));});
})();
