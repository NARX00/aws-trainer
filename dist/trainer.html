rk?","tasks":["4.2","2.6"],"rows":[["AWS DataSync","Bulk or scheduled copies of files/objects (NFS, SMB, HDFS, object) into S3, EFS or FSx, with verification.","On-prem apps must keep reading/writing the data through a local share (use Storage Gateway).","Agent on-prem; encrypted in transit; runs over internet, VPN or Direct Connect."],["AWS Storage Gateway","On-prem apps keep using NFS/SMB/iSCSI/tape while data lives in AWS (hybrid, backup, tape replacement).","A one-off bulk migration (use DataSync).","S3 File Gateway, Volume Gateway (cached/stored), Tape Gateway; local cache for hot data."],["AWS Transfer Family","Partners keep sending files over SFTP/FTPS/FTP/AS2 into S3 or EFS.","Internal bulk migration.","Fully managed endpoints; your users and DNS stay the same."],["AWS DMS (+ SCT / DMS Schema Conversion)","Move databases with minimal downtime (full load + CDC), same or different engine.","Moving whole servers.","Homogeneous: DMS only. Heterogeneous: convert schema first (SCT or DMS Schema Conversion)."],["AWS Application Migration Service (MGN)","Rehost servers (physical, VMware, Hyper-V, other clouds) to EC2 with short cutover.","Database engine change or refactoring.","Continuous block-level replication, test launches, then cutover."],["Offline transfer (Snowball Edge)","Legacy answer when the network cannot move the data in time.","New projects: Snowball Edge is closed to new customers and support ends Dec 31, 2026; AWS points to DataSync, Data Transfer Terminal or partner devices.","Rule of thumb: 1 Gbps ≈ 10.8 TB per day."],["S3 Transfer Acceleration","Users far from the bucket's Region upload large objects.","Bulk data-center migration.","Uses CloudFront edge locations; you pay only when it actually speeds up."]]},{"id":"msg","t":"Decouple with messaging and events","q":"One consumer or many? Ordered? Replay? Existing protocol?","tasks":["2.4","4.4"],"rows":[["Amazon SQS (standard)","Buffer work between producers and consumers; absorb spikes; retries with a dead-letter queue.","Many independent consumers each need every message (use SNS/EventBridge fan-out).","At-least-once, best-effort order; consumers poll; nearly unlimited throughput."],["Amazon SQS FIFO","Strict order and exactly-once processing per message group.","Very high throughput without grouping.","Ordering per message group ID; deduplication window 5 minutes."],["Amazon SNS","Push one message to many subscribers (SQS, Lambda, HTTP, email, SMS, mobile push); SNS → SQS fan-out.","Consumers need to replay or read at their own pace from storage.","Pub/sub push; message filtering per subscription."],["Amazon EventBridge","Route events by content rules between AWS services, your apps and SaaS; scheduled events; cross-account event buses.","Very high-volume ordered streams with replay by position.","Rules with event patterns, archive and replay, Pipes, Scheduler, schema registry."],["Amazon Kinesis Data Streams","Real-time ordered streams, multiple consumers reading the same data, replay within retention.","Simple task queues.","Shards (provisioned) or on-demand; ordering per partition key; retention 24 h default, up to 365 days."],["Amazon Data Firehose","Load streaming data into S3, Redshift, OpenSearch, Splunk with buffering, conversion and compression — no code.","Sub-second custom processing or replay.","Near real time (buffered); serverless."],["Amazon MQ","Lift existing apps that use JMS, AMQP, MQTT, STOMP, OpenWire (ActiveMQ or RabbitMQ) without code change.","Greenfield cloud-native apps (use SQS/SNS).","Managed brokers; active/standby across AZs."],["Amazon MSK","Existing Apache Kafka workloads or Kafka ecosystem tools.","Teams that don't want to run Kafka concepts (consider Kinesis).","Managed Kafka (provisioned or serverless)."]]},{"id":"dr","t":"Pick a disaster-recovery strategy","q":"What are the RTO and RPO, and what may it cost?","tasks":["1.3","2.2","3.4"],"rows":[["Backup & restore","RTO hours, RPO hours; lowest cost.","Minutes of downtime are unacceptable.","Back up and copy cross-Region (AWS Backup); rebuild with IaC."],["Pilot light","RTO tens of minutes; core data replicated live.","You can't wait to start and scale compute.","Data replicated + core infra provisioned; app compute OFF until failover."],["Warm standby","RTO minutes; scaled-down full copy already running.","Zero downtime is required.","Running but small; scale up on failover."],["Multi-site active-active","RTO/RPO near zero; global users.","Budget is limited or writes can't be reconciled.","Full capacity in 2+ Regions; Route 53 / Global Accelerator spread traffic; pick write-global, write-local or write-partitioned."],["AWS Elastic Disaster Recovery","Pilot-light-style DR for servers (on-prem or EC2) with RPO of seconds.","Managed databases with native replication.","Continuous block replication to a low-cost staging area; launch in minutes; non-disruptive drills."],["Route 53 ARC","A reliable, manual Region failover switch and zonal shift.","Fully automatic DNS failover is enough.","Routing controls are highly available on/off switches; zonal shift moves traffic away from an AZ."]]},{"id":"db","t":"Choose a database","q":"What is the data model and access pattern?","tasks":["2.5","4.3","4.4"],"rows":[["Amazon RDS","Lift-and-shift relational apps (MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, Db2).","Massive scale-out writes or millisecond key lookups at any scale.","Multi-AZ for HA; read replicas for reads; licence-included or BYOL."],["Amazon Aurora","Relational with higher performance, fast failover, global replication, serverless scaling.","Engines other than MySQL/PostgreSQL.","Storage 6 copies across 3 AZs; up to 15 replicas; Global Database; Serverless v2; Babelfish for SQL Server apps."],["Amazon DynamoDB","Key-value/document at any scale with single-digit ms latency; serverless.","Complex joins or ad-hoc relational queries.","On-demand or provisioned; global tables; DAX cache; PITR; item max 400 KB."],["ElastiCache / MemoryDB","Sub-millisecond reads: cache (ElastiCache) or durable in-memory primary DB (MemoryDB).","System of record that needs complex queries.","Engines Valkey, Redis OSS, Memcached (ElastiCache)."],["Amazon DocumentDB","JSON documents with MongoDB-compatible APIs.","Relational workloads.","Managed, storage like Aurora."],["Amazon Neptune","Highly connected data: social graphs, fraud rings, knowledge graphs.","Simple key lookups.","Gremlin, openCypher, SPARQL."],["Amazon Redshift","Data warehouse / OLAP over large structured data; queries on S3 with Spectrum.","OLTP transactions.","Columnar MPP; Serverless option; zero-ETL integrations."],["OpenSearch Service","Full-text search, log analytics, dashboards.","System of record.","OpenSearch Dashboards; Serverless option."],["Timestream / Keyspaces","Time series (Timestream for InfluxDB) / Cassandra-compatible wide-column (Keyspaces).","General-purpose relational.","Timestream for LiveAnalytics is closed to new customers."]]},{"id":"rep","t":"Replicate data across Regions","q":"Which data store, what RPO, active-active or active-passive?","tasks":["1.3","2.2"],"rows":[["S3 Cross-Region Replication","Copy new objects to another Region (compliance, DR, lower latency).","Existing objects (use S3 Batch Replication).","Needs versioning on both buckets; Replication Time Control = 99.9% within 15 minutes (SLA)."],["Aurora Global Database","Relational DR with RPO ~1 s and fast Region promotion; low-latency global reads.","Writes needed in every Region at once.","One writer Region; managed switchover RPO 0; unplanned failover in minutes; write forwarding available."],["RDS cross-Region read replica","DR or local reads for RDS engines.","RTO of seconds.","Asynchronous; promotion takes minutes; Multi-AZ DB cluster is single-Region."],["DynamoDB global tables","Active-active writes in several Regions.","Strong cross-Region consistency with eventual mode (use the multi-Region strong consistency option).","Default last-writer-wins, replication typically under a second."],["AWS Backup cross-Region / cross-account copy","Backups of many services copied to a DR Region or a vault in another account.","Low RPO (backups are periodic).","Backup plans, Vault Lock, logically air-gapped vault."],["EFS replication / FSx backups","Shared file systems in a second Region.","—","EFS replication keeps a read-only copy (RPO minutes)."]]},{"id":"keys","t":"Encryption and key control","q":"Who must control the keys and who must see key usage?","tasks":["1.2","2.3","3.2"],"rows":[["SSE-S3","Default encryption with no key management.","You must audit key use or control the key policy.","AWS-owned keys; no CloudTrail record per use."],["SSE-KMS with AWS managed key (aws/s3)","Encryption with key-use visible in CloudTrail, single account.","Cross-account access to the data (the AWS managed key can't be shared).","You can't edit its key policy."],["SSE-KMS with customer managed key","Control the key policy, rotation, grants; cross-account access; audit every use.","—","Key policy + IAM; enable S3 Bucket Keys to cut KMS request cost."],["KMS custom key store on CloudHSM","Regulation demands single-tenant HSMs you control, but you still want KMS integration.","You need very high request rates (lower, fixed quota).","You operate the CloudHSM cluster (≥2 HSMs)."],["KMS external key store (XKS)","Keys must stay outside AWS (hold your own key).","Availability and latency matter most.","Every crypto call goes to your external HSM."],["CloudHSM directly","Apps need PKCS#11/JCE/CNG, SSL/TLS offload, or full HSM control.","Native integration with most AWS services (use KMS).","FIPS validated HSMs you manage."],["Client-side encryption","Data must be encrypted before it reaches AWS.","—","AWS Encryption SDK / S3 encryption client."]]},{"id":"xacct","t":"Share access across accounts","q":"Is it people, workloads or resources, and does the resource support a resource policy?","tasks":["1.2","1.4"],"rows":[["IAM role + sts:AssumeRole","A workload or admin in account A acts inside account B.","—","Trust policy in B names A; A's identity policy allows sts:AssumeRole; use ExternalId for third parties."],["Resource-based policy","Grant another account access to a resource directly (S3, KMS, SQS, SNS, Lambda, Secrets Manager, ECR…).","The service has no resource policies.","Cross-account needs Allow on BOTH sides; caller keeps its own identity."],["AWS RAM","Share resources themselves: subnets, Transit Gateways, Resolver rules, License Manager configs, Aurora clusters, prefix lists.","Sharing data access to S3 objects.","Inside an organization no invitation is needed."],["IAM Identity Center","People sign in once and reach many accounts.","Workloads (use roles).","Permission sets provisioned as roles; external IdP with SAML + SCIM."],["Lake Formation","Fine-grained (table, column, row) data-lake permissions across accounts.","Plain object access.","Cross-account sharing via RAM; tag-based access control."],["Conditions aws:PrincipalOrgID / aws:ResourceOrgID","Restrict a resource to your organization only.","—","Add to bucket/key/topic policies; SCPs/RCPs as perimeter guardrails."]]},{"id":"comp","t":"Choose compute","q":"How much control vs how little ops, and how long does code run?","tasks":["2.1","4.3"],"rows":[["Amazon EC2","Full OS control, lift-and-shift, special licensing or hardware.","Least operational overhead is required.","You patch; use ASGs across AZs; Spot/Savings Plans for cost."],["Elastic Beanstalk","Web apps with managed platform and deployment policies, little AWS knowledge.","Fine-grained infrastructure control.","Runs EC2/ASG/ELB in your account."],["ECS on Fargate","Containers without managing hosts.","GPUs or host-level customization needed.","Pay per task vCPU/memory per second; up to 32 vCPU."],["ECS / EKS on EC2","Containers with GPUs, specific instances, or cheaper at high steady utilization.","Smallest ops team.","You manage the instances (or use managed node groups / capacity providers)."],["Amazon EKS","Kubernetes is required or already used.","Teams new to containers (ECS is simpler).","Managed control plane; Fargate, managed nodes, Auto Mode, Hybrid Nodes."],["AWS Lambda","Event-driven code ≤15 minutes; spiky load; no idle cost.","Long-running or steady high-CPU work.","128 MB–10 GB memory; container images supported; provisioned concurrency for latency."],["AWS Batch","Queued batch jobs (hours), HPC, scale to zero after.","Always-on services.","Job queues and compute environments on EC2, Spot or Fargate."]]},{"id":"store","t":"Choose storage","q":"Block, file or object? Who shares it, which OS and protocol?","tasks":["2.5","4.3"],"rows":[["Amazon EBS","Block disk for one EC2 instance (boot, databases).","Shared across AZs or many instances.","One AZ; snapshots to move; gp3 default; io2 Block Express for highest IOPS; Multi-Attach io1/io2 same AZ."],["Instance store","Temporary, very fast local disk (cache, scratch).","Data that must survive stop/terminate.","Lost on stop, hibernate or terminate."],["Amazon EFS","Shared NFS file system for Linux across AZs (EC2, ECS, EKS, Fargate, Lambda).","Windows SMB clients.","Elastic throughput; Standard and One Zone; lifecycle to IA/Archive."],["FSx for Windows File Server","SMB shares with Active Directory, Windows ACLs, DFS.","Linux-only NFS workloads.","Multi-AZ option."],["FSx for NetApp ONTAP","Migrate NetApp; NFS + SMB + iSCSI on the same data; snapshots, SnapMirror.","Simple Linux shares (EFS is simpler).","SSD tier + capacity pool."],["FSx for Lustre","HPC/ML needing very high throughput; link to an S3 bucket.","General file shares.","Scratch or persistent deployment types."],["Amazon S3","Unlimited objects: data lakes, backups, static content.","POSIX file locking or block access.","Storage classes + lifecycle; 11 nines durability; Mountpoint for S3 for file-like reads."]]},{"id":"edge","t":"Speed up global users","q":"HTTP content or any TCP/UDP? Static IPs? Which Region is closest?","tasks":["2.5","3.3"],"rows":[["Amazon CloudFront","Cache static/dynamic HTTP(S) content at edge; protect origins with WAF/Shield; signed URLs.","Non-HTTP protocols.","Origin access control for S3; Lambda@Edge / CloudFront Functions."],["AWS Global Accelerator","Any TCP/UDP app needs 2 static anycast IPs, fast cross-Region failover, AWS backbone path.","Caching content.","Endpoints: ALB, NLB, EC2, Elastic IPs; custom routing for gaming/VoIP."],["Route 53 latency / geolocation / geoproximity","Send users to the best Region via DNS.","Instant failover (DNS TTL caching delays it).","Combine with health checks; geolocation for content rights or compliance."],["S3 Transfer Acceleration","Faster long-distance uploads to S3.","Downloads to many users (use CloudFront).","Edge ingest over the AWS backbone."]]},{"id":"cfg","t":"Store secrets and configuration","q":"Does it rotate? Is it a secret or a setting or a feature flag?","tasks":["2.3","3.1"],"rows":[["AWS Secrets Manager","Database passwords, API keys that must rotate automatically; cross-account secret sharing.","Plain non-secret configuration (pay per secret).","Built-in rotation for RDS/Aurora/Redshift/DocumentDB; resource policies; replication to other Regions."],["SSM Parameter Store","Configuration values and simple secrets, free standard tier, hierarchy.","Automatic rotation is required.","SecureString uses KMS; advanced tier for larger values and policies."],["AWS AppConfig","Feature flags and dynamic configuration rolled out gradually with validation and auto-rollback.","Storing secrets.","Deployment strategies + CloudWatch alarm rollback."],["Instance profile / task role / execution role","Give EC2/ECS/Lambda AWS permissions with no stored keys.","—","Temporary credentials rotated automatically."]]},{"id":"deploy","t":"Choose a deployment strategy","q":"Downtime allowed? Capacity during deploy? How fast to roll back?","tasks":["2.1","3.1"],"rows":[["All at once (in-place)","Dev/test; downtime acceptable; fastest.","Production with no-downtime need.","Rollback = redeploy old version."],["Rolling","Limited extra cost; some reduced capacity acceptable.","Full capacity required during deploy.","Mixed versions during rollout; failed batch can leave a mix."],["Rolling with additional batch","Rolling but keep full capacity.","—","Launches an extra batch first."],["Immutable","Safest rollback on Beanstalk/ASG: new instances, old kept until healthy.","Cost of double capacity is a problem.","New ASG; terminate it to roll back."],["Blue/green","Instant switch and instant rollback; test the new environment first.","Shared stateful resources can't be duplicated.","Second full environment; switch via DNS, ALB weights, Beanstalk URL swap, CodeDeploy."],["Canary / linear","Expose a small % first and watch alarms (Lambda alias, ECS, API Gateway, ALB weights).","—","CodeDeploy configs like Canary10Percent5Minutes; automatic rollback on CloudWatch alarm."],["Feature flags (AppConfig)","Ship code dark, turn features on gradually without redeploying.","—","Separate deploy from release."]]},{"id":"obs","t":"See what is happening (monitor, audit, detect)","q":"Performance, who did what, config compliance, or threats?","tasks":["3.1","3.2","3.3"],"rows":[["CloudWatch metrics, alarms, logs","Performance, health, KPIs, alarms → SNS/automation; log analysis with Logs Insights.","Who-called-which-API questions (CloudTrail).","EC2 memory/disk needs the CloudWatch agent; set log retention."],["AWS CloudTrail","Audit API activity: who did what, when, from where.","Resource configuration history (Config).","Organization trail to Log Archive; Event history 90 days; CloudTrail Lake closed to new customers from May 31, 2026."],["AWS Config","Resource configuration history and compliance rules with auto-remediation.","Threat detection.","Rules, conformance packs, aggregator across accounts/Regions; remediation via SSM Automation."],["X-Ray / Application Signals","Trace requests across services; SLOs, latency, errors per service.","Infrastructure audit.","OpenTelemetry-based instrumentation."],["VPC Flow Logs / Reachability Analyzer","Who talked to whom on the network / prove a path is blocked or open.","Application-level errors.","Flow Logs to CloudWatch Logs or S3; Reachability Analyzer is config analysis (no traffic sent)."],["GuardDuty","Threat detection from CloudTrail, VPC Flow Logs, DNS logs and more (malware, crypto-mining, compromised credentials).","Compliance checks (Security Hub / Config).","Regional; delegated admin; findings → EventBridge."],["Security Hub (CSPM)","Aggregate and prioritize findings; best-practice standards (FSBP, CIS, PCI, NIST). The original service is now called Security Hub CSPM; the new Security Hub (Dec 2025) adds risk correlation.","Generating threat findings itself.","Cross-Region aggregation; automation rules."],["Inspector / Macie / Detective","Vulnerabilities in EC2, ECR images, Lambda / sensitive data in S3 / investigate a finding's root cause.","—","All Regional with delegated admin."]]},{"id":"idn","t":"Sign-in for people and workloads","q":"Workforce or customers? Many accounts? Inside or outside AWS?","tasks":["1.2","3.2"],"rows":[["IAM Identity Center","Workforce SSO to many accounts and SaaS apps; external IdP (Entra ID, Okta) via SAML + SCIM.","App end users (customers).","Permission sets; ABAC with user attributes."],["IAM SAML / OIDC identity providers","Federation into a single account or a different IdP per account; GitHub Actions OIDC for CI/CD.","Many accounts with central management (use Identity Center).","AssumeRoleWithSAML / AssumeRoleWithWebIdentity."],["Amazon Cognito user pools","Customer sign-up/sign-in for web and mobile apps, social login, MFA.","Workforce access to AWS accounts.","Issues JWTs; works with API Gateway/ALB."],["Amazon Cognito identity pools","App users need temporary AWS credentials (e.g. upload to S3 directly).","—","Maps identities to IAM roles; guest access possible."],["IAM Roles Anywhere","On-prem servers/workloads need AWS credentials without long-term keys.","People.","X.509 certificates from your CA → temporary credentials."],["AWS Directory Service","Managed Microsoft AD (trusts, RDS SQL Server, FSx Windows, WorkSpaces) or AD Connector (proxy to on-prem AD).","Simple workforce SSO alone (Identity Center).","Simple AD is closed to new customers."]]},{"id":"cache","t":"Add caching","q":"Where is the repeated work: at the edge, the API, the database reads?","tasks":["2.5","3.3"],"rows":[["CloudFront","Repeated HTTP content for users worldwide.","Per-user private data that can't be cached.","TTLs, cache keys, origin shield."],["API Gateway caching","Repeated identical API responses (REST APIs).","HTTP APIs (no cache).","Per-stage cache with TTL."],["ElastiCache","Repeated database reads, session store, leaderboards.","Durable primary data (MemoryDB).","Lazy loading or write-through."],["DynamoDB Accelerator (DAX)","Microsecond reads on DynamoDB without code rewrite.","Write-heavy or strongly consistent reads.","Item and query cache in front of DynamoDB."],["RDS / Aurora read replicas","Read-heavy relational load.","Write scaling.","Asynchronous; reader endpoint (Aurora) or RDS Proxy."]]}],"traps":{"1.1":[["VPC peering for many VPCs + on-prem","Peering is non-transitive and can't share a VPN/DX; use Transit Gateway."],["Private VIF to reach many VPCs in several Regions","Use a Direct Connect gateway; with many VPCs use a transit VIF to Transit Gateway."],["Route 53 private hosted zone answers on-prem queries by itself","On-prem DNS needs a Route 53 Resolver INBOUND endpoint; AWS → on-prem needs an OUTBOUND endpoint + forwarding rule."]],"1.2":[["SCP grants permissions","SCPs only limit; something else (IAM policy) must still allow. SCPs don't affect the management account."],["Access keys stored on EC2 / in code","Use an instance profile (role); for on-prem use IAM Roles Anywhere."],["AWS managed KMS key for cross-account access","AWS managed keys can't be shared; use a customer managed key with a key policy."]],"1.3":[["Multi-AZ = disaster recovery","Multi-AZ protects against AZ failure, not a Region outage; DR needs a second Region."],["Active-active when the RTO is hours","Pick the cheapest pattern that meets RTO/RPO (often backup & restore or pilot light)."],["Route 53 failover is instant","DNS caching (TTL) delays clients; Global Accelerator fails over without DNS."]],"1.4":[["Run workloads in the management account","Keep it for billing/Organizations; use delegated admin accounts."],["Create IAM users in every account","Use IAM Identity Center with permission sets."],["Enable a security service account by account","Delegated admin + auto-enable for new accounts (or Control Tower)."]],"1.5":[["Reserved Instances for changing instance families","Compute Savings Plans follow you across family, Region, OS, Fargate and Lambda."],["Tags show cost immediately","User-defined tags must be ACTIVATED as cost allocation tags and apply from activation onward (backfill up to 12 months on request)."],["AWS Budgets stops spending by itself","Budgets alert; only budget ACTIONS (apply an SCP/IAM policy, stop EC2/RDS) enforce."]],"2.1":[["Rolling deploy when no capacity loss is allowed","Use rolling with additional batch, immutable or blue/green."],["Blue/green with a shared database you must change","Schema changes must stay backward compatible, or blue/green can't roll back cleanly."],["CloudFormation stack policy prevents stack deletion","Stack policy protects resources from UPDATES; use termination protection and DeletionPolicy Retain/Snapshot."]],"2.2":[["RDS read replica in same Region as DR","DR needs a cross-Region copy (cross-Region replica, Aurora Global Database)."],["Multi-AZ DB cluster across Regions","Multi-AZ DB clusters are single-Region."],["Backups stored in the same account","Copy to a separate account/Region with Vault Lock against ransomware or account compromise."]],"2.3":[["NAT gateway for S3/DynamoDB traffic","Gateway endpoints are free and keep traffic private."],["Parameter Store for automatic rotation","Secrets Manager has built-in rotation."],["Security groups to block one bad IP","Security groups have only allow rules; use NACL deny or WAF IP set."]],"2.4":[["Single zonal NAT gateway for all AZs","One zonal NAT gateway per AZ, each AZ routing to its own, or one Regional NAT gateway (Nov 2025)."],["Bigger instance instead of decoupling","Add a queue (SQS) and Auto Scaling to absorb spikes."],["Retry immediately in a tight loop","Exponential backoff with jitter + dead-letter queue."]],"2.5":[["CloudFront for non-HTTP (UDP gaming)","Use Global Accelerator."],["Read replicas to scale writes","Replicas scale reads; for writes scale up, shard, or use DynamoDB."],["API Gateway HTTP API caching","Caching exists on REST APIs only."]],"2.6":[["On-demand for steady 24/7 load","Savings Plans/RIs for the baseline, Spot for interruptible work."],["S3 lifecycle to Glacier for objects read often","Retrieval costs and delays; use Intelligent-Tiering when access is unknown."],["NAT gateway data for S3 heavy traffic","Gateway endpoint removes NAT processing charges."]],"3.1":[["Manual console fixes after drift","Use IaC (CloudFormation/CDK) and Config rules with auto-remediation."],["SSH into instances for commands","Session Manager / Run Command: no bastion, no open port 22, logged."],["CloudWatch shows EC2 memory by default","Memory and disk need the CloudWatch agent."]],"3.2":[["GuardDuty fixes findings","It detects; respond with EventBridge → Lambda/SSM Automation."],["Inspector scans S3 for PII","Macie finds sensitive data in S3; Inspector scans EC2/ECR/Lambda vulnerabilities."],["CloudTrail shows resource configuration history","AWS Config does; CloudTrail shows API calls."]],"3.3":[["gp2 for predictable IOPS cheaply","gp3 sets IOPS/throughput independently of size and costs less."],["Lambda cold start fixed by more memory only","Use provisioned concurrency (or SnapStart for supported runtimes)."],["Scale DB reads by bigger instance","Read replicas or caching (ElastiCache/DAX) first."]],"3.4":[["Auto Scaling with EC2 health checks behind ALB","Use ELB health checks so app failures replace instances."],["Lambda concurrency unlimited","Account quota (default 1,000 per Region) is shared; reserve concurrency for critical functions."],["Deleting a failed message manually","Use dead-letter queues and redrive."]],"3.5":[["Turn off unused resources by hand","Use Instance Scheduler / Auto Scaling schedules; Compute Optimizer for rightsizing."],["Delete old EBS snapshots manually","Data Lifecycle Manager or AWS Backup retention; archive tier for long-term snapshots."],["Cross-AZ chatty traffic is free","Inter-AZ data transfer is charged; keep chatty tiers close or use caching."]],"4.1":[["Move everything first, assess later","Discover and group by dependencies (AWS Transform today; older questions use Application Discovery Service / Migration Hub) and pick a strategy per app."],["Refactor every app","Choose the 7 Rs per app: retire and retain are valid answers."],["Ignore licensing","Check BYOL/licence-included; Dedicated Hosts for socket/core licences."]],"4.2":[["Snowball for a new offline migration","Snowball Edge is closed to new customers; DataSync over DX/internet, or partner offline options."],["DMS alone for Oracle → PostgreSQL","Heterogeneous needs schema conversion first (SCT / DMS Schema Conversion)."],["Storage Gateway for one-off bulk copy","DataSync for bulk copy; Storage Gateway for ongoing hybrid access."]],"4.3":[["EC2 when 'least operational overhead'","Prefer managed: Fargate, Lambda, Aurora, DynamoDB."],["EFS for Windows SMB shares","FSx for Windows File Server."],["Self-managed Kafka/RabbitMQ on EC2","MSK / Amazon MQ."]],"4.4":[["Rewrite clients to change protocol","Amazon MQ / Transfer Family keep existing protocols."],["Monolith → microservices in one go","Strangler fig: route features piece by piece behind API Gateway or an ALB (Migration Hub Refactor Spaces is closed to new customers since Nov 7, 2025)."],["Lambda for jobs longer than 15 minutes","Step Functions, Fargate or Batch."]]},"changed":[["A new company can start a migration discovery with AWS Application Discovery Service and track it in Migration Hub.",false,"Both closed to new customers on Nov 7, 2025. AWS now points to AWS Transform for discovery, assessment and wave planning. Older exam questions may still use them."],["Snowball Edge is the default answer for a new offline migration of 200 TB.",false,"Snowball Edge is for existing customers only (support ends Dec 31, 2026). AWS points to DataSync over Direct Connect or internet, AWS Data Transfer Terminal, or partner devices. Snowcone and Snowmobile are retired."],["AWS Server Migration Service and CloudEndure Migration are replaced by AWS Application Migration Service (MGN).",true,"Both are retired; MGN does continuous block-level replication for rehosting."],["New customers can create AWS App Runner services.",false,"App Runner is closed to new customers; AWS recommends ECS Express Mode (Fargate + ALB + auto scaling from a container image)."],["CloudWatch Evidently is the AWS service for feature flags and A/B launches.",false,"Evidently ended in Oct 2025. Use AWS AppConfig feature flags."],["AWS App Mesh is the recommended service mesh for new ECS workloads.",false,"App Mesh reached end of support on Sep 30, 2026. AWS recommends ECS Service Connect or Amazon VPC Lattice."],["CloudTrail Lake is closed to new customers, but CloudTrail trails keep working.",true,"Closed to new customers on May 31, 2026; trails, Insights and organization trails are unaffected."],["Kinesis Data Analytics for SQL applications is the managed answer for real-time SQL on streams.",false,"It ended on Jan 27, 2026. Use Amazon Managed Service for Apache Flink."],["Systems Manager Incident Manager and Change Manager are closed to new customers.",true,"Both closed Nov 7, 2025. OpsCenter and Automation remain."],["Route 53 ARC readiness checks are available to new customers.",false,"Readiness checks are closed to new customers. Routing controls, zonal shift/autoshift and Region switch continue."],["The original AWS Security Hub service is now called Security Hub CSPM.",true,"Renamed when the new AWS Security Hub launched (Dec 2025), which adds correlation of GuardDuty, Inspector, Macie and CSPM findings."],["Amazon Detective requires GuardDuty to be enabled for 48 hours first.",false,"That requirement was removed in 2024; GuardDuty findings simply add context if it is on."],["The maximum size of an S3 object is 5 TB.",false,"It is now 50 TB with multipart upload. A single PUT is still limited to 5 GB."],["The maximum SQS message size is 256 KB.",false,"Raised to 1 MiB in 2025. Larger payloads go through S3 with the Extended Client Library."],["Lambda@Edge viewer-request functions are limited to 5 seconds.",false,"All Lambda@Edge event types now allow 30 seconds. Older material (and some exam questions) still say 5 s for viewer events."],["You can attach up to 10 SCPs to an OU, each up to 10,240 characters.",true,"Raised from 5 SCPs / 5,120 characters. Resource control policies (RCPs) are 5 per target, 5,120 characters."],["An IAM role can have at most 10 managed policies attached.",false,"Roles: 20 by default, up to 25. Users: 10 by default, up to 20."],["RDS for Oracle and SQL Server support at most 5 read replicas.",false,"All RDS engines support up to 15 read replicas per source; AWS advises keeping Oracle and SQL Server at 5 or fewer because of lag."],["Database Savings Plans cover RDS, Aurora, DynamoDB, ElastiCache and OpenSearch with one commitment.",true,"Launched Dec 2025 (OpenSearch added Mar 2026; ElastiCache only for Valkey). 1-year term; up to 35% for serverless, up to 20% for provisioned instances."],["For steady RDS usage, Reserved Instances are the only commitment discount.",false,"Database Savings Plans (Dec 2025) are now an alternative that stays flexible across engines, sizes and Regions; RIs can still give a bigger discount for a fixed instance."],["Compute Savings Plans can reach a 72% discount.",false,"Compute Savings Plans go up to 66%; the 72% figure is for EC2 Instance Savings Plans (one family in one Region)."],["User-defined cost allocation tags only show costs from the day you activate them.",false,"The management account can request a backfill of up to 12 months."],["Trusted Advisor gives all cost optimization checks on the Basic support plan.",false,"All checks need Business Support+, Enterprise Support or Unified Operations; the legacy Business plan keeps them until Jan 1, 2027."],["MACsec can encrypt a 1 Gbps dedicated Direct Connect connection.",false,"MACsec is only on 10, 100 and 400 Gbps dedicated connections at supported locations, never on hosted connections."],["Direct Connect dedicated ports now go up to 400 Gbps.",true,"Dedicated: 1, 10, 100 or 400 Gbps."],["A Large Bandwidth Site-to-Site VPN tunnel (5 Gbps) works with a virtual private gateway.",false,"Large Bandwidth tunnels work only on Transit Gateway or Cloud WAN; standard tunnels are 1.25 Gbps."],["A PrivateLink endpoint service can sit behind an Application Load Balancer.",false,"It needs a Network Load Balancer or a Gateway Load Balancer (an ALB can be a target behind the NLB)."],["EC2 automatic recovery has to be enabled with a CloudWatch alarm on every instance.",false,"Simplified automatic recovery is on by default for supported instance types. It moves the instance to new hardware in the same AZ only."],["ECS has built-in blue/green deployments without CodeDeploy.",true,"Added in Jul 2025, with bake time and alarm-based rollback; built-in linear and canary followed in Oct 2025. CodeDeploy blue/green still works."],["DynamoDB global tables can only be eventually consistent across Regions.",false,"Since 2025 there is a multi-Region strong consistency option (three Regions, or two replicas plus a witness). The default is still last-writer-wins."],["S3 Replication Time Control's SLA covers 99.9% of objects within 15 minutes.",true,"RTC is designed to replicate 99.99% within 15 minutes; the SLA commitment is 99.9%."],["ACM public certificates can never be exported to an EC2 instance.",false,"Since June 2025 ACM can issue exportable public certificates (paid). Older exam questions assume they can't and expect a third-party certificate on the instances."],["S3 Access Grants can be shared across accounts with AWS RAM.",true,"Access Grants instances are shareable through RAM; S3 access points are not."],["Timestream for LiveAnalytics is open to new customers.",false,"Closed Jun 20, 2025. Use Timestream for InfluxDB."],["AppStream 2.0 is now called Amazon WorkSpaces Applications.",true,"Same service, renamed; exam questions may still say AppStream 2.0."],["Amazon Pinpoint is the service to choose for a new SMS campaign platform.",false,"Pinpoint closed to new customers (May 2025) and ends Oct 30, 2026. SMS/voice/push move to AWS End User Messaging; engagement features to Amazon Connect."],["Porting Assistant for .NET and App2Container are the AWS tools for new .NET modernization projects.",false,"Both closed to new customers Nov 7, 2025; AWS points to AWS Transform."],["The X-Ray SDKs and daemon are the long-term way to instrument new applications.",false,"They are in maintenance mode since Feb 2026 (end of support Feb 2027). Use OpenTelemetry (ADOT) with X-Ray / CloudWatch Application Signals."],["The IAM Identity Center organization instance can be created from a delegated administrator account.",false,"It is enabled from the management account; a delegated administrator can then manage it."],["The management account can be the IPAM administrator for the organization.",false,"The management account must delegate IPAM to a member account (for example, the network account)."],["AWS CodeCommit is closed to new customers.",false,"It closed in 2024 but returned to general availability on Nov 24, 2025."],["A NAT gateway always sits in one AZ, so you need one per AZ for high availability.",false,"That is true for zonal NAT gateways. Since Nov 2025 a Regional NAT gateway spans AZs automatically, with one route and no public subnet (public NAT only). Older exam questions expect one per AZ."],["SNS messages and EventBridge events are limited to 256 KB.",false,"EventBridge events go up to 1 MB (Jan 2026). SNS topics default to 256 KiB but can be raised to 1 MiB with MaximumMessageSize (Sep 2026), and then only SQS, Lambda and Firehose subscriptions are allowed."],["EBS gp3 volumes can now reach 80,000 IOPS.",true,"gp3 baseline is 3,000 IOPS and 125 MiB/s regardless of size, configurable up to 80,000 IOPS; io2 Block Express goes to 256,000."]],"labs":[{"id":"waf","title":"AWS WAF logs to Data Firehose to S3, queried with Athena","goal":"Block a test request with AWS WAF, stream the WAF logs through Amazon Data Firehose into S3, and use Athena SQL to find the blocked requests.","exam":"Tasks 2.3 (security controls from requirements), 3.2 (improve security), 3.1 (operational excellence: logging and monitoring), 2.6/3.5 (cost: compression and Athena scan cost). Traps cleared up: (1) every WAF logging destination name must start with aws-waf-logs- (Firehose stream, S3 bucket, or CloudWatch Logs log group); (2) WAF can log DIRECTLY to S3 or CloudWatch Logs - Firehose is only needed when you want buffering control, transformation, or a third-party/OpenSearch/Splunk destination; (3) for a CloudFront web ACL (scope CLOUDFRONT) the web ACL and its Firehose stream must be in us-east-1; (4) Firehose is near-real-time (buffered), not real-time; (5) Athena charges per data scanned, so GZIP/Parquet and partitions cut cost; (6) WAF attaches to CloudFront, ALB, API Gateway REST APIs, AppSync, Cognito user pools, App Runner, Verified Access and Amplify Hosting - NOT to an NLB or an API Gateway HTTP API.","arch":"curl client -> API Gateway REST API (stage prod) protected by AWS WAF web ACL -> WAF logs -> Amazon Data Firehose (aws-waf-logs-lab) -> S3 (waf/ prefix, GZIP) -> Athena table -> SQL","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","About 45 minutes. Do the cleanup the same day: the web ACL is billed per hour while it exists."],"steps":[{"t":"Set variables","txt":"Run this in CloudShell. The bucket name must start with aws-waf-logs- only if WAF writes to it directly; here Firehose writes to it, so any name works, but we use the account ID to make it globally unique without hard-coding it.","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nBUCKET=lab-waf-logs-$ACCOUNT_ID\nFH_NAME=aws-waf-logs-lab\necho $ACCOUNT_ID $BUCKET","lang":"bash"},{"t":"Create the log bucket","txt":"S3 Block Public Access is on by default for new buckets; leave it on.","code":"aws s3api create-bucket --bucket $BUCKET\naws s3api get-public-access-block --bucket $BUCKET","lang":"bash"},{"t":"Create a tiny API to protect","txt":"WAF needs a supported resource. An API Gateway REST API with a MOCK integration costs nothing at rest and needs no backend. (WAF cannot attach to an HTTP API, which is an exam trap.)","code":"API_ID=$(aws apigateway create-rest-api --name waf-lab-api \\\n  --endpoint-configuration types=REGIONAL --query id --output text)\nROOT_ID=$(aws apigateway get-resources --rest-api-id $API_ID \\\n  --query 'items[?path==`/`].id' --output text)\naws apigateway put-method --rest-api-id $API_ID --resource-id $ROOT_ID \\\n  --http-method GET --authorization-type NONE\naws apigateway put-integration --rest-api-id $API_ID --resource-id $ROOT_ID \\\n  --http-method GET --type MOCK \\\n  --request-templates '{\"application/json\":\"{\\\"statusCode\\\": 200}\"}'\naws apigateway put-method-response --rest-api-id $API_ID --resource-id $ROOT_ID \\\n  --http-method GET --status-code 200\naws apigateway put-integration-response --rest-api-id $API_ID --resource-id $ROOT_ID \\\n  --http-method GET --status-code 200 \\\n  --response-templates '{\"application/json\":\"{\\\"ok\\\": true}\"}'\naws apigateway create-deployment --rest-api-id $API_ID --stage-name prod\nAPI_URL=https://$API_ID.execute-api.us-east-1.amazonaws.com/prod/\ncurl -s $API_URL; echo","lang":"bash"},{"t":"Write the Firehose IAM role (trust policy)","txt":"Firehose assumes this role to write to S3. The sts:ExternalId condition limits it to Firehose calls from your own account (confused-deputy protection). If you create the stream in the console instead, the console offers 'Create or update IAM role' and builds an equivalent role for you.","code":"cat > fh-trust.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"firehose.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\": { \"StringEquals\": { \"sts:ExternalId\": \"ACCOUNT_ID\" } }\n    }\n  ]\n}\nEOF\nsed -i \"s/ACCOUNT_ID/$ACCOUNT_ID/g\" fh-trust.json\naws iam create-role --role-name lab-waf-firehose-role \\\n  --assume-role-policy-document file://fh-trust.json","lang":"bash"},{"t":"Firehose role permissions (least privilege)","txt":"Only the S3 actions Firehose needs, only on this bucket.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"FirehoseWritesToLabBucket\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"s3:AbortMultipartUpload\",\n        \"s3:GetBucketLocation\",\n        \"s3:GetObject\",\n        \"s3:ListBucket\",\n        \"s3:ListBucketMultipartUploads\",\n        \"s3:PutObject\"\n      ],\n      \"Resource\": [\n        \"arn:aws:s3:::BUCKET_NAME\",\n        \"arn:aws:s3:::BUCKET_NAME/*\"\n      ]\n    }\n  ]\n}","lang":"json"},{"t":"Attach the permissions policy","txt":"Save the JSON above as fh-perms.json (the heredoc does it), substitute the bucket name, attach it inline, then wait for IAM to propagate.","code":"cat > fh-perms.json <<'EOF'\n{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"FirehoseWritesToLabBucket\",\"Effect\":\"Allow\",\n\"Action\":[\"s3:AbortMultipartUpload\",\"s3:GetBucketLocation\",\"s3:GetObject\",\"s3:ListBucket\",\"s3:ListBucketMultipartUploads\",\"s3:PutObject\"],\n\"Resource\":[\"arn:aws:s3:::BUCKET_NAME\",\"arn:aws:s3:::BUCKET_NAME/*\"]}]}\nEOF\nsed -i \"s/BUCKET_NAME/$BUCKET/g\" fh-perms.json\naws iam put-role-policy --role-name lab-waf-firehose-role \\\n  --policy-name s3-write --policy-document file://fh-perms.json\nsleep 15","lang":"bash"},{"t":"Create the Firehose stream (name MUST start with aws-waf-logs-)","txt":"Console equivalent: Amazon Data Firehose > Create Firehose stream > Source: Direct PUT, Destination: Amazon S3, Firehose stream name: aws-waf-logs-lab, S3 bucket prefix: waf/, Buffer interval: 60 seconds, Compression for data records: GZIP. A prefix with no !{timestamp:...} expression gets YYYY/MM/dd/HH/ appended automatically. GZIP makes Athena scan (and bill) less data.","code":"ROLE_ARN=arn:aws:iam::$ACCOUNT_ID:role/lab-waf-firehose-role\naws firehose create-delivery-stream --delivery-stream-name $FH_NAME \\\n  --delivery-stream-type DirectPut \\\n  --extended-s3-destination-configuration \"{\n    \\\"RoleARN\\\": \\\"$ROLE_ARN\\\",\n    \\\"BucketARN\\\": \\\"arn:aws:s3:::$BUCKET\\\",\n    \\\"Prefix\\\": \\\"waf/\\\",\n    \\\"BufferingHints\\\": {\\\"SizeInMBs\\\": 5, \\\"IntervalInSeconds\\\": 60},\n    \\\"CompressionFormat\\\": \\\"GZIP\\\"\n  }\"\n# wait until ACTIVE (about 1 minute)\naws firehose describe-delivery-stream --delivery-stream-name $FH_NAME \\\n  --query DeliveryStreamDescription.DeliveryStreamStatus --output text\nFH_ARN=$(aws firehose describe-delivery-stream --delivery-stream-name $FH_NAME \\\n  --query DeliveryStreamDescription.DeliveryStreamARN --output text)","lang":"bash"},{"t":"Create the web ACL with one block rule","txt":"Scope REGIONAL because we protect a regional API (a CloudFront web ACL would use scope CLOUDFRONT and must be created in us-east-1). The rule blocks any request whose query string contains 'blockme'. The flag --cli-binary-format raw-in-base64-out matters: SearchString is a binary field and CLI v2 otherwise expects base64. In the console (WAF & Shield > Web ACLs, shown as 'protection packs (web ACLs)' in the newer console experience) you would build the same rule with the rule builder: Inspect = Query string, Match type = Contains string, String to match = blockme, Text transformation = Lowercase, Action = Block.","code":"cat > rules.json <<'EOF'\n[\n  {\n    \"Name\": \"block-blockme-query\",\n    \"Priority\": 0,\n    \"Action\": { \"Block\": {} },\n    \"Statement\": {\n      \"ByteMatchStatement\": {\n        \"SearchString\": \"blockme\",\n        \"FieldToMatch\": { \"QueryString\": {} },\n        \"TextTransformations\": [ { \"Priority\": 0, \"Type\": \"LOWERCASE\" } ],\n        \"PositionalConstraint\": \"CONTAINS\"\n      }\n    },\n    \"VisibilityConfig\": {\n      \"SampledRequestsEnabled\": true,\n      \"CloudWatchMetricsEnabled\": true,\n      \"MetricName\": \"blockme\"\n    }\n  }\n]\nEOF\naws wafv2 create-web-acl --name lab-acl --scope REGIONAL \\\n  --default-action Allow={} \\\n  --visibility-config SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=labAcl \\\n  --rules file://rules.json --cli-binary-format raw-in-base64-out\nACL_ARN=$(aws wafv2 list-web-acls --scope REGIONAL \\\n  --query \"WebACLs[?Name=='lab-acl'].ARN\" --output text)\nACL_ID=$(aws wafv2 list-web-acls --scope REGIONAL \\\n  --query \"WebACLs[?Name=='lab-acl'].Id\" --output text)","lang":"bash"},{"t":"Turn on logging to Firehose","txt":"Console equivalent: open the web ACL > Logging and metrics tab > Logging > Edit/Enable > Logging destination: Amazon Data Firehose stream > choose aws-waf-logs-lab. The same screen offers 'CloudWatch Logs log group' and 'S3 bucket' as direct destinations (both also need the aws-waf-logs- name prefix). WAF creates the service-linked role AWSServiceRoleForWAFV2Logging the first time.","code":"aws wafv2 put-logging-configuration \\\n  --logging-configuration ResourceArn=$ACL_ARN,LogDestinationConfigs=$FH_ARN","lang":"bash"},{"t":"Associate the web ACL with the API stage","txt":"Console equivalent: web ACL > Associated AWS resources > Add AWS resources > API Gateway REST API > waf-lab-api - prod. Allow about a minute for it to take effect.","code":"aws wafv2 associate-web-acl --web-acl-arn $ACL_ARN \\\n  --resource-arn arn:aws:apigateway:us-east-1::/restapis/$API_ID/stages/prod\nsleep 60","lang":"bash"},{"t":"Generate allowed and blocked traffic","txt":"Send 10 normal and 10 'attack' requests.","code":"for i in $(seq 10); do curl -s -o /dev/null -w \"%{http_code} \" \"$API_URL?q=hello$i\"; done; echo\nfor i in $(seq 10); do curl -s -o /dev/null -w \"%{http_code} \" \"$API_URL?q=BlockMe$i\"; done; echo\n# wait for the 60 s buffer to flush, then list delivered files\nsleep 120\naws s3 ls s3://$BUCKET/waf/ --recursive","lang":"bash"},{"t":"Set the Athena query result location","txt":"Athena console > Query editor > Settings tab > Manage > Location of query result: s3://lab-waf-logs-ACCOUNT_ID/athena-results/ > Save. (Use a different prefix from waf/ so Athena output is never read as log data. If your workgroup shows 'Athena managed' query results instead, that also works.)"},{"t":"Create the database and table","txt":"Paste into the Athena query editor and run each statement separately. Replace ACCOUNT_ID in LOCATION with your account number (echo $BUCKET in CloudShell). This is a trimmed version of the AWS-documented WAF table: only the fields we query. The JSON SerDe matches keys case-insensitively, so httprequest maps to httpRequest.","code":"CREATE DATABASE IF NOT EXISTS waflab;\n\nCREATE EXTERNAL TABLE waflab.waf_logs (\n  `timestamp` bigint,\n  formatversion int,\n  webaclid string,\n  terminatingruleid string,\n  terminatingruletype string,\n  action string,\n  httpsourcename string,\n  httpsourceid string,\n  httprequest struct<\n    clientip:string,\n    country:string,\n    uri:string,\n    args:string,\n    httpversion:string,\n    httpmethod:string,\n    requestid:string,\n    headers:array<struct<name:string,value:string>>\n  >\n)\nROW FORMAT SERDE 'org.openx.data.jsonserde.JsonSerDe'\nLOCATION 's3://lab-waf-logs-ACCOUNT_ID/waf/';","lang":"sql"}],"test":{"txt":"Run this in Athena. Expected: 10 rows, action BLOCK, terminatingruleid block-blockme-query, args like q=BlockMe3, and your CloudShell public IP as clientip. The second query should show BLOCK 10 and ALLOW 10 (plus any extra requests you made). Earlier, the BlockMe curl loop should have printed 403 ten times and the hello loop 200 ten times.","code":"SELECT from_unixtime(\"timestamp\"/1000) AS ts,\n       httprequest.clientip, httprequest.uri, httprequest.args, terminatingruleid\nFROM waflab.waf_logs\nWHERE action = 'BLOCK'\nORDER BY ts DESC\nLIMIT 50;\n\nSELECT action, count(*) AS n FROM waflab.waf_logs GROUP BY action;"},"trouble":[["put-logging-configuration fails with WAFInvalidParameterException, or the console does not list your stream as a logging destination.","The Firehose stream name does not start with aws-waf-logs-, or it is in a different Region from the web ACL (for scope CLOUDFRONT, both must be in us-east-1). Recreate the stream with the correct name and Region."],["Blocked curl still returns 200.","Association has not propagated yet (wait a minute), or the rule was created without --cli-binary-format raw-in-base64-out so the search string is wrong. Check: aws wafv2 get-web-acl --name lab-acl --scope REGIONAL --id $ACL_ID and look at SearchString; in the console the rule should show 'blockme'."],["Athena returns zero rows or HIVE_CURSOR_ERROR.","Files may not be delivered yet (Firehose buffers 60 s; check aws s3 ls). Make sure LOCATION ends with /waf/ and does not point at athena-results/. A HIVE_CURSOR_ERROR usually means a column type does not match the JSON; drop and recreate the table with only the fields shown here."]],"cleanup":[{"txt":"Remove logging, detach and delete the web ACL (delete needs the current lock token).","code":"aws wafv2 delete-logging-configuration --resource-arn $ACL_ARN\naws wafv2 disassociate-web-acl \\\n  --resource-arn arn:aws:apigateway:us-east-1::/restapis/$API_ID/stages/prod\nLOCK=$(aws wafv2 get-web-acl --name lab-acl --scope REGIONAL --id $ACL_ID \\\n  --query LockToken --output text)\naws wafv2 delete-web-acl --name lab-acl --scope REGIONAL --id $ACL_ID --lock-token $LOCK"},{"txt":"Delete the Firehose stream, the API and the IAM role.","code":"aws firehose delete-delivery-stream --delivery-stream-name $FH_NAME\naws apigateway delete-rest-api --rest-api-id $API_ID\naws iam delete-role-policy --role-name lab-waf-firehose-role --policy-name s3-write\naws iam delete-role --role-name lab-waf-firehose-role"},{"txt":"In Athena run: DROP TABLE waflab.waf_logs; then DROP DATABASE waflab; If you changed the workgroup query result location, you can leave it or clear it."},{"txt":"Empty and delete the bucket, and remove local files. The WAF service-linked role AWSServiceRoleForWAFV2Logging costs nothing; you may leave it.","code":"aws s3 rm s3://$BUCKET --recursive\naws s3api delete-bucket --bucket $BUCKET\nrm -f fh-trust.json fh-perms.json rules.json"}],"cost":"Well under USD 0.50 if cleaned up the same day. AWS WAF is not in the free tier: about USD 5 per web ACL per month plus USD 1 per rule per month, prorated hourly (2 hours is a few cents), plus USD 0.60 per million requests. Firehose ingestion is about USD 0.029 per GB (negligible here). Athena is USD 5 per TB scanned with a 10 MB minimum per query (fractions of a cent). S3 and API Gateway usage is tiny. What could cost money: forgetting to delete the web ACL (about USD 6 per month), or attaching it to a busy production resource.","check":[["A company wants WAF logs in S3 for ad hoc Athena queries with the least operational overhead. Do they need Data Firehose?","No. Choose 'S3 bucket' as the WAF logging destination with a bucket named aws-waf-logs-*. Firehose is justified when you need buffering control, record transformation via Lambda, format conversion to Parquet, dynamic partitioning, or delivery to OpenSearch, Splunk or HTTP endpoints."],["Your web ACL protects a CloudFront distribution and logging to a Firehose stream in eu-west-1 fails. Why?","CloudFront is global and its web ACLs (scope CLOUDFRONT) live in us-east-1; the logging Firehose stream must be in the same Region as the web ACL, so it must be in us-east-1 (and its name must start with aws-waf-logs-)."],["How do you reduce Athena cost when querying months of WAF logs?","Scan less data: compress (GZIP) or convert to Parquet with Firehose record format conversion, partition by date (Firehose prefix plus partition projection), and select only needed columns with a WHERE on the partition columns."]]},{"id":"s3lambda","title":"S3 upload to Lambda to DynamoDB (idempotent write)","goal":"Each object uploaded under uploads/ triggers a Lambda function that records it in DynamoDB exactly once, even if the event is delivered twice.","exam":"Tasks 2.4 (reliability: at-least-once delivery, idempotency), 2.3 (security: execution role vs resource-based policy), 4.4 (modernize with event-driven serverless). Traps cleared up: (1) a Lambda function needs TWO permissions - an execution role (what the function may do) and a resource-based policy that lets s3.amazonaws.com invoke it (the console adds the latter automatically, the CLI does not); (2) S3 event notifications are at-least-once and can arrive out of order, so writes must be idempotent (conditional write, sequencer); (3) writing back to the same bucket/prefix that triggers the function causes recursive invocations - use a different prefix or bucket (Lambda recursive loop detection stops some loops but do not rely on it); (4) S3 event notifications vs EventBridge: use EventBridge when you need many targets, content filtering, archive/replay; native notifications support only one destination per event type/prefix combination without overlap.","arch":"aws s3 cp -> S3 bucket (uploads/ prefix, ObjectCreated) -> Lambda lab-s3-to-ddb (execution role) -> DynamoDB table lab-uploads (conditional PutItem)","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","About 30 minutes."],"steps":[{"t":"Set variables","txt":"","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nBUCKET=lab-uploads-$ACCOUNT_ID\nFN=lab-s3-to-ddb\nmkdir -p ~/lab2 && cd ~/lab2","lang":"bash"},{"t":"Create the bucket and the table","txt":"Console equivalent for the table: DynamoDB > Tables > Create table > Table name: lab-uploads, Partition key: pk (String), Table settings: Customize settings > Capacity mode: On-demand.","code":"aws s3api create-bucket --bucket $BUCKET\naws dynamodb create-table --table-name lab-uploads \\\n  --attribute-definitions AttributeName=pk,AttributeType=S \\\n  --key-schema AttributeName=pk,KeyType=HASH \\\n  --billing-mode PAY_PER_REQUEST\naws dynamodb wait table-exists --table-name lab-uploads","lang":"bash"},{"t":"Execution role: trust policy","txt":"Lets the Lambda service assume the role.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"lambda.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}","lang":"json"},{"t":"Execution role: least-privilege permissions","txt":"Only PutItem on one table, and only writing to its own log group. We pre-create the log group in the next step so the role does not need logs:CreateLogGroup. Note: the function never reads the object, so it gets no S3 permission at all.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"WriteOnlyThisTable\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:PutItem\",\n      \"Resource\": \"arn:aws:dynamodb:us-east-1:ACCOUNT_ID:table/lab-uploads\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-s3-to-ddb:*\"\n    }\n  ]\n}","lang":"json"},{"t":"Create the role and the log group","txt":"","code":"cat > trust.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"lambda.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\nEOF\ncat > perms.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"WriteOnlyThisTable\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:PutItem\",\n      \"Resource\": \"arn:aws:dynamodb:us-east-1:ACCOUNT_ID:table/lab-uploads\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-s3-to-ddb:*\"\n    }\n  ]\n}\nEOF\nsed -i \"s/ACCOUNT_ID/$ACCOUNT_ID/g\" perms.json\naws iam create-role --role-name lab-s3-to-ddb-role --assume-role-policy-document file://trust.json\naws iam put-role-policy --role-name lab-s3-to-ddb-role --policy-name app --policy-document file://perms.json\naws logs create-log-group --log-group-name /aws/lambda/$FN\nsleep 15","lang":"bash"},{"t":"Write the function","txt":"Idempotency: the conditional write rejects a repeat delivery of the same event (same sequencer); catching ConditionalCheckFailedException and returning success stops pointless retries. It does not guard against an older event arriving late. For strict ordering, store the sequencer and only overwrite when the new one is greater (compare as hex after padding the shorter one with leading zeros).","code":"import os\nimport urllib.parse\nimport boto3\nfrom botocore.exceptions import ClientError\n\nddb = boto3.client(\"dynamodb\")\nTABLE = os.environ[\"TABLE\"]\n\ndef handler(event, context):\n    for r in event[\"Records\"]:\n        bucket = r[\"s3\"][\"bucket\"][\"name\"]\n        # keys arrive URL-encoded: \"my file.txt\" -> \"my+file.txt\"\n        key = urllib.parse.unquote_plus(r[\"s3\"][\"object\"][\"key\"])\n        seq = r[\"s3\"][\"object\"][\"sequencer\"]\n        pk = f\"{bucket}/{key}\"\n        try:\n            ddb.put_item(\n                TableName=TABLE,\n                Item={\n                    \"pk\": {\"S\": pk},\n                    \"sequencer\": {\"S\": seq},\n                    \"size\": {\"N\": str(r[\"s3\"][\"object\"].get(\"size\", 0))},\n                    \"eventTime\": {\"S\": r[\"eventTime\"]},\n                },\n                # idempotent: the same event delivered twice is a no-op\n                ConditionExpression=\"attribute_not_exists(pk) OR #s <> :seq\",\n                ExpressionAttributeNames={\"#s\": \"sequencer\"},\n                ExpressionAttributeValues={\":seq\": {\"S\": seq}},\n            )\n            print(f\"STORED {pk} seq={seq}\")\n        except ClientError as e:\n            if e.response[\"Error\"][\"Code\"] == \"ConditionalCheckFailedException\":\n                print(f\"DUPLICATE ignored {pk} seq={seq}\")\n            else:\n                raise","lang":"python"},{"t":"Package and create the function","txt":"","code":"cat > app.py <<'EOF'\nimport os\nimport urllib.parse\nimport boto3\nfrom botocore.exceptions import ClientError\n\nddb = boto3.client(\"dynamodb\")\nTABLE = os.environ[\"TABLE\"]\n\ndef handler(event, context):\n    for r in event[\"Records\"]:\n        bucket = r[\"s3\"][\"bucket\"][\"name\"]\n        # keys arrive URL-encoded: \"my file.txt\" -> \"my+file.txt\"\n        key = urllib.parse.unquote_plus(r[\"s3\"][\"object\"][\"key\"])\n        seq = r[\"s3\"][\"object\"][\"sequencer\"]\n        pk = f\"{bucket}/{key}\"\n        try:\n            ddb.put_item(\n                TableName=TABLE,\n                Item={\n                    \"pk\": {\"S\": pk},\n                    \"sequencer\": {\"S\": seq},\n                    \"size\": {\"N\": str(r[\"s3\"][\"object\"].get(\"size\", 0))},\n                    \"eventTime\": {\"S\": r[\"eventTime\"]},\n                },\n                # idempotent: the same event delivered twice is a no-op\n                ConditionExpression=\"attribute_not_exists(pk) OR #s <> :seq\",\n                ExpressionAttributeNames={\"#s\": \"sequencer\"},\n                ExpressionAttributeValues={\":seq\": {\"S\": seq}},\n            )\n            print(f\"STORED {pk} seq={seq}\")\n        except ClientError as e:\n            if e.response[\"Error\"][\"Code\"] == \"ConditionalCheckFailedException\":\n                print(f\"DUPLICATE ignored {pk} seq={seq}\")\n            else:\n                raise\nEOF\nzip -q fn.zip app.py\naws lambda create-function --function-name $FN --runtime python3.13 \\\n  --handler app.handler --zip-file fileb://fn.zip --timeout 30 \\\n  --role arn:aws:iam::$ACCOUNT_ID:role/lab-s3-to-ddb-role \\\n  --environment Variables={TABLE=lab-uploads}\naws lambda wait function-active-v2 --function-name $FN","lang":"bash"},{"t":"Allow S3 to invoke the function (resource-based policy)","txt":"This is the step the console does for you when you add an S3 trigger. source-account guards against a bucket with the same name in another account (bucket names can be reused after deletion).","code":"aws lambda add-permission --function-name $FN --statement-id s3-invoke \\\n  --action lambda:InvokeFunction --principal s3.amazonaws.com \\\n  --source-arn arn:aws:s3:::$BUCKET --source-account $ACCOUNT_ID","lang":"bash"},{"t":"Add the event notification","txt":"Console equivalent: S3 > bucket > Properties > Event notifications > Create event notification > Event name: to-lambda, Prefix: uploads/, Event types: All object create events (s3:ObjectCreated:*), Destination: Lambda function > lab-s3-to-ddb. The prefix keeps the function from reacting to anything else in the bucket.","code":"cat > notif.json <<EOF\n{\n  \"LambdaFunctionConfigurations\": [\n    {\n      \"Id\": \"to-lambda\",\n      \"LambdaFunctionArn\": \"arn:aws:lambda:us-east-1:$ACCOUNT_ID:function:$FN\",\n      \"Events\": [\"s3:ObjectCreated:*\"],\n      \"Filter\": { \"Key\": { \"FilterRules\": [ { \"Name\": \"prefix\", \"Value\": \"uploads/\" } ] } }\n    }\n  ]\n}\nEOF\naws s3api put-bucket-notification-configuration --bucket $BUCKET \\\n  --notification-configuration file://notif.json","lang":"bash"}],"test":{"txt":"Upload a file, then replay the exact same event twice by invoking the function directly. Expected: the table has exactly one item for uploads/my report.txt (note the decoded space), the first log line says STORED, and both manual replays of the same sequencer say DUPLICATE ignored.","code":"echo hello > r.txt\naws s3 cp r.txt \"s3://$BUCKET/uploads/my report.txt\"\nsleep 5\naws dynamodb scan --table-name lab-uploads --query 'Items[].{pk:pk.S,seq:sequencer.S}'\nSEQ=$(aws dynamodb get-item --table-name lab-uploads \\\n  --key \"{\\\"pk\\\":{\\\"S\\\":\\\"$BUCKET/uploads/my report.txt\\\"}}\" \\\n  --query Item.sequencer.S --output text)\ncat > dup.json <<EOF\n{\"Records\":[{\"eventTime\":\"2026-10-09T12:00:00.000Z\",\n \"s3\":{\"bucket\":{\"name\":\"$BUCKET\"},\n       \"object\":{\"key\":\"uploads/my+report.txt\",\"size\":6,\"sequencer\":\"$SEQ\"}}}]}\nEOF\nfor i in 1 2; do\n  aws lambda invoke --function-name $FN --cli-binary-format raw-in-base64-out \\\n    --payload file://dup.json out.json >/dev/null\ndone\naws logs tail /aws/lambda/$FN --since 5m | grep -E 'STORED|DUPLICATE'\naws dynamodb scan --table-name lab-uploads --select COUNT"},"trouble":[["put-bucket-notification-configuration fails: 'Unable to validate the following destination configurations'.","S3 could not confirm it may invoke the function. Run the add-permission step (principal s3.amazonaws.com, correct bucket ARN), then retry."],["Upload works but no item appears; logs show AccessDeniedException for dynamodb:PutItem.","The execution role policy has a wrong table ARN (Region, ACCOUNT_ID placeholder not replaced, or table name). Fix perms.json and re-run put-role-policy. No log group at all means the function was never invoked: check the prefix (uploads/) and that the notification saved."],["Item key looks like uploads/my+report.txt or the function errors with NoSuchKey when reading.","S3 URL-encodes keys in events. Always urllib.parse.unquote_plus the key before using it."]],"cleanup":[{"txt":"Delete the notification, function, log group, role, table and bucket.","code":"aws s3api put-bucket-notification-configuration --bucket $BUCKET \\\n  --notification-configuration '{}'\naws lambda delete-function --function-name $FN\naws logs delete-log-group --log-group-name /aws/lambda/$FN\naws iam delete-role-policy --role-name lab-s3-to-ddb-role --policy-name app\naws iam delete-role --role-name lab-s3-to-ddb-role\naws dynamodb delete-table --table-name lab-uploads\naws s3 rm s3://$BUCKET --recursive && aws s3api delete-bucket --bucket $BUCKET\ncd ~ && rm -rf ~/lab2"}],"cost":"Effectively free: a handful of Lambda invocations, DynamoDB on-demand writes and S3 requests, all within free-tier or credit allowances (accounts opened after 15 July 2025 use the credit-based Free plan instead of the old 12-month free tier). What could cost money: a recursive loop (function writing back into the trigger prefix), which can run up millions of invocations quickly.","check":[["You added the S3 trigger with the CLI, the role allows dynamodb:PutItem, but the function never runs. What is missing?","The resource-based policy on the function (lambda add-permission for principal s3.amazonaws.com with the bucket ARN as SourceArn). The execution role controls what the function can do; the resource policy controls who can invoke it."],["Why must the write be idempotent, and how did you make it so?","S3 event notifications are delivered at least once (occasionally twice) and Lambda async invocations retry on error. A DynamoDB conditional PutItem keyed on bucket/key that rejects the same sequencer turns a duplicate into a harmless no-op. Lambda Powertools idempotency utility is the packaged alternative."],["Requirement: send each new object to Lambda, an SQS queue and Step Functions, and replay events from last week. Native S3 notifications or EventBridge?","EventBridge (turn on 'Send notifications to Amazon EventBridge' on the bucket): multiple targets per rule, advanced content filtering, archive and replay. Native notifications are simpler and cheaper but cannot fan out the same event type/prefix to multiple destinations (you would add SNS fan-out)."]]},{"id":"ddbstream","title":"DynamoDB Streams to Lambda to SNS email (filter + partial batch failure)","goal":"Email an alert only when a HIGH-priority order is inserted, using a stream event source mapping with a filter, partial batch responses and an on-failure destination.","exam":"Tasks 2.4 and 3.4 (reliability: retries, poison records, on-failure destinations), 4.4 (event-driven modernization), 3.5 (cost: filtering avoids paying for useless invocations). Traps cleared up: (1) stream view type decides what the record contains - KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES - and you need NEW_IMAGE or NEW_AND_OLD_IMAGES to filter on attribute values; (2) Lambda reads the stream through an event source mapping (polling), so the permission is in the EXECUTION ROLE (GetRecords etc.), not a resource policy; (3) a failing record blocks its shard until it succeeds or expires (24 h stream retention) unless you set MaximumRetryAttempts/MaximumRecordAgeInSeconds, BisectBatchOnFunctionError or ReportBatchItemFailures; (4) an SQS or SNS on-failure destination receives only metadata (shard, sequence numbers), not the records; an S3 on-failure destination also gets the full batch payload; (5) records removed by an event filter are discarded and never reprocessed; (6) DynamoDB Streams vs Kinesis Data Streams for DynamoDB: Streams gives exactly-once, ordered per item, 24 h, max 2 readers per shard; KDS gives longer retention and more consumers but may duplicate.","arch":"aws dynamodb put-item -> table lab-orders (stream NEW_AND_OLD_IMAGES) -> event source mapping (filter INSERT + priority HIGH, batch 10, retries 2) -> Lambda lab-orders-notify -> SNS topic -> email; failed batches -> SQS lab-orders-failures (metadata)","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","An email address you can read (to confirm the SNS subscription).","About 40 minutes."],"steps":[{"t":"Set variables","txt":"","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nFN=lab-orders-notify\nEMAIL=you@example.com   # change this\nmkdir -p ~/lab3 && cd ~/lab3","lang":"bash"},{"t":"Create the table with a stream","txt":"Console equivalent: create table lab-orders (partition key orderId, String, on-demand), then Exports and streams tab > DynamoDB stream details > Turn on > View type: New and old images.","code":"aws dynamodb create-table --table-name lab-orders \\\n  --attribute-definitions AttributeName=orderId,AttributeType=S \\\n  --key-schema AttributeName=orderId,KeyType=HASH \\\n  --billing-mode PAY_PER_REQUEST \\\n  --stream-specification StreamEnabled=true,StreamViewType=NEW_AND_OLD_IMAGES\naws dynamodb wait table-exists --table-name lab-orders\nSTREAM_ARN=$(aws dynamodb describe-table --table-name lab-orders \\\n  --query Table.LatestStreamArn --output text); echo $STREAM_ARN","lang":"bash"},{"t":"Create the SNS topic, email subscription and failure queue","txt":"Open the email titled 'AWS Notification - Subscription Confirmation' and click Confirm subscription. Until you do, the subscription shows PendingConfirmation and nothing is delivered.","code":"TOPIC_ARN=$(aws sns create-topic --name lab-orders-alerts --query TopicArn --output text)\naws sns subscribe --topic-arn $TOPIC_ARN --protocol email --notification-endpoint $EMAIL\nQURL=$(aws sqs create-queue --queue-name lab-orders-failures --query QueueUrl --output text)\nQARN=arn:aws:sqs:us-east-1:$ACCOUNT_ID:lab-orders-failures","lang":"bash"},{"t":"Execution role permissions (least privilege)","txt":"Stream read actions scoped to this table's streams; ListStreams cannot be scoped to one table, so it gets '*'. Publish only to one topic; SendMessage only to the failure queue (the event source mapping uses the function's role to write there). Trust policy is the same lambda.amazonaws.com trust as lab 2.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"ReadThisTableStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"dynamodb:DescribeStream\",\n        \"dynamodb:GetRecords\",\n        \"dynamodb:GetShardIterator\"\n      ],\n      \"Resource\": \"arn:aws:dynamodb:us-east-1:ACCOUNT_ID:table/lab-orders/stream/*\"\n    },\n    {\n      \"Sid\": \"ListStreamsIsAccountLevel\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:ListStreams\",\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\": \"PublishToOneTopic\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sns:Publish\",\n      \"Resource\": \"arn:aws:sns:us-east-1:ACCOUNT_ID:lab-orders-alerts\"\n    },\n    {\n      \"Sid\": \"OnFailureDestination\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sqs:SendMessage\",\n      \"Resource\": \"arn:aws:sqs:us-east-1:ACCOUNT_ID:lab-orders-failures\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-orders-notify:*\"\n    }\n  ]\n}","lang":"json"},{"t":"Create the role and log group","txt":"","code":"cat > trust.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"lambda.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\nEOF\ncat > perms.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"ReadThisTableStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"dynamodb:DescribeStream\",\n        \"dynamodb:GetRecords\",\n        \"dynamodb:GetShardIterator\"\n      ],\n      \"Resource\": \"arn:aws:dynamodb:us-east-1:ACCOUNT_ID:table/lab-orders/stream/*\"\n    },\n    {\n      \"Sid\": \"ListStreamsIsAccountLevel\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"dynamodb:ListStreams\",\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\": \"PublishToOneTopic\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sns:Publish\",\n      \"Resource\": \"arn:aws:sns:us-east-1:ACCOUNT_ID:lab-orders-alerts\"\n    },\n    {\n      \"Sid\": \"OnFailureDestination\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sqs:SendMessage\",\n      \"Resource\": \"arn:aws:sqs:us-east-1:ACCOUNT_ID:lab-orders-failures\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-orders-notify:*\"\n    }\n  ]\n}\nEOF\nsed -i \"s/ACCOUNT_ID/$ACCOUNT_ID/g\" perms.json\naws iam create-role --role-name lab-orders-notify-role --assume-role-policy-document file://trust.json\naws iam put-role-policy --role-name lab-orders-notify-role --policy-name app --policy-document file://perms.json\naws logs create-log-group --log-group-name /aws/lambda/$FN\nsleep 15","lang":"bash"},{"t":"Write the function","txt":"Returns batchItemFailures with the stream SequenceNumber of each failed record. Lambda then checkpoints just before the lowest failed sequence number and retries from there - so successful records AFTER a failure in the same batch are delivered again (design for duplicates).","code":"import json\nimport os\nimport boto3\n\nsns = boto3.client(\"sns\")\nTOPIC = os.environ[\"TOPIC_ARN\"]\n\ndef handler(event, context):\n    failures = []\n    for r in event[\"Records\"]:\n        seq = r[\"dynamodb\"][\"SequenceNumber\"]\n        try:\n            img = r[\"dynamodb\"][\"NewImage\"]\n            if img.get(\"fail\", {}).get(\"BOOL\"):\n                raise ValueError(\"simulated poison record\")\n            order = img[\"orderId\"][\"S\"]\n            sns.publish(\n                TopicArn=TOPIC,\n                Subject=f\"High-priority order {order}\",\n                Message=json.dumps(img, indent=2),\n            )\n            print(f\"NOTIFIED {order} seq={seq}\")\n        except Exception as e:\n            print(f\"FAILED seq={seq}: {e}\")\n            failures.append({\"itemIdentifier\": seq})\n    # partial batch response: only these records (and later ones) are retried\n    return {\"batchItemFailures\": failures}","lang":"python"},{"t":"Create the function","txt":"","code":"cat > app.py <<'EOF'\nimport json\nimport os\nimport boto3\n\nsns = boto3.client(\"sns\")\nTOPIC = os.environ[\"TOPIC_ARN\"]\n\ndef handler(event, context):\n    failures = []\n    for r in event[\"Records\"]:\n        seq = r[\"dynamodb\"][\"SequenceNumber\"]\n        try:\n            img = r[\"dynamodb\"][\"NewImage\"]\n            if img.get(\"fail\", {}).get(\"BOOL\"):\n                raise ValueError(\"simulated poison record\")\n            order = img[\"orderId\"][\"S\"]\n            sns.publish(\n                TopicArn=TOPIC,\n                Subject=f\"High-priority order {order}\",\n                Message=json.dumps(img, indent=2),\n            )\n            print(f\"NOTIFIED {order} seq={seq}\")\n        except Exception as e:\n            print(f\"FAILED seq={seq}: {e}\")\n            failures.append({\"itemIdentifier\": seq})\n    # partial batch response: only these records (and later ones) are retried\n    return {\"batchItemFailures\": failures}\nEOF\nzip -q fn.zip app.py\naws lambda create-function --function-name $FN --runtime python3.13 \\\n  --handler app.handler --zip-file fileb://fn.zip --timeout 30 \\\n  --role arn:aws:iam::$ACCOUNT_ID:role/lab-orders-notify-role \\\n  --environment Variables={TOPIC_ARN=$TOPIC_ARN}\naws lambda wait function-active-v2 --function-name $FN","lang":"bash"},{"t":"Write the filter","txt":"DynamoDB stream records use typed JSON, so you match on dynamodb.NewImage.priority.S. Number attributes arrive as strings inside N, so numeric filters like {\"numeric\": [\">\", 100]} do not match DynamoDB N values - filter on strings or booleans instead.","code":"{\n  \"Filters\": [\n    {\n      \"Pattern\": \"{\\\"eventName\\\": [\\\"INSERT\\\"], \\\"dynamodb\\\": {\\\"NewImage\\\": {\\\"priority\\\": {\\\"S\\\": [\\\"HIGH\\\"]}}}}\"\n    }\n  ]\n}","lang":"json"},{"t":"Create the event source mapping","txt":"Console equivalent: Lambda > lab-orders-notify > Add trigger > DynamoDB > DynamoDB table: lab-orders, Batch size: 10, Starting position: Latest, Additional settings: On-failure destination: the SQS queue ARN, Retry attempts: 2, Split batch on error: on, Report batch item failures: on, Filter criteria: paste the pattern.","code":"cat > filter.json <<'EOF'\n{\n  \"Filters\": [\n    {\n      \"Pattern\": \"{\\\"eventName\\\": [\\\"INSERT\\\"], \\\"dynamodb\\\": {\\\"NewImage\\\": {\\\"priority\\\": {\\\"S\\\": [\\\"HIGH\\\"]}}}}\"\n    }\n  ]\n}\nEOF\naws lambda create-event-source-mapping --function-name $FN \\\n  --event-source-arn $STREAM_ARN --starting-position LATEST \\\n  --batch-size 10 --maximum-retry-attempts 2 \\\n  --bisect-batch-on-function-error \\\n  --function-response-types ReportBatchItemFailures \\\n  --destination-config \"{\\\"OnFailure\\\":{\\\"Destination\\\":\\\"$QARN\\\"}}\" \\\n  --filter-criteria file://filter.json\nESM_UUID=$(aws lambda list-event-source-mappings --function-name $FN \\\n  --query 'EventSourceMappings[0].UUID' --output text)\n# wait until State is Enabled (about 1 minute)\naws lambda get-event-source-mapping --uuid $ESM_UUID --query State","lang":"bash"}],"test":{"txt":"Insert one HIGH, one LOW and one poison HIGH order. Expected: one email for o-1 within a minute; nothing at all for o-2 (filtered out, no invocation, no log line); o-3 logs FAILED several times (first attempt plus the retries you allowed), then a message appears in the SQS queue containing DDBStreamBatchInfo (shard ID and sequence numbers, not the item data).","code":"aws dynamodb put-it
