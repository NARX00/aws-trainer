retry function errors up to 2 more times (events kept up to 6 hours by default)."},{"task":"2.5","n":1,"title":"Global photo app is slow","scenario":"A photo-sharing company runs everything in one Region (us-east-1) and has users worldwide.","problems":["Users in Europe and Asia wait several seconds for photos to load; photos are stored in S3.","The 'popular photos' page runs the same database query thousands of times a minute; the RDS MySQL database is at 95% CPU, almost all reads.","The app keeps user sessions in DynamoDB and at peak the team needs reads in microseconds.","A new live multiplayer game uses UDP and needs two fixed IP addresses partners can allow in firewalls, plus lowest latency worldwide."],"constraint":"Least change to the application code.","hint":"Think: edge cache for static objects, in-memory layer for repeated reads, a cache that speaks the DynamoDB API, and an anycast network service for non-HTTP traffic.","answer":[{"p":1,"svc":"Amazon CloudFront with the S3 bucket as origin + Origin Access Control (OAC)","why":"Caches photos at edge locations close to users; OAC keeps the bucket private."},{"p":2,"svc":"Amazon ElastiCache (Valkey or Redis OSS) with cache-aside, or RDS read replicas","why":"A cache absorbs the identical repeated query (needs some code for cache-aside); read replicas offload reads but the app must send reads to the reader endpoint. On the exam, prefer ElastiCache when the same query repeats; both options need some code change."},{"p":3,"svc":"DynamoDB Accelerator (DAX)","why":"API-compatible in-memory cache for DynamoDB giving microsecond reads with minimal code change (swap in the DAX client)."},{"p":4,"svc":"AWS Global Accelerator","why":"Gives two static anycast IPs, supports TCP and UDP, and routes over the AWS backbone to the nearest healthy endpoint."}],"traps":["CloudFront for the game: it serves HTTP/HTTPS (and WebSocket), not raw UDP; its optional Anycast static IP list is for HTTP traffic, not two IPs for a UDP game.","S3 Transfer Acceleration for slow downloads — it speeds long-distance transfers to/from a bucket but does not cache; CloudFront is the read-heavy answer.","ElastiCache in front of DynamoDB — works but needs cache-aside code; DAX is drop-in."],"extra":"Global Accelerator = static IPs + TCP/UDP + fast regional failover; CloudFront = HTTP caching at the edge."},{"task":"2.5","n":2,"title":"Genomics HPC cluster","scenario":"A genomics lab is moving its on-premises HPC cluster to AWS. Input data (raw sequencer files) lands in S3.","problems":["Tightly coupled MPI simulation jobs need the lowest possible node-to-node latency and highest network throughput.","Jobs need a shared POSIX file system that can read S3 input data at very high aggregate throughput during the run and write results back to S3.","Each node needs temporary scratch space with the highest IOPS; losing it when the instance stops is acceptable.","Windows-based analysts need SMB file shares integrated with the lab's Active Directory to view results."],"constraint":"Highest performance at the lowest cost.","hint":"One answer is a placement strategy, one a file system that links to S3, one is storage that comes with the instance, one is a Windows-native file service.","answer":[{"p":1,"svc":"Cluster placement group (+ Elastic Fabric Adapter on supported HPC instances)","why":"Packs instances close together in one AZ for low latency and high throughput; EFA adds OS-bypass for MPI.","also":"AWS Parallel Computing Service (managed Slurm)"},{"p":2,"svc":"Amazon FSx for Lustre linked to the S3 bucket (data repository association)","why":"Parallel file system built for HPC; lazy-loads objects from S3 and can export results back."},{"p":3,"svc":"EC2 instance store (local NVMe SSD)","why":"Highest local IOPS at no extra cost; data is ephemeral, which matches scratch use."},{"p":4,"svc":"Amazon FSx for Windows File Server","why":"Fully managed SMB shares with native Active Directory integration."}],"traps":["Amazon EFS for the HPC file system — elastic NFS, but FSx for Lustre is the purpose-built answer for high-throughput HPC with S3 linkage.","Spread placement group — spreads instances across distinct hardware for fault isolation; it increases, not lowers, latency between nodes.","EBS io2 for scratch — persistent and costly; instance store is free with the instance and faster for throw-away data."],"extra":"FSx for Lustre scratch deployment = cheapest, no replication (short jobs); persistent deployment = longer-lived data with replication within an AZ."},{"task":"2.5","n":3,"title":"Bank picks purpose-built databases","scenario":"A digital bank is breaking up a single relational database and wants a purpose-built managed store for each workload.","problems":["Fraud analysts must find links between accounts, devices and cards several hops apart in milliseconds.","Customers search product and help articles with free text, typo tolerance and relevance ranking.","A real-time rewards ledger needs microsecond reads, Redis-compatible APIs, and must not lose data if a node fails (it is the primary database, not a cache).","A team running MongoDB wants a managed service without rewriting its queries.","Lambda functions spike to thousands of concurrent invocations and exhaust Aurora PostgreSQL connections."],"constraint":"Fully managed with the least code change.","hint":"Relationships, search, durable in-memory, document-compatible, and something that pools connections.","answer":[{"p":1,"svc":"Amazon Neptune","why":"Graph database designed for multi-hop relationship traversals (Gremlin/openCypher/SPARQL)."},{"p":2,"svc":"Amazon OpenSearch Service","why":"Full-text search with fuzzy matching and relevance scoring."},{"p":3,"svc":"Amazon MemoryDB","why":"Durable, Redis OSS/Valkey-compatible in-memory database with a Multi-AZ transaction log, so it can be the primary store."},{"p":4,"svc":"Amazon DocumentDB (with MongoDB compatibility)","why":"Managed document database that supports MongoDB drivers and APIs, so little or no query rewrite."},{"p":5,"svc":"Amazon RDS Proxy","why":"Pools and shares database connections in front of Aurora so Lambda bursts don't exhaust them."}],"traps":["ElastiCache for the ledger — a cache; MemoryDB is the choice when the in-memory store must be durable and primary.","DynamoDB for the fraud graph — key-value lookups, not efficient multi-hop traversal.","Aurora full-text search for the search box — limited relevance and typo tolerance compared with OpenSearch.","Raising max_connections / bigger Aurora instance — treats the symptom; RDS Proxy is the managed pooling fix."],"extra":"RDS Proxy also speeds Aurora/RDS failover for clients and can enforce IAM authentication with credentials stored in Secrets Manager."},{"task":"2.6","n":1,"title":"Choosing pricing models for a SaaS","scenario":"A SaaS company wants to cut its bill without reducing reliability.","problems":["A steady 24/7 compute baseline runs on EC2 across several instance families and two Regions; part of it will move to Fargate and Lambda next year.","A nightly video-rendering batch can be interrupted and resumed from checkpoints.","Steady RDS PostgreSQL, DynamoDB and ElastiCache Valkey usage; the team may change engines or instance sizes during the year.","A two-week DR test each quarter must have guaranteed EC2 capacity in one specific Availability Zone."],"constraint":"Most cost-effective while keeping flexibility for planned changes.","hint":"Two different commitment-based discounts (one for compute, one for databases), one discount for interruptible work, and one capacity tool that needs no term.","answer":[{"p":1,"svc":"Compute Savings Plans","why":"Commitment in $/hour that applies across instance families, Regions, Fargate and Lambda, so it follows the planned migration."},{"p":2,"svc":"EC2 Spot Instances (diversified instance types, price-capacity-optimized allocation)","why":"Large discount for interruption-tolerant, checkpointed work."},{"p":3,"svc":"Database Savings Plans (1-year term)","why":"Launched Dec 2025: one 1-year $/hour commitment across Aurora, RDS, DynamoDB, ElastiCache, DocumentDB, Neptune, Keyspaces, Timestream and DMS, flexible across engines, sizes and Regions. Up to 35% for serverless, up to 20% for provisioned instances, 12–18% for DynamoDB/Keyspaces throughput."},{"p":4,"svc":"On-Demand Capacity Reservations","why":"Reserve capacity in a specific AZ only for the test period, with no 1- or 3-year term."}],"traps":["EC2 Instance Savings Plans or Standard RIs for problem 1 — locked to an instance family/Region and do not cover Fargate or Lambda.","RDS Reserved Instances for problem 3 — tied to engine and instance family; a planned engine change would strand them.","Zonal Reserved Instances for problem 4 — reserve AZ capacity but need a 1- or 3-year term for a few weeks a year."],"extra":"Savings Plans give a discount but NOT a capacity guarantee; combine Savings Plans or RIs with On-Demand Capacity Reservations to get both."},{"task":"2.6","n":2,"title":"Cutting data transfer charges","scenario":"A media analytics company reviews Cost Explorer and finds data transfer and NAT costs are its top line items.","problems":["EC2 instances in private subnets read many TB per day from S3 in the same Region through a NAT gateway.","The same instances call Amazon ECR, CloudWatch Logs and Kinesis APIs heavily through the NAT gateway.","Customers worldwide download large video files directly from public S3 URLs.","The on-premises data center pulls about 40 TB per month of processed results out of AWS over the internet; usage is steady."],"constraint":"Reduce data transfer cost with the least architecture change.","hint":"Which endpoint type is free? Which edge service lowers per-GB delivery? Which dedicated link lowers outbound rates?","answer":[{"p":1,"svc":"S3 gateway VPC endpoint","why":"No hourly or per-GB charge; route-table entry sends S3 traffic past the NAT gateway and its data processing fee."},{"p":2,"svc":"Interface VPC endpoints (AWS PrivateLink) for ECR, CloudWatch Logs and Kinesis","why":"Endpoint per-GB processing is lower than NAT gateway processing at high volume, and traffic stays private."},{"p":3,"svc":"Amazon CloudFront in front of S3 (OAC)","why":"Data transfer from S3 to CloudFront is free, CloudFront delivery is cheaper per GB than S3 direct internet egress, and caching cuts origin reads."},{"p":4,"svc":"AWS Direct Connect","why":"Data transfer out over Direct Connect is billed at a lower per-GB rate than internet egress; steady 40 TB/month justifies the port cost."}],"traps":["Interface endpoint for S3 in problem 1 — works but costs per hour and per GB; the gateway endpoint is free (interface is for on-prem or cross-Region access).","S3 Transfer Acceleration for downloads — adds cost per GB and does not cache.","Site-to-Site VPN for problem 4 — still internet egress rates; it secures traffic but does not lower data transfer cost."],"extra":"Gateway endpoints exist only for S3 and DynamoDB. Also watch cross-AZ traffic: it is charged in each direction."},{"task":"2.6","n":3,"title":"Org-wide spend awareness","scenario":"A company runs 80 accounts in AWS Organizations. The CFO wants spend controls with little manual work.","problems":["Finance must see monthly cost per business unit; every resource already has a 'BusinessUnit' tag, but the tag does not appear in billing reports.","When a sandbox account's forecasted monthly spend passes $3,000, notify the owner and automatically stop new EC2 launches there.","Catch unusual spikes (for example a runaway service) without anyone setting fixed thresholds.","Find over-provisioned EC2 instances, EBS volumes and Lambda functions in all accounts.","Estimate the monthly cost of a new architecture before it is built."],"constraint":"Least operational overhead across the organization.","hint":"Some of these need a switch turned on in the management account first.","answer":[{"p":1,"svc":"Activate the tag as a user-defined cost allocation tag in the management (payer) account","why":"Tags appear in Cost Explorer and CUR only after activation, and only for usage from activation onward (backfill can be requested)."},{"p":2,"svc":"AWS Budgets with a forecast alert + budget action (apply an SCP or IAM deny policy)","why":"Budgets alert on forecasted spend; budget actions can apply an SCP/IAM policy or stop EC2/RDS automatically."},{"p":3,"svc":"AWS Cost Anomaly Detection","why":"ML-based monitors flag abnormal spend without fixed thresholds and send alerts via email or SNS."},{"p":4,"svc":"AWS Compute Optimizer, opted in for the whole organization from the management account (delegated admin optional)","why":"Right-sizing recommendations for EC2, Auto Scaling groups, EBS, Lambda, ECS on Fargate and RDS across all member accounts.","also":"AWS Cost Optimization Hub (uses Compute Optimizer data, org-wide)"},{"p":5,"svc":"AWS Pricing Calculator","why":"Models cost of planned architectures before deployment."}],"traps":["Trusted Advisor for right-sizing — full set of checks needs Business Support+ or Enterprise Support, and Compute Optimizer gives deeper, ML-based recommendations.","Cost Explorer alone for problem 2 — shows and forecasts spend but cannot alert or take action.","CloudWatch billing alarm — only actual charges (not forecast) and no automated SCP action."],"extra":"Add tag policies in Organizations to standardize tag keys/values, and AWS Cost Categories to group accounts and tags into business units."},{"task":"3.1","n":1,"title":"Observability for an online store","scenario":"An online retailer runs 25 microservices on Amazon ECS across 200 accounts. The ops team is overwhelmed.","problems":["A checkout request is sometimes slow; the team cannot tell which downstream service causes it.","They want to know the checkout flow is broken before customers complain, even at 3 a.m. with no traffic.","The security team needs application logs from all accounts streamed to one place for full-text search within minutes.","When AWS schedules maintenance that affects their EC2 instances, an automated runbook should drain and replace the instance."],"constraint":"Least operational overhead.","hint":"Tracing, scripted fake users, a log streaming pipeline, and the service that tells you about AWS's own events.","answer":[{"p":1,"svc":"Distributed tracing with AWS X-Ray (instrumented via OpenTelemetry / AWS Distro for OpenTelemetry), viewed in CloudWatch Application Signals or the trace map","why":"Shows latency per hop so the slow service stands out; X-Ray SDKs are moving to maintenance, so OpenTelemetry is the current instrumentation path."},{"p":2,"svc":"Amazon CloudWatch Synthetics canaries","why":"Scripted canaries run the checkout flow on a schedule and alarm on failure, even with no real users."},{"p":3,"svc":"CloudWatch Logs subscription filters to a cross-account destination → Amazon Data Firehose → Amazon OpenSearch Service","why":"Near-real-time centralized streaming with managed delivery and full-text search."},{"p":4,"svc":"AWS Health events → Amazon EventBridge rule → Systems Manager Automation runbook","why":"Health publishes scheduled-change events to EventBridge, which can trigger automated remediation."}],"traps":["CloudTrail to find slow services — records API calls, not request latency inside the app.","A custom Lambda pinger instead of Synthetics — more code to maintain; canaries are the managed option with screenshots and HAR files.","Exporting logs to S3 with CreateExportTask — batch, not near real time."],"extra":"AWS Health organizational view (enabled from the management account or a delegated admin) aggregates Health events for all accounts."},{"task":"3.1","n":2,"title":"Safer deployments everywhere","scenario":"A fintech company has frequent failed releases and wants a consistent CI/CD strategy.","problems":["Lambda functions: send 10% of traffic to the new version for 10 minutes, then all of it; roll back automatically if an error alarm fires.","An ECS service on Fargate: run the new version alongside the old one, test it on a separate listener, then switch traffic with instant rollback.","A fleet of 40 EC2 instances must keep at least 75% of instances serving during a deployment with no extra instances.","The same network and logging baseline must be deployed to 30 accounts in 3 Regions, including future accounts."],"constraint":"Minimize downtime and custom scripting.","hint":"Four different deployment strategies; the last one is about many accounts at once.","answer":[{"p":1,"svc":"AWS CodeDeploy with a Lambda canary deployment configuration (e.g. Canary10Percent10Minutes) on a function alias, with CloudWatch alarms for rollback","why":"Shifts alias traffic in steps and rolls back automatically on alarm.","also":"AWS SAM DeploymentPreference Canary10Percent10Minutes (same CodeDeploy config)"},{"p":2,"svc":"Blue/green for ECS — Amazon ECS native blue/green deployments or CodeDeploy blue/green with a production and a test listener on the ALB","why":"New task set receives test traffic first, then traffic shifts with fast rollback to the old task set."},{"p":3,"svc":"CodeDeploy in-place (rolling) deployment with a minimum-healthy-hosts setting of 75%","why":"Updates instances in batches while keeping the required capacity, without launching extra instances.","also":"EC2 Auto Scaling instance refresh with MinHealthyPercentage 75 / MaxHealthyPercentage 100"},{"p":4,"svc":"AWS CloudFormation StackSets with service-managed permissions and automatic deployment, run from the management account or a delegated administrator","why":"Deploys one template to many accounts/Regions and automatically to new accounts in target OUs."}],"traps":["All-at-once deployment — fastest but causes downtime and has no gradual rollback.","Blue/green for the EC2 fleet — meets availability but launches a full second fleet, breaking the 'no extra instances' rule.","Running CloudFormation separately in each account via a script — more custom code and misses future accounts."],"extra":"StackSets service-managed permissions require trusted access with Organizations; self-managed permissions need you to create the admin/execution IAM roles yourself."},{"task":"3.1","n":3,"title":"Automating fleet operations","scenario":"A logistics company manages 500 EC2 instances (Linux and Windows) in private subnets across several accounts.","problems":["Every instance must have the CloudWatch agent installed; any instance found without it should be fixed automatically.","Engineers need shell access to instances without bastion hosts, open SSH ports or SSH keys, with every session logged.","When a critical CloudWatch alarm fires, a trackable operational work item with related resources and suggested runbooks should be created.","Leadership wants proof the application survives losing an Availability Zone, in a controlled experiment that stops if errors climb.","Run a one-off diagnostic command on all instances tagged Env=Prod, 10% at a time."],"constraint":"Least operational overhead using managed services.","hint":"Most answers live inside one service family; one is a chaos-testing service.","answer":[{"p":1,"svc":"AWS Config managed rule ec2-managedinstance-applications-required (checks SSM Inventory for the CloudWatch agent) + automatic remediation with an SSM Automation runbook; a State Manager association (AWS-ConfigureAWSPackage) also works","why":"Config detects drift and triggers a runbook to remediate without manual work."},{"p":2,"svc":"AWS Systems Manager Session Manager with session logging to S3/CloudWatch Logs","why":"Browser/CLI shell over the SSM agent with IAM control; no inbound ports or keys."},{"p":3,"svc":"Systems Manager OpsCenter (OpsItems created from CloudWatch alarms or EventBridge)","why":"Central place to track, investigate and remediate operational issues with linked runbooks."},{"p":4,"svc":"AWS Fault Injection Service (FIS) experiment with CloudWatch alarm stop conditions","why":"Managed chaos experiments (e.g. AZ power interruption scenario, instance stops) that halt automatically if a guardrail alarm fires."},{"p":5,"svc":"Systems Manager Run Command targeting by tag with rate control (concurrency 10%)","why":"Runs commands at scale with concurrency and error thresholds."}],"traps":["Systems Manager Incident Manager or Change Manager — closed to new customers since Nov 7, 2025; OpsCenter is the current answer for ops work items.","Bastion host with SSH — more to patch and manage, open ports, key sprawl.","Manually terminating instances in production as a 'test' — no guardrails or stop conditions."],"extra":"Session Manager needs the SSM agent, an instance profile with AmazonSSMManagedInstanceCore, and VPC interface endpoints (ssm, ssmmessages, ec2messages only for older agents) or NAT for private subnets."},{"task":"3.2","n":1,"title":"Secrets and least privilege","scenario":"A healthcare startup with 15 accounts in AWS Organizations is preparing for a security audit.","problems":["The RDS database password is in a config file and must rotate automatically every 30 days.","Non-secret configuration values (endpoints, feature settings) should be stored centrally at the lowest cost.","Find IAM roles with permissions unused for 90 days and create tighter policies from actual activity.","Find S3 buckets, KMS keys and IAM roles that are shared with anyone outside the organization.","Developers may create IAM roles for their Lambda functions but must never grant more than an approved set of permissions."],"constraint":"Least operational overhead.","hint":"Two stores (one rotates, one is free), one analyzer used two ways, and one guardrail attached to roles.","answer":[{"p":1,"svc":"AWS Secrets Manager with managed rotation (or RDS-managed master user password in Secrets Manager)","why":"Built-in rotation for RDS credentials on a schedule; apps fetch the secret at runtime."},{"p":2,"svc":"Systems Manager Parameter Store standard parameters","why":"No extra charge for standard parameters; hierarchical, versioned, IAM-controlled."},{"p":3,"svc":"IAM Access Analyzer unused access analyzer + policy generation from CloudTrail activity","why":"Flags unused roles, keys and permissions, and generates least-privilege policies from logged activity."},{"p":4,"svc":"IAM Access Analyzer external access analyzer with the organization as the zone of trust, created in the management account or a delegated administrator","why":"Reports resources shared with principals outside the organization across all accounts."},{"p":5,"svc":"IAM permissions boundaries (enforced by requiring the boundary in developers' iam:CreateRole permission)","why":"Caps the maximum permissions any role developers create can have."}],"traps":["Parameter Store SecureString for the DB password — encrypted, but no built-in rotation; you would write and schedule your own.","Secrets Manager for all config values — works but costs per secret per month.","SCP for problem 5 — applies to every principal in the account, not just roles developers create, and does not grant permissions."],"extra":"Access Analyzer unused-access analyzers are a paid feature; external access analyzers are free."},{"task":"3.2","n":2,"title":"Org-wide threat detection","scenario":"A gaming company has 120 accounts in AWS Organizations and adds new accounts every month. It created a dedicated Security Tooling account.","problems":["Detect crypto-mining, compromised credentials and malicious IPs in all accounts, including new ones automatically.","Continuously scan EC2 instances, ECR images and Lambda functions for software vulnerabilities.","Find S3 buckets that contain personal data such as passport numbers.","See all accounts' and Regions' findings in one console, with automated checks against AWS best practice and CIS standards.","Investigators need to visualize what a suspicious IAM role did in the past weeks to find the root cause."],"constraint":"Least operational overhead with automatic coverage for new accounts.","hint":"For each service: which account turns it on, and which account runs it?","answer":[{"p":1,"svc":"Amazon GuardDuty — delegated administrator = Security Tooling account (set from the management account), auto-enable for all member accounts","why":"Managed threat detection from CloudTrail, VPC Flow Logs and DNS logs, with org auto-enrollment."},{"p":2,"svc":"Amazon Inspector — delegated administrator + auto-activate for new accounts","why":"Continuous CVE scanning for EC2, ECR images and Lambda."},{"p":3,"svc":"Amazon Macie — delegated administrator + automated sensitive data discovery","why":"Finds PII in S3 using managed and custom data identifiers."},{"p":4,"svc":"AWS Security Hub CSPM (formerly Security Hub) with central configuration and a home/aggregation Region, delegated admin in the Security Tooling account","why":"Runs the AWS Foundational Security Best Practices and CIS standards and aggregates findings across accounts and Regions; the newer Security Hub adds correlation of GuardDuty, Inspector, Macie and CSPM findings."},{"p":5,"svc":"Amazon Detective","why":"Builds behavior graphs from logs and findings to investigate an identity's activity over time."}],"traps":["Inspector for PII — scans for vulnerabilities, not data content; Macie finds sensitive data.","Enabling each service in every account by hand — misses new accounts and adds ops work; use delegated admin + auto-enable.","Running the security services from the management account — best practice is to delegate administration to a separate security account."],"extra":"Pattern for every org security service: management account designates a delegated administrator → delegated admin enables auto-enable for the organization. Security Hub CSPM controls rely on AWS Config being enabled."},{"task":"3.2","n":3,"title":"Regulated data protection","scenario":"A hospital group is building a compliance baseline across its AWS accounts.","problems":["Medical images in S3 must be impossible to delete or overwrite for 7 years, even by the root user.","RDS, EBS and DynamoDB in every account must be backed up on a central schedule, with copies in a separate, immutable backup account.","All Linux and Windows EC2 instances must be patched monthly in a maintenance window, with compliance reports.","Every API call in every account must be logged to a central bucket that member accounts cannot turn off.","Every internet-facing ALB, including future ones, must have the company's AWS WAF rules."],"constraint":"Least operational overhead.","hint":"Look for the org-wide version of each feature.","answer":[{"p":1,"svc":"S3 Object Lock in compliance mode with a 7-year retention period (versioning enabled)","why":"In compliance mode no user, including root, can delete or shorten the retention."},{"p":2,"svc":"AWS Backup with backup policies in Organizations, cross-account copy to a backup account, and AWS Backup Vault Lock in compliance mode","why":"Centrally managed backup plans, copies isolated in another account, and the vault becomes immutable after the grace period. For DynamoDB, turn on AWS Backup advanced features (needed for cross-account copy); cross-account backup must be enabled in the management account. Also accept: a logically air-gapped vault in the backup account."},{"p":3,"svc":"Systems Manager Patch Manager using Quick Setup patch policies across the organization","why":"Applies patch baselines on a schedule across accounts and Regions with compliance reporting."},{"p":4,"svc":"AWS CloudTrail organization trail (from the management account or a delegated admin) to an S3 bucket in a Log Archive account, with log file integrity validation","why":"Member accounts can see but not change or delete the organization trail."},{"p":5,"svc":"AWS Firewall Manager WAF policy (Firewall Manager administrator account; requires Organizations and AWS Config)","why":"Automatically applies the WAF web ACL to existing and new ALBs in scope."}],"traps":["Object Lock governance mode — users with special permissions can bypass it, so it fails 'even root'.","CloudTrail Lake for central logging — closed to new customers since May 31, 2026; use an organization trail to S3.","Attaching WAF web ACLs per account — misses future ALBs; Firewall Manager enforces it."],"extra":"Add an SCP that denies cloudtrail:StopLogging/DeleteTrail and organizations:LeaveOrganization as an extra guardrail."},{"task":"3.2","n":4,"title":"Outbound DLP: inspect everything leaving the VPCs","scenario":"A company runs all critical EC2 instances in private subnets. NAT gateways (one per AZ) carry all outbound traffic, today only on ports 80 and 443. A new security control says all outbound traffic must be inspected for data loss prevention (DLP), and connections to unauthorized destinations must be rejected.","problems":["Inspect all outbound traffic for DLP, on every port and protocol, with no single point of failure and room to scale.","Reject connections to unauthorized destinations."],"constraint":"Resilient (no single point of failure) and able to scale to all ports and protocols. Before you answer, draw the grid: one row per option, columns Feasible / Resilient / All ports & protocols.","hint":"A NAT gateway only translates addresses: it is passive and cannot inspect anything. Which load balancer type is transparent to every IP packet and fronts a fleet of inspection appliances? Which managed firewall can filter by domain name?","answer":[{"p":1,"svc":"Gateway Load Balancer with an Auto Scaling group of DLP appliances (partner software) in at least two AZs; Gateway Load Balancer endpoints in each VPC; private subnet route 0.0.0.0/0 → GWLB endpoint → NAT gateway → internet gateway","why":"A GWLB works at layer 3 and listens for all IP packets across all ports, so no port or protocol escapes inspection. Health checks and the Auto Scaling group replace failed appliances and add capacity. The endpoints let many VPCs send traffic to one central inspection VPC.","also":"AWS Network Firewall, if the control is mainly about filtering and intrusion prevention rather than content-level DLP (fully managed, no appliances to run)."},{"p":2,"svc":"Deny rules in the inspection layer: the DLP appliances' destination policy, or AWS Network Firewall stateful rules with a domain allow list","why":"Network Firewall filters by domain name (FQDN, TLS SNI, HTTP Host), not just by IP range, and can inspect TLS traffic. Network ACLs only know IP ranges, so they can't express \"approved domains\"."}],"traps":["Keep the NAT gateways and add network ACLs: the NAT gateway never inspects content, so the DLP requirement fails.","DLP software on each instance + network ACLs: works on paper, but it isn't central (easy to bypass or forget), NACLs can't filter by domain, and NACL rule counts are limited.","A single EC2 inspection instance: inspects everything but is a single point of failure, so it fails \"resilient\".","VPC peering to an inspection VPC: peering can't use the other VPC's NAT or internet gateway (no edge-to-edge routing); it only works with a proxy there.","Send everything to on-premises through the virtual private gateway: resilience depends on the VPN/Direct Connect design, and it adds latency and cost."],"extra":"Requirement grid (adapted from the Pearson SAP-C02 course, 2024). Columns: Feasible / Resilient / All ports & protocols. OS DLP + NACLs: yes / yes / partly (no domains, not central). NAT gateway alone: no / yes / no. Single EC2 appliance: yes / no / yes. GWLB + appliance fleet: yes / yes / yes. GWLB endpoint to a central inspection VPC: yes / yes / yes (one place to manage; extra endpoint data charge). Network Firewall: yes / yes / yes (managed; strongest at domain filtering and IPS). VGW to on-premises or VPC peering: depends on details. Note: the course slide says NAT gateway scales to 45 Gbps; AWS docs now say 5 Gbps scaling automatically to 100 Gbps."},{"task":"3.3","n":1,"title":"Global multiplayer game: latency for players worldwide","scenario":"A game studio runs a multiplayer shooter in us-east-1. Telemetry shows players in Europe and Asia complaining. Measured issues:","problems":["Real-time game traffic is UDP; players in Asia see high latency and jitter from internet routing to the Region.","Patch downloads (multi-GB static files from S3) are slow outside North America.","Every request needs a device-type header added and a URL rewrite; logic is a few lines and must add almost no latency.","The leaderboard page runs ranking queries on RDS for MySQL, and its CPU sits above 90% at peak."],"constraint":"Least operational overhead, no re-architecture of the game server.","hint":"Separate by protocol first: which edge service accepts UDP, and which only accepts HTTP(S)?","answer":[{"p":1,"svc":"AWS Global Accelerator","why":"Anycast static IPs bring UDP/TCP traffic onto the AWS backbone at the nearest edge location; CloudFront cannot carry UDP."},{"p":2,"svc":"Amazon CloudFront (S3 origin with Origin Access Control)","why":"Caches large static objects at edge locations near players."},{"p":3,"svc":"CloudFront Functions (viewer request)","why":"Lightweight JavaScript at the edge for header and URL changes, with sub-millisecond start-up and a much lower price per request than Lambda@Edge."},{"p":4,"svc":"Amazon ElastiCache (Redis OSS / Valkey) sorted sets","why":"In-memory sorted sets serve ranking reads and take the load off the MySQL database."}],"traps":["CloudFront for the game traffic: it serves HTTP/HTTPS (and WebSocket) only, not raw UDP.","Lambda@Edge for the header/URL rewrite: it works, but it is slower and costs more than CloudFront Functions for logic this simple.","RDS read replicas for the leaderboard: they spread the load but still run the expensive ranking queries; a sorted set returns the ranking directly."],"extra":"Global Accelerator also gives instant failover between endpoint groups in different Regions without DNS TTL delays."},{"task":"3.3","n":2,"title":"HPC risk simulation does not scale past a few nodes","scenario":"A bank runs a nightly tightly-coupled MPI Monte Carlo risk job on 64 EC2 instances spread over three AZs. Engineers built the cluster by hand. Measured issues:","problems":["Adding nodes past 16 makes the job slower; profiling shows that inter-node network latency is the bottleneck.","Even inside one AZ, MPI message latency is too high because traffic goes through the kernel TCP stack.","Hundreds of nodes read the same 20 TB input set from S3 at the same time, and I/O wait is high.","Building and tearing down the cluster and scheduler each night is manual and error-prone."],"constraint":"Highest performance with least operational overhead.","hint":"One fix for physical proximity, one for the network interface, one for parallel storage, one for cluster automation.","answer":[{"p":1,"svc":"Cluster placement group (single AZ)","why":"Packs the instances close together for low latency and high per-flow throughput between nodes."},{"p":2,"svc":"Elastic Fabric Adapter (EFA) on supported instance types","why":"OS-bypass networking lets MPI/libfabric skip the kernel TCP stack."},{"p":3,"svc":"Amazon FSx for Lustre linked to the S3 bucket","why":"A parallel file system with high aggregate throughput that loads data from S3 lazily."},{"p":4,"svc":"AWS ParallelCluster (Slurm)","why":"Builds the cluster, scheduler, EFA and FSx setup from a config file and scales compute nodes automatically.","also":"AWS Parallel Computing Service (managed Slurm)"}],"traps":["Spread placement group: it puts instances on separate hardware for availability, which works against low latency.","Enhanced networking (ENA) alone: it raises bandwidth but does not bypass the OS, which tightly-coupled MPI needs.","Amazon EFS for scratch data: it is general-purpose shared storage and not built for the parallel throughput HPC needs."],"extra":"Cluster placement groups are single-AZ by design, so the job trades AZ resilience for performance. That is acceptable for a rerunnable batch job."},{"task":"3.3","n":3,"title":"E-commerce checkout: SLOs, right-sizing, read scaling","scenario":"A retailer's checkout runs on Java services on an EC2 Auto Scaling group with an Aurora MySQL backend. The business KPI is 'p99 checkout latency under 400 ms'. Measured issues:","problems":["There is no way to track the KPI as an SLO per service and operation, and no attainment or burn-rate alarms.","Instances have been m5.4xlarge since launch; CPU averages 12%, but nobody knows the memory use.","Traffic climbs every weekday at 08:30, and the Auto Scaling group reacts too late.","Read-only catalog queries saturate the Aurora writer."],"constraint":"Least application code change.","hint":"KPI→SLO tooling, a right-sizing service that needs one more metric, scaling ahead of a known pattern, and an Aurora feature for reads.","answer":[{"p":1,"svc":"CloudWatch Application Signals (auto-instrumentation + SLOs)","why":"Collects latency for each service and operation without code changes and tracks SLO attainment with alarms."},{"p":2,"svc":"AWS Compute Optimizer + CloudWatch agent memory metrics","why":"Compute Optimizer makes right-sizing and Graviton recommendations, and it needs the agent for memory data."},{"p":3,"svc":"EC2 Auto Scaling predictive scaling (or scheduled actions)","why":"Forecasts the daily pattern and launches capacity before the ramp."},{"p":4,"svc":"Aurora Replicas + Aurora Auto Scaling, reader endpoint","why":"Moves reads to replicas that scale with load, and the only app change is the read connection string."}],"traps":["Scaling the Aurora writer to a bigger instance class: this is vertical scaling of the wrong node, and it costs more than offloading reads.","Target-tracking alone for the 08:30 ramp: it is reactive, so it lags the known spike.","Right-sizing from CPU only: without memory metrics, a downsize can cause swapping."],"extra":"Test the remediation before production, for example with CloudWatch Synthetics canaries or a load test, and compare against the SLO."},{"task":"3.4","n":1,"title":"SaaS app: remove single points of failure","scenario":"A HR SaaS company had three outages this quarter. The post-incident review lists:","problems":["The database is a Single-AZ RDS for PostgreSQL instance and was down for 40 minutes during an AZ event.","The web tier is two hand-built EC2 instances in the same AZ that are restarted by hand.","During a slowdown at the third-party payroll API, synchronous calls timed out and payroll submissions were lost.","The on-premises connection is a single Site-to-Site VPN that terminates on one customer gateway device, and a firmware reboot cut it off."],"constraint":"Least operational overhead.","hint":"One AZ-level database fix, one self-healing compute fix, one durability buffer, one network edge redundancy.","answer":[{"p":1,"svc":"RDS Multi-AZ deployment (instance or Multi-AZ DB cluster)","why":"Synchronous standby with automatic failover behind the same endpoint."},{"p":2,"svc":"EC2 Auto Scaling group across multiple AZs behind an Application Load Balancer","why":"Replaces unhealthy instances automatically and spreads capacity across AZs."},{"p":3,"svc":"Amazon SQS queue (with dead-letter queue) between the app and the payroll caller","why":"Submissions are stored durably and retried when the API recovers instead of being lost."},{"p":4,"svc":"Second customer gateway device with its own Site-to-Site VPN connection (BGP dynamic routing)","why":"Each connection already has two tunnels, but both end on one device; a second device removes that single point of failure."}],"traps":["A read replica for database HA: replication is asynchronous and promotion is manual, so this is a DR tool, not HA.","Relying on EC2 automatic recovery: it is on by default for supported types, but it only moves the instance to new hardware in the same AZ, so it doesn't help in an AZ event and doesn't replace an Auto Scaling group.","Using both tunnels of the existing VPN: that is already the default, and it does not cover the device failure."],"extra":"For more on-premises resilience, use Direct Connect as primary with VPN as backup, or two Direct Connect connections at different locations."},{"task":"3.4","n":2,"title":"Insurer multi-Region DR with seconds-level RPO","scenario":"An insurer runs its claims platform in eu-west-1. The regulator now requires recovery to eu-central-1 with an RPO of seconds and an RTO of minutes. Current gaps:","problems":["Aurora PostgreSQL has nightly snapshots copied cross-Region (RPO ~24 h).","A DynamoDB session/state table must accept writes in both Regions after failover without manual promotion.","Claim documents in S3 must reach the second Region under an SLA-backed replication time.","Traffic failover depends on engineers editing DNS records in the console during an incident."],"constraint":"Meet RPO/RTO with least operational overhead.","hint":"Each data store has its own managed cross-Region feature, and failover control should not depend on a control plane during the event.","answer":[{"p":1,"svc":"Aurora Global Database","why":"Storage-level replication with typically sub-second lag and managed cross-Region failover/switchover."},{"p":2,"svc":"DynamoDB global tables","why":"Multi-active replicas that accept writes in every Region."},{"p":3,"svc":"S3 Cross-Region Replication with S3 Replication Time Control","why":"RTC is designed to replicate 99.99% of objects within 15 minutes, backed by an SLA (99.9%), plus replication metrics and events."},{"p":4,"svc":"Route 53 ARC routing controls (also accept: ARC Region switch plan)","why":"Highly available data-plane switches flip traffic between Regions without console or DNS editing."}],"traps":["AWS Backup cross-Region copy: backups are periodic, so the RPO is hours, not seconds.","ARC readiness checks: closed to new customers; use routing controls, or an ARC Region switch plan, which also checks that failover is ready.","Route 53 failover records edited in the console: editing records uses the Route 53 control plane, which you should not depend on during a Regional event."],"extra":"S3 RTC needs versioning on both buckets; existing objects need S3 Batch Replication."},{"task":"3.4","n":3,"title":"Media group: DR for on-prem servers and org-wide resilience","scenario":"A media group with 40 AWS accounts in AWS Organizations also runs 60 on-premises VMware VMs. An audit found:","problems":["The on-premises VMs need DR into AWS with an RPO of seconds and an RTO of minutes, and low cost while idle.","There is no central place to define RTO/RPO targets per application and check whether the AWS architectures meet them.","EBS, RDS and EFS backups run as custom scripts per account, with no cross-Region copies.","Newly vended accounts start with default quotas, and teams hit limits in their first week."],"constraint":"Least operational overhead; use organization-wide controls where possible.","hint":"A block-level replication service, an assessment service, a policy-driven backup service, and an automatic quota request feature for new accounts.","answer":[{"p":1,"svc":"AWS Elastic Disaster Recovery (DRS)","why":"Continuous block-level replication to a low-cost staging area, with full recovery instances launched only on failover or drill."},{"p":2,"svc":"AWS Resilience Hub","why":"Define resiliency policies (RTO/RPO), assess apps against them, and get recommendations."},{"p":3,"svc":"AWS Backup with Organizations backup policies (trusted access, cross-account management, cross-Region copy rules)","why":"Backup plans are pushed to every account from the management account, with cross-Region copies."},{"p":4,"svc":"Service Quotas quota request template (Organizations integration)","why":"Automatically requests the listed quota increases whenever a new account is created in the organization."}],"traps":["AWS Application Migration Service (MGN) for DR: it uses similar replication but is built for one-time migration cutover, not ongoing DR.","Trusted Advisor service limits check: it reports usage approaching limits after the fact, but it does not raise quotas for new accounts.","Per-account AWS Backup plans: they work, but they repeat the per-account sprawl that org-level backup policies remove."],"extra":"Org-wide setup steps: enable trusted access for AWS Backup and Service Quotas in the management account, and turn on Backup cross-account management before you attach backup policies."},{"task":"3.5","n":1,"title":"Pick the right commitment and purchase models","scenario":"A logistics company spends heavily on compute and databases across 12 accounts. Cost Explorer shows:","problems":["Steady 24/7 EC2 baseline that is moving from m5 to Graviton next quarter and expanding to a second Region; Fargate and Lambda also have a steady floor.","A steady baseline on Aurora and DynamoDB, with a planned move of some Aurora clusters to a different engine.","A 4-hour nightly route-optimization batch on On-Demand EC2 that is fault tolerant and checkpoints.","Dev/test Auto Scaling groups run 24/7 but are used only on weekdays from 08:00 to 18:00."],"constraint":"Most cost-effective while keeping flexibility.","hint":"Choose the commitment that survives family and Region changes, a separate commitment for databases, an interruptible model, and a time-based scaling feature.","answer":[{"p":1,"svc":"Compute Savings Plans","why":"Applies across instance family, size, Region, OS, Fargate and Lambda (up to 66%)."},{"p":2,"svc":"Database Savings Plans","why":"One commitment covers Aurora, RDS and DynamoDB (among others) across engines and families (1-year, no upfront, up to 35%)."},{"p":3,"svc":"Spot Instances via an Auto Scaling group mixed instances policy (price-capacity-optimized, diversified types)","why":"Interruptible, checkpointed batch work gets the largest discount."},{"p":4,"svc":"EC2 Auto Scaling scheduled actions (scale to 0 off-hours)","why":"Weekdays 08:00–18:00 is 50 of 168 hours, so about 70% of the weekly instance-hours go away with no code changes."}],"traps":["EC2 Instance Savings Plans: the larger discount (up to 72%) is locked to one family in one Region, so the Graviton move and new Region break it.","Aurora/RDS Reserved Instances: tied to one engine (size-flexible only within a family), so the engine move strands them.","Spot for the steady baseline: interruptions make it unsuitable for always-on work."],"extra":"Buy commitments in the management or payer account; RI/SP discount sharing across the organization is on by default."},{"task":"3.5","n":2,"title":"Cost visibility and alerting across an organization","scenario":"A university IT group manages 60 accounts in AWS Organizations, including shared accounts used by several faculties. Finance raised these issues:","problems":["Shared-account costs cannot be split by faculty; tag keys are inconsistent (CostCenter, costcenter, cost-center).","Finance wants reports grouped by 'Faculty' using rules that combine accounts and tags.","A forgotten GPU instance in a research account ran for 10 days before anyone noticed the spike.","Auditors need hourly resource-level line items they can query with SQL.","Each faculty needs a monthly spend limit that alerts and automatically stops further spending when exceeded."],"constraint":"Least operational overhead.","hint":"Standardize, then activate; group; detect unusual spend; export raw data; set thresholds with actions.","answer":[{"p":1,"svc":"Organizations tag policies + Tag Editor bulk retag + activate cost allocation tags in the management account","why":"Enforce one tag key and casing, fix existing resources, then activate the tag so it appears in billing data."},{"p":2,"svc":"AWS Cost Categories","why":"Rule-based groupings over accounts, tags and services that appear in Cost Explorer, Budgets and CUR."},{"p":3,"svc":"AWS Cost Anomaly Detection (monitors + SNS/email subscriptions)","why":"ML-based detection flags unusual spend patterns without fixed thresholds."},{"p":4,"svc":"CUR 2.0 via AWS Data Exports to S3, queried with Amazon Athena","why":"Hourly, resource-ID-level line items for SQL analysis."},{"p":5,"svc":"AWS Budgets with budget actions","why":"Alerts at a threshold and can apply an IAM policy or SCP, or stop EC2/RDS instances."}],"traps":["A CloudWatch billing alarm: static thresholds on EstimatedCharges (us-east-1, per service at most), so it catches a spike only if you guessed the threshold and doesn't learn normal spend patterns.","Cost Explorer for the audit data: it shows aggregated views, not raw hourly line items for SQL.","Activating tags in each member account: user-defined cost allocation tags are activated in the management (payer) account."],"extra":"Cost allocation tags apply only from activation onward, so plan for a lag before they show in reports."},{"task":"3.5","n":3,"title":"Find waste: network, storage and idle resources","scenario":"An analytics firm with 25 accounts in AWS Organizations has an AWS bill that grows every month. The FinOps team found:","problems":["NAT gateway data-processing charges are high; flow logs show that most of the traffic goes to S3 and DynamoDB in the same Region.","Hundreds of gp2 volumes are provisioned large only for the IOPS.","A log bucket keeps 7 years of data that is never read after 90 days; there are also large orphaned multipart uploads.","Unattached EBS volumes keep reappearing in every account."],"constraint":"Most cost-effective, no application changes.","hint":"A free endpoint type, a volume type with performance independent of size, a rule-based S3 feature, and an org-wide compliance check.","answer":[{"p":1,"svc":"Gateway VPC endpoints for S3 and DynamoDB","why":"Route-table targets that keep this traffic off the NAT gateway, with no hourly or per-GB charge."},{"p":2,"svc":"Migrate gp2 → gp3 with Elastic Volumes (shrink oversized volumes separately)","why":"gp3 gives a 3,000 IOPS / 125 MiB/s baseline regardless of size at a lower per-GB price, and the type change happens online. Elastic Volumes cannot shrink a volume, so oversized ones need a new smaller volume and a data copy."},{"p":3,"svc":"S3 Lifecycle: transition to S3 Glacier Deep Archive after 90 days, expire at 7 years, abort incomplete multipart uploads","why":"For a known access pattern, rule-based tiering is cheapest."},{"p":4,"svc":"AWS Config managed rule ec2-volume-inuse-check deployed as an organization rule or conformance pack (optional auto-remediation)","why":"Flags unattached volumes in every account continuously."}],"traps":["Interface endpoints for S3: they work, but they cost per hour and per GB, while the gateway endpoint is free.","S3 Intelligent-Tiering for the log bucket: the access pattern is known, and it adds a per-object monitoring fee.","Trusted Advisor for idle volumes: the full cost-optimization checks require Business Support+ or Enterprise, and they detect but do not enforce."],"extra":"For other AWS services reached through NAT (for example ECR or CloudWatch Logs), interface endpoints can still be cheaper than NAT at high volume."},{"task":"4.1","n":1,"title":"Seven Rs per app before a lease ends","scenario":"An insurance company's data center lease ends in 9 months. The cloud team is small and is already busy. Leadership wants every application decision recorded with one migration strategy each.","problems":["A Java/Tomcat claims portal on 12 VMs. Nobody has time to change the code.","An Oracle claims database. The DBA team wants AWS to handle backups, patching and Multi-AZ failover, but the app must keep using Oracle.","An on-prem HR system. The company has already signed a contract for a SaaS HR product.","A fax server that logs show was used twice last year.","A mainframe actuarial batch system under regulator review. It cannot move this year."],"constraint":"fastest migration","hint":"Name the R for each app, and the AWS service for each R that actually moves something.","answer":[{"p":1,"svc":"Rehost: AWS Application Migration Service (MGN)","why":"Lift-and-shift block-level replication is the fastest move and needs no code changes."},{"p":2,"svc":"Replatform: Amazon RDS for Oracle (Multi-AZ)","why":"Same engine with managed backups, patching and failover. Only the endpoint changes."},{"p":3,"svc":"Repurchase: move to the SaaS HR product","why":"Drop the self-hosted app for the product already bought. Nothing to migrate on AWS except the data export."},{"p":4,"svc":"Retire: decommission the fax server","why":"Unused assets are switched off, which cuts migration scope and cost."},{"p":5,"svc":"Retain: keep the mainframe on-prem for now","why":"A regulatory hold means you revisit it later (AWS Transform for mainframe when it is ready)."}],"traps":["Refactoring the claims portal to Lambda or containers: modernizing is far slower than rehosting and misses the 9-month deadline.","Relocate for the portal: Relocate means moving a whole VMware hypervisor stack (for example Amazon EVS or VMware Cloud on AWS), not individual VMs.","Rehosting Oracle onto EC2: it works, but the DBAs explicitly want managed backups, patching and failover, so RDS is the answer."],"extra":"The 7 Rs are Retire, Retain, Rehost, Relocate, Repurchase, Replatform and Refactor. The managed runtime of AWS Mainframe Modernization is closed to new customers; AWS points new mainframe work to AWS Transform for mainframe."},{"task":"4.1","n":2,"title":"Discovery, dependencies and the business case","scenario":"A logistics company runs 800 VMware VMs and has no CMDB. The CFO wants a cost case for AWS within 6 weeks. The security team will not allow agents to be installed inside guest OSs.","problems":["Collect inventory, CPU/RAM utilization and server-to-server network connections without installing agents in the guests.","Produce a TCO/business case with right-sized targets instead of a 1:1 copy of current VM sizes.","Group VMs that talk to each other so they move in the same migration wave.","Give a quick cost estimate for a new analytics platform that does not exist on-prem yet."],"constraint":"least operational overhead","hint":"One tool collects, another does the assessment and wave work, and the last item has nothing to discover.","answer":[{"p":1,"svc":"AWS Transform discovery tool (agentless appliance using vCenter plus SSH/WinRM)","why":"Collects inventory, performance data and network connections without in-guest agents, and exports to the MPA format."},{"p":2,"svc":"AWS Transform assessment (business case/TCO); Migration Evaluator is the older answer that still exists","why":"Builds right-sized, utilization-based TCO and business cases from the discovered data."},{"p":3,"svc":"AWS Transform for VMware wave planning using the network dependency data","why":"Builds move groups and waves from the observed dependencies so chatty servers move together."},{"p":4,"svc":"AWS Pricing Calculator","why":"A greenfield workload has no utilization data, so you model it directly from expected sizes."}],"traps":["Application Discovery Service and Migration Hub: classic exam answers (Agentless Collector or Discovery Agent plus Migration Hub grouping), but both have been closed to new customers since Nov 7, 2025.","AWS Compute Optimizer or Trusted Advisor for right-sizing: they only analyze resources already running in AWS.","The ADS Discovery Agent for dependencies: it needs an agent inside the guest, which security has forbidden."],"extra":"On an older exam, the expected answers are ADS Agentless Collector for VMware inventory, Discovery Agent for process and network data, Migration Hub for tracking, and Migration Evaluator for TCO. Tag migrated resources with map-migrated for MAP credits."},{"task":"4.1","n":3,"title":"Licensing decides the target","scenario":"A pharma company is planning its Windows and database estate. Licenses are a large share of the cost, and auditors require proof of license compliance.","problems":["Windows Server licenses bought in 2018 without Software Assurance or License Mobility must be reused (BYOL).","SQL Server Enterprise licenses with active Software Assurance should be reused on EC2.","Stop teams from launching more licensed cores than the company owns, and report usage to auditors.","An Oracle Database EE workload is licensed per core and needs lots of RAM but few cores."],"constraint":"most cost-effective","hint":"Each license type has its own tenancy rule, and one problem is an instance launch option.","answer":[{"p":1,"svc":"Amazon EC2 Dedicated Hosts (with License Manager host resource groups)","why":"Windows Server BYOL (eligible pre-Oct 2019 licenses without License Mobility) requires dedicated physical hosts with visible sockets and cores."},{"p":2,"svc":"EC2 default (shared) tenancy using License Mobility through Software Assurance","why":"SA-backed SQL Server can run on shared tenancy, which avoids the cost of Dedicated Hosts."},{"p":3,"svc":"AWS License Manager license configurations with hard limits","why":"Enforces core/vCPU limits at launch and keeps usage reports for audit."},{"p":4,"svc":"EC2 Optimize CPUs (fewer cores and threads per core = 1) on a memory-optimized instance","why":"Cuts licensable vCPUs while keeping the instance's RAM."}],"traps":["Amazon RDS for SQL Server with BYOL: standard RDS for SQL Server is License Included only, so the existing SQL licenses cannot be reused there.","Dedicated Instances for Windows BYOL: they isolate hardware but do not expose sockets and cores, so they do not satisfy the BYOL licensing rule.","A Windows License Included AMI for everything: it is simple, but you pay twice for licenses you already own."],"extra":"Windows Server BYOL is allowed only on Dedicated Hosts and only for licenses bought before Oct 1, 2019 (or EA true-ups effective before then), up to Windows Server 2019; later licenses use License Included. RDS for Oracle offers both BYOL and License Included (SE2)."},{"task":"4.2","n":1,"title":"Moving a media archive","scenario":"A media company is moving file workloads to AWS. It has a 10 Gbps Direct Connect link with about 5 Gbps free, and it is a new AWS customer.","problems":["Copy 400 TB of video archive from an on-prem NFS NAS into Amazon S3 within 3 weeks, with checksum verification.","Partner studios upload deliveries to S3 using their existing SFTP clients and SSH keys.","An on-prem editing app keeps writing over NFS, but the files must land in S3 with recent files cached locally.","Freelancers around the world upload 50 GB files straight into an S3 bucket over the internet and complain it is slow."],"constraint":"least operational overhead","hint":"Do the bandwidth maths first, then pick one transfer tool per access pattern.","answer":[{"p":1,"svc":"AWS DataSync (agent on-prem, over Direct Connect, bandwidth limit set)","why":"5 Gbps is about 54 TB/day, so 400 TB takes about 8 days, well within 3 weeks, with built-in integrity checks."},{"p":2,"svc":"AWS Transfer Family (SFTP endpoint, S3 backend, service-managed users with SSH keys)","why":"A managed SFTP server writing to S3, so partners do not have to change anything."},{"p":3,"svc":"AWS Storage Gateway: S3 File Gateway","why":"Presents NFS on-prem, caches hot data locally, and stores the objects in S3."},{"p":4,"svc":"Amazon S3 Transfer Acceleration (with multipart upload)","why":"Routes long-distance uploads through CloudFront edge locations onto the AWS backbone."}],"traps":["Snowball Edge: closed to new customers, and the network is fast enough anyway. AWS now points to DataSync, Data Transfer Terminal or partner devices.","Running aws s3 sync from a server: no scheduling, integrity verification or throttling, and more ops work than DataSync.","FSx File Gateway for the editing app: it is closed to new customers, and the target here is S3, not FSx."],"extra":"Rule of thumb: 1 Gbps is about 10.8 TB/day. DataSync can also copy NAS data to EFS or FSx. Transfer Family supports SFTP, FTPS, FTP, AS2 and web apps."},{"task":"4.2","n":2,"title":"Database cutover with almost no downtime","scenario":"A fintech company is moving two databases to AWS. The trading window allows only 10 minutes of downtime.","problems":["Convert an 8 TB on-prem Oracle schema, including PL/SQL packages, to Aurora PostgreSQL.","Move the Oracle data and keep it in sync until cutover.","Prove that the source and target rows match before cutover.","Move a 2 TB SQL Server database to Amazon RDS for SQL Server (same engine) using a native .bak backup as the seed."],"constraint":"lowest downtime","hint":"Heterogeneous migrations need two tools, and native restore needs one setup step on RDS.","answer":[{"p":1,"svc":"AWS SCT or DMS Schema Conversion","why":"Converts schema and code objects. Whatever cannot be converted shows up in the assessment report for manual fixes."},{"p":2,"svc":"AWS DMS full load + CDC (enable Oracle supplemental logging and ARCHIVELOG first)","why":"Ongoing replication keeps the target current, so cutover is just a short switch. CDC fails without supplemental logging."},{"p":3,"svc":"DMS data validation","why":"Compares source and target row by row during and after replication."},{"p":4,"svc":"RDS native backup/restore from S3 (option group with SQLSERVER_BACKUP_RESTORE and an IAM role), then DMS CDC to catch up","why":"Restoring a .bak is the fastest seed for a homogeneous move, and CDC closes the gap until cutover. Also accept: native full + differential/log restores WITH NORECOVERY, finishing at cutover."}],"traps":["DMS alone for Oracle to PostgreSQL: DMS moves data, but it does not convert stored procedures and packages.","Using pg_dump or export/import with a long outage: it breaks the 10-minute window.","Restoring a .bak on RDS without the option group: the restore fails, which is a classic missed setup step."],"extra":"DMS Schema Conversion is the managed, console-based version of SCT. Run DMS replication instances in private subnets and use TLS to the endpoints."},{"task":"4.2","n":3,"title":"Rehosting a factory's server fleet","scenario":"A manufacturer is rehosting 150 Windows and Linux VMs from its data center. It has a Direct Connect link and an on-prem Active Directory. New AWS accounts are being created for each plant.","problems":["Replicate and cut over the servers with minutes of downtime and rehearse with test launches.","Replication traffic must not cross the public internet.","Engineers must sign in to all AWS accounts with their existing AD credentials.","Every new plant account must automatically get guardrails, for example blocking anyone from disabling CloudTrail.","Point users to the migrated web servers with a fast rollback option."],"constraint":"minimal downtime","hint":"Think about the replication path and the identity source, not only the migration tool.","answer":[{"p":1,"svc":"AWS Application Migration Service (MGN) with replication agent, replication settings template, test then cutover launches","why":"Continuous block-level replication means cutover only takes the final sync."},{"p":2,"svc":"MGN 'use private IP' over Direct Connect plus interface VPC endpoints for MGN/S3 (open TCP 1500 to replication servers)","why":"Keeps replication on the private path, and the endpoints carry the control-plane calls."},{"p":3,"svc":"IAM Identity Center with AD as identity source via AD Connector (or AWS Managed Microsoft AD trust)","why":"Gives single sign-on across all Organizations accounts using the existing AD users and groups."},{"p":4,"svc":"AWS Control Tower (Account Factory + preventive controls/SCPs in AWS Organizations)","why":"New accounts are created with the guardrails already applied."},{"p":5,"svc":"Amazon Route 53 records with a low TTL (or weighted records)","why":"DNS cutover takes effect quickly, and you can roll back by switching the record back."}],"traps":["CloudEndure Migration or SMS: both are retired, and MGN replaced them.","Site-to-Site VPN for 'no internet': VPN traffic is encrypted, but it still crosses the internet. Direct Connect with private IP replication is the answer here.","Creating IAM users in each account: no SSO, and lots of ops work across many accounts."],"extra":"MGN needs TCP 443 to the MGN endpoint and TCP 1500 to the replication servers in the staging subnet. Lower the DNS TTL days before cutover."},{"task":"4.3","n":1,"title":"Picking the container platform","scenario":"A SaaS company is moving containerized workloads off VMs. Teams differ in skills, and the CTO wants as little infrastructure to look after as possible.","problems":["Twenty stateless microservices from a team with no Kubernetes experience. Nobody wants to patch hosts.","A platform team that deploys with Helm and kubectl and must keep the Kubernetes API.","A small internal web app from a single container image. It needs an HTTPS URL, load balancing and auto scaling with almost no configuration.","A private image registry that scans images for CVEs.","Containers in a factory that must stay on-prem but be managed from the same AWS control plane as problem 1."],"constraint":"least operational overhead","hint":"One of these used to be answered with a service that no longer accepts new customers.","answer":[{"p":1,"svc":"Amazon ECS on AWS Fargate","why":"No cluster nodes and no Kubernetes to learn. Fargate runs the tasks serverlessly."},{"p":2,"svc":"Amazon EKS (EKS Auto Mode or Fargate profiles)","why":"Keeps the Kubernetes API, Helm and kubectl, while AWS manages the control plane and, with Auto Mode, the nodes."},{"p":3,"svc":"Amazon ECS Express Mode","why":"Creates the Fargate service, ALB, HTTPS endpoint and scaling from just an image."},{"p":4,"svc":"Amazon ECR with enhanced scanning (Amazon Inspector)","why":"A private registry with continuous OS and language-package vulnerability scanning."},{"p":5,"svc":"Amazon ECS Anywhere","why":"Registers on-prem servers as external instances in the same ECS cluster control plane."}],"traps":["AWS App Runner for the small app: closed to new customers since Apr 30, 2026, and ECS Express Mode is the replacement.","EKS for the team with no Kubernetes skills: it adds Kubernetes complexity they do not need.","Running ECS on EC2 'to save cost': it adds AMI patching and capacity management, which the constraint rules out."],"extra":"Older exams may still answer App Runner for 'simplest container web app'. EKS Anywhere is the on-prem answer when Kubernetes is required. EKS Hybrid Nodes run on-prem nodes under a cloud EKS control plane."},{"task":"4.3","n":2,"title":"File and HPC storage replatform","scenario":"An engineering firm is replatforming storage. The applications should not need code changes.","problems":["Windows file shares with NTFS ACLs, DFS namespaces and AD-joined users.","A nightly HPC simulation needs a high-throughput POSIX scratch file system that reads its inputs from S3 and writes results back to S3.","A Linux web fleet across 3 AZs that auto scales and needs shared POSIX storage that grows on its own.","An on-prem NetApp array that serves NFS and SMB on the same volumes and uses SnapMirror."],"constraint":"minimal changes","hint":"Each protocol and feature list points to one specific file service.","answer":[{"p":1,"svc":"Amazon FSx for Windows File Server (joined to AWS Managed Microsoft AD or self-managed AD)","why":"Native SMB with NTFS ACLs, DFS and AD integration, so it is a drop-in replacement."},{"p":2,"svc":"Amazon FSx for Lustre with an S3 data repository association (scratch deployment)","why":"Sub-millisecond, very high-throughput parallel file system that lazy-loads from S3 and exports back to it."},{"p":3,"svc":"Amazon EFS (Regional, elastic throughput)","why":"A multi-AZ NFS file system shared by an auto scaling fleet, with no capacity to provision."},{"p":4,"svc":"Amazon FSx for NetApp ONTAP","why":"Multiprotocol NFS/SMB with SnapMirror replication from the on-prem NetApp, so procedures stay the same."}],"traps":["EFS for the Windows shares: EFS is NFS only, so it does not support SMB or NTFS ACLs.","S3 directly for HPC scratch: it is not a POSIX file system, so the app would need changes.","FSx File Gateway for branch caching of FSx for Windows: closed to new customers."],"extra":"The FSx for Windows AD join needs DNS and the domain ports (53, 88, 389, 445 and so on) open between the FSx security group and the domain controllers. FSx for OpenZFS fits for NFS migrations from ZFS or Linux file servers."},{"task":"4.3","n":3,"title":"Managed targets for a travel app","scenario":"A travel booking company is replatforming a Java web app and its data stores during a data center exit. It wants managed services without rewriting the app.","problems":["A WAR file running on Tomcat VMs. Developers just want to upload new versions and get load balancing and scaling.","A MySQL 8.0 database that needs up to 15 low-lag read replicas and failover in under 60 seconds.","An Oracle database with a third-party monitoring agent that needs OS-level access.","A self-managed Elasticsearch cluster used for hotel search.","A shopping-cart key-value store with unpredictable traffic spikes."],"constraint":"least operational overhead","hint":"One database needs the OS, one doesn't need relational at all.","answer":[{"p":1,"svc":"AWS Elastic Beanstalk (Tomcat platform)","why":"Upload the WAR, and Beanstalk provisions EC2, the ALB and auto scaling, with managed platform updates."},{"p":2,"svc":"Amazon Aurora MySQL","why":"Up to 15 replicas share the same storage with low lag, and failover is fast."},{"p":3,"svc":"Amazon RDS Custom for Oracle","why":"A managed database that still gives OS and SSH access for the agent."},{"p":4,"svc":"Amazon OpenSearch Service","why":"Managed search compatible with Elasticsearch APIs up to 7.10."},{"p":5,"svc":"Amazon DynamoDB (on-demand capacity)","why":"Key-value access with no capacity planning, and it scales instantly with spikes."}],"traps":["Standard RDS for Oracle: no OS access, so the agent cannot be installed.","RDS MySQL read replicas: up to 15 are possible now, but they use asynchronous binlog replication with more lag, and Multi-AZ failover is slower than Aurora's.","Oracle on EC2: it works, but you manage everything yourself, which is the opposite of least ops."],"extra":"RDS Custom exists only for Oracle and SQL Server. For Elasticsearch 7.10, the migration is a snapshot to S3 and a restore into OpenSearch Service."},{"task":"4.4","n":1,"title":"Decoupling a ticketing monolith","scenario":"A concert ticketing company's monolith falls over during on-sales. It wants to decouple components with managed integration services.","problems":["Orders burst to 20x normal. Payment must process each customer's orders in sequence, without duplicates.","An 'order placed' message must reach email, analytics and loyalty, each with its own durable buffer and retries.","A refund process has several steps, retries and a manager approval that can take up to 5 days.","Clickstream at 50,000 events/s must be read by 3 consumers, and each must be able to replay the last 24 hours."],"constraint":"least operational overhead","hint":"Ordering, fan-out, long waits and replay each point to a different service.","answer":[{"p":1,"svc":"Amazon SQS FIFO queue (MessageGroupId = customer ID, deduplication on)","why":"Buffers the burst, keeps order per customer, and removes duplicates."},{"p":2,"svc":"Amazon SNS topic fanned out to an SQS queue per consumer","why":"Each subscriber gets its own durable queue, so a slow consumer does not affect the others."},{"p":3,"svc":"AWS Step Functions Standard workflow with a .waitForTaskToken callback","why":"Standard workflows can wait up to a year for the approval, with retries built in."},{"p":4,"svc":"Amazon Kinesis Data Streams (24 h+ retention, enhanced fan-out)","why":"Several independent consumers can each replay from the retained ordered stream."}],"traps":["SQS Standard for payment: ordering is best-effort and delivery is at-least-once, so it can process duplicates.","Step Functions Express for the refunds: Express workflows are capped at 5 minutes.","SQS for the clickstream: once a message is consumed and deleted, it cannot be replayed by other consumers."],"extra":"EventBridge is a better choice than SNS when routing needs content-based rules, SaaS sources, schema registry or archive/replay. High-throughput FIFO supports up to 70,000 TPS per API action (700,000 msg/s with batching) in us-east-1, us-west-2 and eu-west-1; other Regions are lower."},{"task":"4.4","n":2,"title":"Strangler fig on a .NET monolith","scenario":"An insurer runs a .NET Framework 4.8 monolith on IIS behind a load balancer. It wants to break it up gradually, without a big-bang rewrite and without changing the URLs clients use.","problems":["Send /quotes/* to a new service while every other path keeps going to the monolith.","Port the remaining .NET Framework code to cross-platform .NET so it can run on Linux.","The new quotes service has spiky traffic and should run without any servers.","The new service must be told when a policy changes in the monolith, without the monolith calling the service directly."],"constraint":"minimal changes","hint":"You need a facade in front of the monolith. One classic answer from the exam has been closed.","answer":[{"p":1,"svc":"Application Load Balancer path-based listener rules as the strangler facade (Amazon API Gateway also fits)","why":"The URL stays the same, and traffic shifts route by route from the monolith to new services."},{"p":2,"svc":"AWS Transform for .NET","why":"Automates the analysis and porting of .NET Framework code to cross-platform .NET."},{"p":3,"svc":"AWS Lambda (as an ALB target group or behind API Gateway)","why":"Scales with spikes and costs nothing when idle, with no servers to manage."},{"p":4,"svc":"Amazon EventBridge custom event bus (monolith emits PolicyUpdated events, and a rule targets the service)","why":"Loose, asynchronous coupling, so the monolith does not need to know who consumes its events."}],"traps":["Migration Hub Refactor Spaces as the strangler-fig tool: closed to new customers since Nov 7, 2025, and AWS Transform is the successor.","Porting Assistant for .NET: closed and replaced by AWS Transform for .NET.","A full rewrite to microservices first: it is the big-bang approach the company wants to avoid."],"extra":"Strangler fig means putting a proxy in front, carving out one capability at a time, and retiring the legacy route. Older exam answers use Refactor Spaces and Porting Assistant."},{"task":"4.4","n":3,"title":"Purpose-built data for a mobile game","scenario":"A mobile game studio is modernizing a backend that keeps everything in one large self-managed relational database. Traffic peaks in the evenings and drops close to zero at night.","problems":["Player profiles fetched by player ID at millions of requests/s with single-digit-ms latency.","A real-time global leaderboard that returns the top 100 scores sorted.","A relational billing database that is idle most of the night but spikes unpredictably.","Player avatar images must be resized automatically as soon as they are uploaded."],"constraint":"most cost-effective","hint":"Match each access pattern to a purpose-built store, and note one event-driven trigger.","answer":[{"p":1,"svc":"Amazon DynamoDB (on-demand; add DAX if microsecond reads are needed)","why":"Key-value lookups at any scale with consistent single-digit-ms latency."},{"p":2,"svc":"Amazon ElastiCache (Valkey or Redis OSS) sorted sets","why":"ZADD and ZREVRANGE give real-time ranked leaderboards in memory."},{"p":3,"svc":"Amazon Aurora Serverless v2 (min 0 ACU with auto-pause)","why":"Scales capacity with load and can pause when idle, so you don't pay for quiet nights."},{"p":4,"svc":"Amazon S3 event notification to AWS Lambda","why":"Each upload triggers a resize with no servers sitting idle."}],"traps":["Aurora Serverless v1: end of life since March 2025, so use v2.","Running the leaderboard with ORDER BY in the relational database: it is slow and expensive at scale. Sorted sets are the purpose-built fit.","Polling S3 from an EC2 cron job: you pay for idle compute and get lag. Event notifications are cheaper and instant."],"extra":"ElastiCache Serverless removes cache node sizing. Valkey is the lower-cost, Redis-compatible engine. Resuming from 0 ACU takes about 15 s, so keep minimum ≥0.5 ACU if the first request after idle can't wait."}],"weak":{"1.1":"shaky","1.2":"shaky","1.3":"shaky","1.4":"known","1.5":"gap","2.1":"shaky","2.2":"shaky","2.3":"known","2.4":"shaky"},"decide":[{"id":"net","t":"Connect VPCs and networks","q":"How many networks, do they need full IP connectivity, do CIDRs overlap?","tasks":["1.1","2.3"],"rows":[["VPC peering","A few VPCs need direct, full connectivity (same or different account/Region).","Many VPCs (full mesh grows fast), transitive routing, overlapping CIDRs, or sharing one on-prem link.","1:1 and non-transitive; no hourly charge, you pay data transfer."],["AWS Transit Gateway","Dozens–thousands of VPCs plus VPN/Direct Connect through one hub; segmentation with TGW route tables.","CIDRs overlap; you only need to expose one service.","Regional hub, transitive, shared across accounts with RAM; inter-Region via TGW peering; billed per attachment-hour + per GB."],["AWS PrivateLink (endpoint service)","Expose ONE service (behind an NLB or GWLB) to many consumer VPCs/accounts, even with overlapping CIDRs.","Two networks need general two-way connectivity.","One-way: only consumers start connections; consumers create interface endpoints."],["VPC sharing (AWS RAM)","Many accounts should deploy into centrally managed subnets of one VPC (network team owns the VPC).","Accounts need their own isolated networks.","Participants launch resources in shared subnets but cannot change the VPC; no peering needed inside the VPC."],["AWS Cloud WAN","A global network across many Regions and on-prem sites managed from one central policy with segments.","A single Region (Transit Gateway is enough).","Core network policy defines segments and routing; attaches VPCs, VPNs, Connect, TGWs."],["Amazon VPC Lattice","Service-to-service (HTTP/gRPC/TCP) connectivity across VPCs/accounts with IAM auth policies, even with overlapping CIDRs.","You need IP-level network routing between whole VPCs.","Application-layer service network; no route tables to manage."]]},{"id":"hyb","t":"Connect on-premises to AWS","q":"Bandwidth, consistency, encryption and time to deploy?","tasks":["1.1","2.2"],"rows":[["AWS Site-to-Site VPN","Quick, cheap, encrypted link over the internet; backup for Direct Connect.","Steady high bandwidth or consistent latency is required.","2 IPsec tunnels per connection, up to 1.25 Gbps each (Large Bandwidth tunnels up to 5 Gbps on Transit Gateway or Cloud WAN only); ECMP on Transit Gateway adds up tunnels."],["AWS Direct Connect","Consistent latency, high bandwidth, lower data-out cost.","You need it working in days (provisioning takes weeks) or need encryption by default.","Dedicated 1/10/100/400 Gbps or hosted via partner; private VIF → VPC, transit VIF → TGW via DX gateway, public VIF → AWS public endpoints."],["Direct Connect + VPN backup","Production needs DX performance with a cheaper failover path.","Maximum resiliency is required (use 2 DX locations instead).","BGP prefers DX; VPN takes over if DX fails."],["Encrypt over Direct Connect","Compliance requires encryption on the private link.","—","MACsec (layer 2, dedicated 10/100/400 Gbps connections at supported locations, not hosted) or IPsec VPN over the DX link (layer 3, end to end)."],["AWS Client VPN","Individual users (laptops) need remote access into VPCs.","Site-to-site connectivity.","Managed OpenVPN-based endpoint with AD/SAML authentication."]]},{"id":"move","t":"Move data and workloads into AWS","q":"What is moving (files, databases, servers, streams), how much, and how good is the netwo
