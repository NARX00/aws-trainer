em --table-name lab-orders \\\n  --item '{\"orderId\":{\"S\":\"o-1\"},\"priority\":{\"S\":\"HIGH\"},\"amount\":{\"N\":\"250\"}}'\naws dynamodb put-item --table-name lab-orders \\\n  --item '{\"orderId\":{\"S\":\"o-2\"},\"priority\":{\"S\":\"LOW\"},\"amount\":{\"N\":\"5\"}}'\naws dynamodb put-item --table-name lab-orders \\\n  --item '{\"orderId\":{\"S\":\"o-3\"},\"priority\":{\"S\":\"HIGH\"},\"fail\":{\"BOOL\":true}}'\nsleep 90\naws logs tail /aws/lambda/$FN --since 5m | grep -E 'NOTIFIED|FAILED'\naws sqs receive-message --queue-url $QURL --query 'Messages[0].Body' --output text"},"trouble":[["create-event-source-mapping fails: 'Cannot access stream ... Please ensure the role can perform the GetRecords, GetShardIterator, DescribeStream, and ListStreams Actions'.","The execution role is missing a stream action or the ARN does not match table/lab-orders/stream/*. Fix perms.json, put-role-policy again, wait 15 s and retry."],["Nothing happens for the HIGH insert.","Check the mapping State is Enabled and LastProcessingResult; check the filter JSON (escaped quotes, exact case 'HIGH' and 'INSERT'); remember starting position LATEST ignores items written before the mapping was enabled. Logs exist but no email means the SNS subscription is still PendingConfirmation."],["The poison record never reaches SQS and keeps retrying.","MaximumRetryAttempts or the destination is not set (default is retry until the record expires in 24 h). Also the role needs sqs:SendMessage on the queue, otherwise the mapping cannot write the failure record."]],"cleanup":[{"txt":"Delete the mapping first, then everything else.","code":"aws lambda delete-event-source-mapping --uuid $ESM_UUID\naws lambda delete-function --function-name $FN\naws logs delete-log-group --log-group-name /aws/lambda/$FN\naws iam delete-role-policy --role-name lab-orders-notify-role --policy-name app\naws iam delete-role --role-name lab-orders-notify-role\naws dynamodb delete-table --table-name lab-orders\naws sns delete-topic --topic-arn $TOPIC_ARN   # also removes its subscriptions\naws sqs delete-queue --queue-url $QURL\ncd ~ && rm -rf ~/lab3"}],"cost":"Effectively free: Lambda reads of DynamoDB Streams are not charged as stream read requests, SNS email has a free monthly allowance (1,000 emails), SQS and Lambda usage is tiny, DynamoDB on-demand writes are fractions of a cent. What could cost money: nothing meaningful at lab scale; a poison record without retry limits only burns Lambda invocations until it expires after 24 h.","check":[["A stream-triggered function fails on one bad record and the whole shard stops progressing for hours. Which settings fix it?","Set MaximumRetryAttempts (and/or MaximumRecordAgeInSeconds), turn on BisectBatchOnFunctionError or return ReportBatchItemFailures, and add an on-failure destination (SQS, SNS or S3) to keep the failure metadata."],["You need the item's previous value to detect a status change from PENDING to SHIPPED. Which stream view type?","NEW_AND_OLD_IMAGES. KEYS_ONLY gives only the key, NEW_IMAGE only the after state, OLD_IMAGE only the before state."],["What does the on-failure destination actually contain, and what does that mean for recovery?","For SQS/SNS destinations only invocation metadata: shard ID, start/end sequence numbers, batch size, error info - not the record data; an S3 destination also stores the full payload, so choose it when you need the records. With SQS/SNS, recover by reading the records from the stream with those sequence numbers before the 24-hour retention expires."]]},{"id":"cwl","title":"CloudWatch Logs subscription filter to Data Firehose to S3","goal":"Continuously copy only ERROR log lines from a CloudWatch Logs log group to S3 via a subscription filter and Amazon Data Firehose.","exam":"Tasks 3.1 (operational excellence: centralized logging), 1.4 (multi-account: the same pattern with a cross-account log destination is how you centralize logs into a log-archive account), 1.5/3.5 (cost: keep long-term logs in S3 instead of CloudWatch Logs storage). Traps cleared up: (1) CloudWatch Logs needs an IAM ROLE that trusts logs.amazonaws.com to put records into Firehose (a Lambda destination uses a resource policy instead); (2) CloudWatch Logs sends records GZIP-compressed and wrapped in a JSON envelope; without Firehose decompression your S3 objects are gzip blobs without a .gz extension, and turning on Firehose GZIP on top double-compresses them; (3) max 5 subscription filters per log group; (4) for cross-account you create a CloudWatch Logs DESTINATION in the receiving account (with a destination policy) - you cannot point a subscription filter directly at another account's Firehose stream; (5) for a one-off historical copy use create-export-task to S3, not a subscription.","arch":"app writes logs -> CloudWatch Logs log group /lab/app -> subscription filter (pattern ERROR, role CWLtoFirehose) -> Amazon Data Firehose lab-cwl-to-s3 (decompress, extract message) -> S3 cwl/ prefix","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","About 30 minutes."],"steps":[{"t":"Set variables, create the bucket and the log group","txt":"","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nBUCKET=lab-cwl-archive-$ACCOUNT_ID\naws s3api create-bucket --bucket $BUCKET\naws logs create-log-group --log-group-name /lab/app\naws logs create-log-stream --log-group-name /lab/app --log-stream-name s1\nmkdir -p ~/lab4 && cd ~/lab4","lang":"bash"},{"t":"Create the Firehose stream in the console","txt":"Amazon Data Firehose console > Create Firehose stream. Source: Direct PUT. Destination: Amazon S3. Firehose stream name: lab-cwl-to-s3. Under 'Transform and convert records': turn on 'Decompress source records from Amazon CloudWatch Logs' and turn on message extraction (so S3 receives just the log message lines instead of the JSON envelope). Leave 'Transform source records with AWS Lambda' off. Destination settings: S3 bucket: lab-cwl-archive-ACCOUNT_ID; New line delimiter: Enabled; S3 bucket prefix: cwl/. Buffer hints, compression and encryption: Buffer interval 60 seconds; Compression for data records: GZIP (safe now because the records were decompressed first). Advanced settings > Service access: Create or update IAM role (the console creates a role named like KinesisFirehoseServiceRole-lab-cwl-to-s3-us-east-1-...). Choose Create Firehose stream and wait for Status: Active."},{"t":"Role for CloudWatch Logs: trust policy","txt":"CloudWatch Logs, not Firehose, assumes this role. The aws:SourceArn condition stops any other account's log groups from using it (confused deputy).","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"logs.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\": {\n        \"StringLike\": { \"aws:SourceArn\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:*\" }\n      }\n    }\n  ]\n}","lang":"json"},{"t":"Role for CloudWatch Logs: permissions","txt":"Only PutRecord/PutRecordBatch on this one stream (note the ARN uses 'deliverystream', the API name, even though the console says Firehose stream).","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutIntoOneFirehoseStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"firehose:PutRecord\", \"firehose:PutRecordBatch\"],\n      \"Resource\": \"arn:aws:firehose:us-east-1:ACCOUNT_ID:deliverystream/lab-cwl-to-s3\"\n    }\n  ]\n}","lang":"json"},{"t":"Create the role","txt":"","code":"cat > trust.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"logs.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\": {\n        \"StringLike\": { \"aws:SourceArn\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:*\" }\n      }\n    }\n  ]\n}\nEOF\ncat > perms.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"PutIntoOneFirehoseStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"firehose:PutRecord\", \"firehose:PutRecordBatch\"],\n      \"Resource\": \"arn:aws:firehose:us-east-1:ACCOUNT_ID:deliverystream/lab-cwl-to-s3\"\n    }\n  ]\n}\nEOF\nsed -i \"s/ACCOUNT_ID/$ACCOUNT_ID/g\" trust.json perms.json\naws iam create-role --role-name lab-cwl-to-firehose-role --assume-role-policy-document file://trust.json\naws iam put-role-policy --role-name lab-cwl-to-firehose-role --policy-name put --policy-document file://perms.json\nsleep 15","lang":"bash"},{"t":"Create the subscription filter","txt":"Console equivalent: CloudWatch > Log groups > /lab/app > Actions > Subscription filters > Create Amazon Data Firehose subscription filter > Destination: lab-cwl-to-s3, Grant permission: lab-cwl-to-firehose-role, Log format: Other, Subscription filter pattern: ERROR, Subscription filter name: errors-to-s3. CloudWatch Logs sends a test record when you create it, which fails if the role is wrong.","code":"aws logs put-subscription-filter --log-group-name /lab/app \\\n  --filter-name errors-to-s3 --filter-pattern \"ERROR\" \\\n  --destination-arn arn:aws:firehose:us-east-1:$ACCOUNT_ID:deliverystream/lab-cwl-to-s3 \\\n  --role-arn arn:aws:iam::$ACCOUNT_ID:role/lab-cwl-to-firehose-role","lang":"bash"}],"test":{"txt":"Write 5 INFO and 5 ERROR lines, wait for the buffer, then read the delivered object. Expected: one or more .gz objects under cwl/YYYY/MM/DD/HH/, and the decompressed content contains only the 5 ERROR lines as plain text, one per line.","code":"for i in $(seq 5); do\n  aws logs put-log-events --log-group-name /lab/app --log-stream-name s1 \\\n    --log-events \"[{\\\"timestamp\\\":$(date +%s%3N),\\\"message\\\":\\\"INFO request ok id=$i\\\"},{\\\"timestamp\\\":$(date +%s%3N),\\\"message\\\":\\\"ERROR payment failed id=$i\\\"}]\" >/dev/null\ndone\nsleep 120\naws s3 ls s3://$BUCKET/cwl/ --recursive\nKEY=$(aws s3api list-objects-v2 --bucket $BUCKET --prefix cwl/ \\\n  --query 'Contents[-1].Key' --output text)\naws s3 cp s3://$BUCKET/$KEY - | gunzip"},"trouble":[["put-subscription-filter fails: 'Could not deliver test message to specified Firehose stream. Check if the given Firehose stream is in ACTIVE state'.","Either the stream is still CREATING, or the role is wrong: trust must name logs.amazonaws.com, the SourceArn Region/account must match, the permissions ARN must be deliverystream/lab-cwl-to-s3, and IAM needs a few seconds to propagate. Fix and retry."],["S3 objects look like binary garbage.","Decompression was not turned on, so each record is still the CloudWatch Logs gzip payload. Run gunzip on it once (or twice if Firehose GZIP was also on), and edit the Firehose stream to turn on decompression."],["Objects contain JSON with messageType CONTROL_MESSAGE or a logEvents array.","That is the envelope; CONTROL_MESSAGE is the connectivity test. Turn on message extraction to store only messages, or keep the JSON if you want log group/stream metadata."]],"cleanup":[{"txt":"Delete the filter, stream, roles, log group and bucket. Also delete the role the console created for Firehose (IAM > Roles > search KinesisFirehoseServiceRole-lab-cwl > Delete; its inline/managed policy goes with it, and a customer managed policy of the same name may need deleting under Policies).","code":"aws logs delete-subscription-filter --log-group-name /lab/app --filter-name errors-to-s3\naws firehose delete-delivery-stream --delivery-stream-name lab-cwl-to-s3\naws iam delete-role-policy --role-name lab-cwl-to-firehose-role --policy-name put\naws iam delete-role --role-name lab-cwl-to-firehose-role\naws logs delete-log-group --log-group-name /lab/app\naws s3 rm s3://$BUCKET --recursive && aws s3api delete-bucket --bucket $BUCKET\ncd ~ && rm -rf ~/lab4"},{"txt":"Delete the Firehose error-logging log group the console created.","code":"aws logs delete-log-group --log-group-name /aws/kinesisfirehose/lab-cwl-to-s3 2>/dev/null || true"}],"cost":"Cents at most: CloudWatch Logs ingestion is USD 0.50 per GB (free tier 5 GB per month), Firehose ingestion about USD 0.029 per GB plus a small per-GB charge for CloudWatch Logs decompression, S3 storage negligible. What could cost money: subscribing a high-volume production log group with an empty filter pattern (everything flows), or leaving the stream subscribed to a chatty log group.","check":[["Which principal must the subscription filter's role trust, and why does a Lambda destination not need a role?","logs.amazonaws.com (CloudWatch Logs calls Firehose/Kinesis on your behalf using that role). For a Lambda destination, CloudWatch Logs is authorized through the function's resource-based policy (lambda add-permission for logs.amazonaws.com)."],["The security team wants logs from 50 member accounts in one log-archive account's S3 bucket. Outline the pattern.","In the log-archive account create a Firehose stream to S3 and a CloudWatch Logs destination (put-destination) pointing at it, with a role logs can assume and a destination policy allowing the member accounts or the organization. In each member account, create subscription filters (or an account-level subscription filter policy) targeting that destination ARN. CloudWatch Logs centralization rules/cross-account observability are related newer options."],["Your S3 files from this pipeline are unreadable and you enabled GZIP on Firehose. What happened and how do you fix it?","Double compression: CloudWatch Logs already gzips each record. Turn on Firehose CloudWatch Logs decompression (then GZIP on the destination is fine), or turn off Firehose compression and add .gz handling downstream."]]},{"id":"kinesis","title":"Kinesis Data Streams + Lambda mini-lab (shards, batching, bisect, iterator age)","goal":"Produce records with partition keys into a 2-shard stream, consume them with Lambda, isolate a poison record with bisect-on-error, and watch iterator age grow when the consumer falls behind.","exam":"Tasks 2.5 and 3.3 (performance: shards, partition keys, batch size, parallelization), 2.4 and 3.4 (reliability: poison records, retries, on-failure destination), 2.6 (cost: on-demand vs provisioned). Traps cleared up: (1) provisioned = you pick shards (each 1 MB/s or 1,000 records/s in, 2 MB/s out) and pay per shard-hour; on-demand = auto-scales, pay per stream-hour plus per GB, good for unknown/spiky traffic; (2) a partition key maps to one shard, so a low-cardinality or hot key throttles one shard (ProvisionedThroughputExceededException) no matter how many shards you add; ordering is guaranteed only within a shard; (3) Lambda processes one batch per shard at a time by default; ParallelizationFactor (up to 10) or enhanced fan-out raises throughput; (4) a function error retries the WHOLE batch until success or record expiry - BisectBatchOnFunctionError, MaximumRetryAttempts, MaximumRecordAgeInSeconds and an on-failure destination prevent a stuck shard; (5) rising IteratorAge (Lambda metric) / GetRecords.IteratorAgeMilliseconds (Kinesis metric) means consumers are falling behind and data risks expiring past retention (24 h default, up to 365 days).","arch":"producer.py (put_records, partition key = device) -> Kinesis Data Stream lab-stream (provisioned, 2 shards) -> event source mapping (batch 100, window 5 s, bisect, retries 2) -> Lambda lab-stream-consumer -> CloudWatch Logs; failed records -> SQS lab-stream-failures","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","About 45 minutes. Kinesis Data Streams is not in the free tier and bills per hour - do the cleanup the same session."],"steps":[{"t":"Set variables","txt":"","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nFN=lab-stream-consumer\nmkdir -p ~/lab5 && cd ~/lab5","lang":"bash"},{"t":"Create a provisioned stream with 2 shards","txt":"Console equivalent: Kinesis > Data streams > Create data stream > Data stream name: lab-stream, Capacity mode: Provisioned, Provisioned shards: 2. Compare with On-demand in the same screen: no shard count to choose. You could switch later with update-stream-mode (limited number of switches per 24 h).","code":"aws kinesis create-stream --stream-name lab-stream --shard-count 2 \\\n  --stream-mode-details StreamMode=PROVISIONED\naws kinesis wait stream-exists --stream-name lab-stream\nSTREAM_ARN=arn:aws:kinesis:us-east-1:$ACCOUNT_ID:stream/lab-stream\naws kinesis list-shards --stream-name lab-stream \\\n  --query 'Shards[].{id:ShardId,start:HashKeyRange.StartingHashKey}'","lang":"bash"},{"t":"Create the failure queue","txt":"","code":"QURL=$(aws sqs create-queue --queue-name lab-stream-failures --query QueueUrl --output text)\nQARN=arn:aws:sqs:us-east-1:$ACCOUNT_ID:lab-stream-failures","lang":"bash"},{"t":"Execution role permissions (least privilege)","txt":"Polling permissions on one stream (Lambda reads with GetRecords, so this is in the execution role, not a resource policy). SubscribeToShard would be needed only for an enhanced fan-out consumer. Trust policy: lambda.amazonaws.com as in lab 2.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"ReadOneStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"kinesis:DescribeStream\",\n        \"kinesis:DescribeStreamSummary\",\n        \"kinesis:GetRecords\",\n        \"kinesis:GetShardIterator\",\n        \"kinesis:ListShards\"\n      ],\n      \"Resource\": \"arn:aws:kinesis:us-east-1:ACCOUNT_ID:stream/lab-stream\"\n    },\n    {\n      \"Sid\": \"ListStreamsIsAccountLevel\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"kinesis:ListStreams\",\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\": \"OnFailureDestination\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sqs:SendMessage\",\n      \"Resource\": \"arn:aws:sqs:us-east-1:ACCOUNT_ID:lab-stream-failures\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-stream-consumer:*\"\n    }\n  ]\n}","lang":"json"},{"t":"Create the role, log group and consumer function","txt":"The consumer raises an error for the whole batch when it sees a poison record, which is what bisect-on-error is designed for (compare lab 3, which used partial batch responses instead).","code":"cat > trust.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"lambda.amazonaws.com\" },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}\nEOF\ncat > perms.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"ReadOneStream\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"kinesis:DescribeStream\",\n        \"kinesis:DescribeStreamSummary\",\n        \"kinesis:GetRecords\",\n        \"kinesis:GetShardIterator\",\n        \"kinesis:ListShards\"\n      ],\n      \"Resource\": \"arn:aws:kinesis:us-east-1:ACCOUNT_ID:stream/lab-stream\"\n    },\n    {\n      \"Sid\": \"ListStreamsIsAccountLevel\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"kinesis:ListStreams\",\n      \"Resource\": \"*\"\n    },\n    {\n      \"Sid\": \"OnFailureDestination\",\n      \"Effect\": \"Allow\",\n      \"Action\": \"sqs:SendMessage\",\n      \"Resource\": \"arn:aws:sqs:us-east-1:ACCOUNT_ID:lab-stream-failures\"\n    },\n    {\n      \"Sid\": \"WriteOwnLogs\",\n      \"Effect\": \"Allow\",\n      \"Action\": [\"logs:CreateLogStream\", \"logs:PutLogEvents\"],\n      \"Resource\": \"arn:aws:logs:us-east-1:ACCOUNT_ID:log-group:/aws/lambda/lab-stream-consumer:*\"\n    }\n  ]\n}\nEOF\nsed -i \"s/ACCOUNT_ID/$ACCOUNT_ID/g\" perms.json\naws iam create-role --role-name lab-stream-consumer-role --assume-role-policy-document file://trust.json\naws iam put-role-policy --role-name lab-stream-consumer-role --policy-name app --policy-document file://perms.json\naws logs create-log-group --log-group-name /aws/lambda/$FN\nsleep 15\ncat > app.py <<'EOF'\nimport base64\nimport json\n\ndef handler(event, context):\n    recs = event[\"Records\"]\n    print(f\"BATCH size={len(recs)} shard={event['Records'][0]['eventID'].split(':')[0]}\")\n    for r in recs:\n        payload = json.loads(base64.b64decode(r[\"kinesis\"][\"data\"]))\n        if payload.get(\"poison\"):\n            # fail the WHOLE batch: bisect will split it to isolate this record\n            raise ValueError(f\"poison seq={r['kinesis']['sequenceNumber']}\")\n        print(r[\"kinesis\"][\"partitionKey\"], payload)\nEOF\nzip -q fn.zip app.py\naws lambda create-function --function-name $FN --runtime python3.13 \\\n  --handler app.handler --zip-file fileb://fn.zip --timeout 30 \\\n  --role arn:aws:iam::$ACCOUNT_ID:role/lab-stream-consumer-role\naws lambda wait function-active-v2 --function-name $FN","lang":"bash"},{"t":"Consumer code (for reading)","txt":"Kinesis record data arrives base64-encoded inside the Lambda event.","code":"import base64\nimport json\n\ndef handler(event, context):\n    recs = event[\"Records\"]\n    print(f\"BATCH size={len(recs)} shard={event['Records'][0]['eventID'].split(':')[0]}\")\n    for r in recs:\n        payload = json.loads(base64.b64decode(r[\"kinesis\"][\"data\"]))\n        if payload.get(\"poison\"):\n            # fail the WHOLE batch: bisect will split it to isolate this record\n            raise ValueError(f\"poison seq={r['kinesis']['sequenceNumber']}\")\n        print(r[\"kinesis\"][\"partitionKey\"], payload)","lang":"python"},{"t":"Create the event source mapping","txt":"Console equivalent: Lambda > Add trigger > Kinesis > Kinesis stream: lab-stream, Batch size: 100, Batch window: 5, Starting position: Trim horizon, Additional settings: On-failure destination (SQS ARN), Retry attempts: 2, Maximum age of record: 3600, Split batch on error: on, Concurrent batches per shard: 1. TRIM_HORIZON reads from the oldest available record; LATEST only new ones.","code":"aws lambda create-event-source-mapping --function-name $FN \\\n  --event-source-arn $STREAM_ARN --starting-position TRIM_HORIZON \\\n  --batch-size 100 --maximum-batching-window-in-seconds 5 \\\n  --bisect-batch-on-function-error --maximum-retry-attempts 2 \\\n  --maximum-record-age-in-seconds 3600 --parallelization-factor 1 \\\n  --destination-config \"{\\\"OnFailure\\\":{\\\"Destination\\\":\\\"$QARN\\\"}}\"\nESM_UUID=$(aws lambda list-event-source-mappings --function-name $FN \\\n  --query 'EventSourceMappings[0].UUID' --output text)","lang":"bash"},{"t":"Write the producer","txt":"Partition key = device id. Kinesis hashes the key (MD5) into the 128-bit hash key space and the shard owning that range gets the record, so the same device always lands on the same shard (ordering per device).","code":"import json\nimport random\nimport sys\nfrom collections import Counter\nimport boto3\n\nk = boto3.client(\"kinesis\", region_name=\"us-east-1\")\nn = int(sys.argv[1]) if len(sys.argv) > 1 else 50\npoison = \"--poison\" in sys.argv\n\nrecords = []\nfor i in range(n):\n    dev = f\"sensor-{i % 5}\"\n    body = {\"device\": dev, \"temp\": round(random.uniform(18, 30), 1)}\n    records.append({\"Data\": json.dumps(body).encode(), \"PartitionKey\": dev})\nif poison:\n    records.append({\"Data\": json.dumps({\"device\": \"bad\", \"poison\": True}).encode(),\n                    \"PartitionKey\": \"sensor-0\"})\n\nresp = k.put_records(StreamName=\"lab-stream\", Records=records)\nprint(\"FailedRecordCount:\", resp[\"FailedRecordCount\"])\n# which shard did each partition key land on?\nmapping = Counter((rec[\"PartitionKey\"], out.get(\"ShardId\"))\n                  for rec, out in zip(records, resp[\"Records\"]))\nfor (pk, shard), c in sorted(mapping.items()):\n    print(f\"{pk:10} -> {shard}  x{c}\")","lang":"python"},{"t":"Send 50 records","txt":"Expected: FailedRecordCount 0, and each sensor-N mapped consistently to one of the two shards.","code":"cat > producer.py <<'EOF'\nimport json\nimport random\nimport sys\nfrom collections import Counter\nimport boto3\n\nk = boto3.client(\"kinesis\", region_name=\"us-east-1\")\nn = int(sys.argv[1]) if len(sys.argv) > 1 else 50\npoison = \"--poison\" in sys.argv\n\nrecords = []\nfor i in range(n):\n    dev = f\"sensor-{i % 5}\"\n    body = {\"device\": dev, \"temp\": round(random.uniform(18, 30), 1)}\n    records.append({\"Data\": json.dumps(body).encode(), \"PartitionKey\": dev})\nif poison:\n    records.append({\"Data\": json.dumps({\"device\": \"bad\", \"poison\": True}).encode(),\n                    \"PartitionKey\": \"sensor-0\"})\n\nresp = k.put_records(StreamName=\"lab-stream\", Records=records)\nprint(\"FailedRecordCount:\", resp[\"FailedRecordCount\"])\n# which shard did each partition key land on?\nmapping = Counter((rec[\"PartitionKey\"], out.get(\"ShardId\"))\n                  for rec, out in zip(records, resp[\"Records\"]))\nfor (pk, shard), c in sorted(mapping.items()):\n    print(f\"{pk:10} -> {shard}  x{c}\")\nEOF\npython3 producer.py 50\nsleep 15\naws logs tail /aws/lambda/$FN --since 5m | grep BATCH","lang":"bash"},{"t":"Watch iterator age","txt":"Disable the mapping, produce, wait, re-enable. The first batches after re-enabling are minutes old. Then open CloudWatch > Metrics > All metrics > Lambda > By Function Name > lab-stream-consumer > IteratorAge, Statistic: Maximum, Period: 1 minute. Also Kinesis > lab-stream > Monitoring > Get records - iterator age. In production you alarm on IteratorAge Maximum.","code":"aws lambda update-event-source-mapping --uuid $ESM_UUID --no-enabled\npython3 producer.py 200\nsleep 240\naws lambda update-event-source-mapping --uuid $ESM_UUID --enabled\nsleep 120\naws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name IteratorAge \\\n  --dimensions Name=FunctionName,Value=$FN --statistics Maximum --period 60 \\\n  --start-time $(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ) \\\n  --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) \\\n  --query 'sort_by(Datapoints,&Timestamp)[].[Timestamp,Maximum]' --output text","lang":"bash"}],"test":{"txt":"Send 20 good records plus one poison record on sensor-0. Expected: in the logs you see the batch containing the poison record fail, then smaller and smaller BATCH sizes on that shard (bisect halving), the good records printed, and once the retries are used up the single poison record is reported to SQS (body contains KinesisBatchInfo with batchSize 1, shardId and sequence numbers). The other shard is unaffected. IteratorAge from the previous step should show a spike of roughly 240,000 ms or more, then drop to near zero.","code":"python3 producer.py 20 --poison\nsleep 90\naws logs tail /aws/lambda/$FN --since 3m | grep -E 'BATCH|poison'\naws sqs receive-message --queue-url $QURL --query 'Messages[0].Body' --output text"},"trouble":[["create-event-source-mapping fails with InvalidParameterValueException about permissions to call GetRecords/ListShards.","The execution role does not cover the stream ARN (check Region, ACCOUNT_ID substitution, stream name). Fix perms.json, put-role-policy again, wait 15 s and retry."],["Producer gets ProvisionedThroughputExceededException or FailedRecordCount > 0.","One shard is over 1 MB/s or 1,000 records/s - usually a hot partition key. Retry failed records from the response (PutRecords is not all-or-nothing), spread keys (higher cardinality), add shards, or use on-demand mode."],["IteratorAge keeps climbing and the same records repeat in the logs.","The function is failing the whole batch and retrying (or timing out). Check errors, keep bisect and a retry limit on, raise the function timeout or memory, or raise ParallelizationFactor / shard count if it is simply too slow."]],"cleanup":[{"txt":"Delete the mapping, function, stream, queue and role. Deleting the stream stops the hourly charge.","code":"aws lambda delete-event-source-mapping --uuid $ESM_UUID\naws lambda delete-function --function-name $FN\naws logs delete-log-group --log-group-name /aws/lambda/$FN\naws kinesis delete-stream --stream-name lab-stream\naws sqs delete-queue --queue-url $QURL\naws iam delete-role-policy --role-name lab-stream-consumer-role --policy-name app\naws iam delete-role --role-name lab-stream-consumer-role\ncd ~ && rm -rf ~/lab5"}],"cost":"About USD 0.03 per hour for 2 provisioned shards (USD 0.015 per shard-hour in us-east-1) plus negligible PUT payload units; a 1-hour lab costs a few cents. Not free tier. What could cost money: forgetting to delete the stream (about USD 22 per month for 2 shards), switching to on-demand and forgetting it (per stream-hour plus per GB, more than one idle shard), enhanced fan-out consumers, or extended retention.","check":[["A stream has 10 shards but PutRecords throttles while 9 shards sit idle. Cause and fix?","A hot partition key (all records share one or a few keys, so they hash to one shard). Use a higher-cardinality key (for example device ID plus a random suffix if per-device order is not required). Adding shards does not help a single hot key."],["Lambda on a Kinesis stream cannot keep up and IteratorAge rises steadily, but the function itself is healthy. Two ways to increase throughput without changing code?","Raise ParallelizationFactor (up to 10 concurrent batches per shard, order still kept per partition key) and/or add shards (or use on-demand). Increasing batch size and batching window also helps; enhanced fan-out gives each consumer its own 2 MB/s per shard."],["When would you choose on-demand over provisioned mode?","Unpredictable or spiky traffic, new workloads with unknown volume, or when you want no shard management. Provisioned is cheaper for steady, predictable throughput you can size; on-demand bills per stream-hour and per GB in and out."]]},{"id":"cloudfront","title":"CloudFront + private S3 content with signed URLs","goal":"Serve a file from a private S3 bucket only through CloudFront (origin access control) and only to holders of a time-limited signed URL created with your own key pair.","exam":"Tasks 2.3 and 3.2 (security: restrict origin access, restrict viewers), 2.5 (performance: edge caching), 1.2 (security controls). Traps cleared up: (1) origin access control (OAC) is the current way to lock an S3 origin to CloudFront; OAI is legacy - OAC also supports SSE-KMS objects, PUT/POST and all Regions; with SSE-KMS you must also allow the cloudfront.amazonaws.com principal in the KMS key policy; (2) OAC protects the ORIGIN (no direct S3 access); signed URLs/cookies protect the VIEWER side - you usually need both; (3) use trusted KEY GROUPS (public keys you upload, managed by IAM-permitted users) rather than legacy CloudFront key pairs that require the root user; (4) signed URL = one file; signed cookies = many files (for example an HLS video or a members area) without changing URLs; (5) CloudFront signed URLs are not S3 presigned URLs - S3 presigned URLs go straight to S3 and are signed with IAM credentials; (6) OAC with an S3 website endpoint does not work - use the REST endpoint (website endpoints need a custom origin).","arch":"client with signed URL -> CloudFront distribution (behavior: Restrict viewer access, trusted key group) -> OAC (SigV4) -> private S3 bucket (Block Public Access on, bucket policy allows only this distribution)","pre":["An AWS account where you can create IAM roles (an admin-style learner user or role; not the root user).","AWS CloudShell opened in us-east-1 (N. Virginia) - check the Region selector at top right of the console before you open it. CloudShell already has AWS CLI v2, Python 3 and boto3, and uses your console session credentials, so you never create or store access keys.","If CloudShell times out, your shell variables are lost but files in your home directory persist: just re-run the 'Set variables' step.","About 45 minutes, of which 5-15 minutes is waiting for the distribution to deploy (and again to disable it at cleanup)."],"steps":[{"t":"Set variables, create the bucket and a private object","txt":"Block Public Access stays on; nothing in this lab makes the bucket public.","code":"export AWS_REGION=us-east-1\nACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)\nBUCKET=lab-private-cdn-$ACCOUNT_ID\nmkdir -p ~/lab6 && cd ~/lab6\naws s3api create-bucket --bucket $BUCKET\necho \"secret hello from S3 via CloudFront\" > hello.txt\naws s3 cp hello.txt s3://$BUCKET/private/hello.txt --content-type text/plain","lang":"bash"},{"t":"Generate the signing key pair","txt":"This RSA key pair is a CloudFront signing key, not an AWS access key. The private key stays in your CloudShell home directory (chmod 600) and is deleted at cleanup; in production it would live in AWS Secrets Manager and be read by the signing application.","code":"openssl genrsa -out private_key.pem 2048\nopenssl rsa -pubout -in private_key.pem -out public_key.pem\nchmod 600 private_key.pem\ncat public_key.pem","lang":"bash"},{"t":"Upload the public key","txt":"CloudFront console > Key management > Public keys > Create public key > Name: lab-key, Key: paste the whole public_key.pem including the BEGIN/END lines > Create public key. Copy the generated ID (looks like K2ABC...); that ID is the Key-Pair-Id you sign with. Then set it in CloudShell.","code":"PUBKEY_ID=PASTE_THE_PUBLIC_KEY_ID_HERE","lang":"bash"},{"t":"Create the key group","txt":"CloudFront console > Key management > Key groups > Create key group > Name: lab-kg, Public keys: select lab-key > Create key group. A key group can hold up to 5 public keys, which is how you rotate keys without downtime."},{"t":"Create the distribution with OAC","txt":"CloudFront console > Distributions > Create distribution. If the wizard asks you to choose a pricing plan, choose Pay-as-you-go. Do not choose a flat-rate plan: those require a WAF web ACL and must be cancelled before the distribution can be deleted. Origin: Origin type Amazon S3, pick lab-private-cdn-ACCOUNT_ID.s3.us-east-1.amazonaws.com (the REST endpoint, not a website endpoint). Origin access: Origin access control settings (recommended) > Create new OAC > Signing behavior: Sign requests (recommended) > Create. If the wizard offers to update the bucket policy for you, allow it; otherwise copy the policy it shows (next step). Default cache behavior: Viewer protocol policy: Redirect HTTP to HTTPS; Allowed HTTP methods: GET, HEAD; Cache policy: CachingOptimized. Web Application Firewall: Do not enable security protections. Leave price class, alternate domain and default root object empty. Create distribution and note the Distribution domain name (dxxxx.cloudfront.net) and ID."},{"t":"Bucket policy (if the console did not apply it)","txt":"Only this distribution, via the cloudfront.amazonaws.com service principal, may read objects. Replace the placeholders, then apply.","code":"{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"AllowCloudFrontServicePrincipalReadOnly\",\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"cloudfront.amazonaws.com\" },\n      \"Action\": \"s3:GetObject\",\n      \"Resource\": \"arn:aws:s3:::BUCKET_NAME/*\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"AWS:SourceArn\": \"arn:aws:cloudfront::ACCOUNT_ID:distribution/DISTRIBUTION_ID\"\n        }\n      }\n    }\n  ]\n}","lang":"json"},{"t":"Apply the bucket policy and set variables","txt":"","code":"DIST_ID=PASTE_DISTRIBUTION_ID_HERE\nCF_DOMAIN=$(aws cloudfront get-distribution --id $DIST_ID --query Distribution.DomainName --output text)\ncat > bucket-policy.json <<'EOF'\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"AllowCloudFrontServicePrincipalReadOnly\",\n      \"Effect\": \"Allow\",\n      \"Principal\": { \"Service\": \"cloudfront.amazonaws.com\" },\n      \"Action\": \"s3:GetObject\",\n      \"Resource\": \"arn:aws:s3:::BUCKET_NAME/*\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"AWS:SourceArn\": \"arn:aws:cloudfront::ACCOUNT_ID:distribution/DISTRIBUTION_ID\"\n        }\n      }\n    }\n  ]\n}\nEOF\nsed -i \"s/BUCKET_NAME/$BUCKET/g; s/ACCOUNT_ID/$ACCOUNT_ID/g; s/DISTRIBUTION_ID/$DIST_ID/g\" bucket-policy.json\naws s3api put-bucket-policy --bucket $BUCKET --policy file://bucket-policy.json\ncurl -s -o /dev/null -w \"%{http_code}\\n\" https://$CF_DOMAIN/private/hello.txt   # expect 200 before restriction","lang":"bash"},{"t":"Restrict viewer access to the key group","txt":"Distribution > Behaviors tab > select Default (*) > Edit > Restrict viewer access: Yes > Trusted authorization type: Trusted key groups (recommended) > Add key groups: lab-kg > Save changes. Wait until Last modified shows a date instead of Deploying (a few minutes). Exam note: you could instead put this on a separate behavior for path pattern /private/* and leave public files unrestricted."},{"t":"Sign a URL with the AWS CLI","txt":"aws cloudfront sign creates a canned-policy signed URL. --key-pair-id is the public key ID from the key group.","code":"aws cloudfront sign --url https://$CF_DOMAIN/private/hello.txt \\\n  --key-pair-id $PUBKEY_ID --private-key file://private_key.pem \\\n  --date-less-than $(date -u -d '+5 minutes' +%s)","lang":"bash"},{"t":"Or sign it with Python","txt":"Uses botocore's CloudFrontSigner. If the cryptography package is missing in CloudShell, install it for your user first: pip3 install --user cryptography.","code":"import datetime\nimport sys\nfrom botocore.signers import CloudFrontSigner\nfrom cryptography.hazmat.primitives import hashes, serialization\nfrom cryptography.hazmat.primitives.asymmetric import padding\n\nurl, key_id = sys.argv[1], sys.argv[2]\nminutes = int(sys.argv[3]) if len(sys.argv) > 3 else 5\n\nwith open(\"private_key.pem\", \"rb\") as f:\n    private_key = serialization.load_pem_private_key(f.read(), password=None)\n\ndef rsa_signer(message):\n    # CloudFront canned-policy signatures use RSA with SHA-1\n    return private_key.sign(message, padding.PKCS1v15(), hashes.SHA1())\n\nsigner = CloudFrontSigner(key_id, rsa_signer)\nexpires = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=minutes)\nprint(signer.generate_presigned_url(url, date_less_than=expires))","lang":"python"}],"test":{"txt":"Expected: unsigned CloudFront request -> 403 (MissingKey); direct S3 request -> 403 (AccessDenied, proves OAC lockdown); CLI-signed and Python-signed URLs -> 200 and the file text; a URL signed to expire in 1 minute -> 200 now and 403 after it expires.","code":"curl -s https://$CF_DOMAIN/private/hello.txt; echo\ncurl -s -o /dev/null -w \"direct S3: %{http_code}\\n\" https://$BUCKET.s3.us-east-1.amazonaws.com/private/hello.txt\nSIGNED=$(aws cloudfront sign --url https://$CF_DOMAIN/private/hello.txt \\\n  --key-pair-id $PUBKEY_ID --private-key file://private_key.pem \\\n  --date-less-than $(date -u -d '+5 minutes' +%s))\ncurl -s \"$SIGNED\"\ncat > sign.py <<'EOF'\nimport datetime\nimport sys\nfrom botocore.signers import CloudFrontSigner\nfrom cryptography.hazmat.primitives import hashes, serialization\nfrom cryptography.hazmat.primitives.asymmetric import padding\n\nurl, key_id = sys.argv[1], sys.argv[2]\nminutes = int(sys.argv[3]) if len(sys.argv) > 3 else 5\n\nwith open(\"private_key.pem\", \"rb\") as f:\n    private_key = serialization.load_pem_private_key(f.read(), password=None)\n\ndef rsa_signer(message):\n    # CloudFront canned-policy signatures use RSA with SHA-1\n    return private_key.sign(message, padding.PKCS1v15(), hashes.SHA1())\n\nsigner = CloudFrontSigner(key_id, rsa_signer)\nexpires = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(minutes=minutes)\nprint(signer.generate_presigned_url(url, date_less_than=expires))\nEOF\nSHORT=$(python3 sign.py https://$CF_DOMAIN/private/hello.txt $PUBKEY_ID 1)\ncurl -s -o /dev/null -w \"now: %{http_code}\\n\" \"$SHORT\"\nsleep 75\ncurl -s -o /dev/null -w \"after expiry: %{http_code}\\n\" \"$SHORT\""},"trouble":[["Signed URL returns 403 with InvalidKey or 'Invalid signature'.","The Key-Pair-Id is not a public key in a key group trusted by this behavior, the private key does not match the uploaded public key, or the URL was changed after signing (the signature covers the exact URL). Re-check the key group on the behavior and re-sign."],["Every request returns 403 AccessDenied (XML from S3) even with a valid signature.","CloudFront reached S3 but OAC was refused: the bucket policy is missing, has the wrong distribution ID/account, or the origin uses the S3 website endpoint. For SSE-KMS objects, the KMS key policy must also allow cloudfront.amazonaws.com with the same SourceArn condition."],["Unsigned requests still return 200.","The behavior change has not finished deploying, or the request matched a different behavior without Restrict viewer access. Wait for the distribution status, then check the path pattern order."]],"cleanup":[{"txt":"If you subscribed the distribution to a flat-rate plan, first cancel the plan (or switch it to pay-as-you-go), and delete any WAF web ACL the wizard created (about USD 5/month otherwise). Then: Disable the distribution (console: select it > Disable), wait until it finishes deploying, then Delete. CLI version below (needs the ETag each time).","code":"aws cloudfront get-distribution-config --id $DIST_ID > dist.json\nETAG=$(python3 -c \"import json;print(json.load(open('dist.json'))['ETag'])\")\npython3 -c \"import json;d=json.load(open('dist.json'))['DistributionConfig'];d['Enabled']=False;json.dump(d,open('cfg.json','w'))\"\naws cloudfront update-distribution --id $DIST_ID --if-match $ETAG --distribution-config file://cfg.json\naws cloudfront wait distribution-deployed --id $DIST_ID\nETAG=$(aws cloudfront get-distribution --id $DIST_ID --query ETag --output text)\naws cloudfront delete-distribution --id $DIST_ID --if-match $ETAG"},{"txt":"Delete the OAC, key group and public key (in that order, after the distribution is gone; a key group in use cannot be deleted). Console: Origin access > select the OAC > Delete; Key management > Key groups > lab-kg > Delete; Public keys > lab-key > Delete."},{"txt":"Empty and delete the bucket, and delete the private key and local files.","code":"aws s3 rm s3://$BUCKET --recursive && aws s3api delete-bucket --bucket $BUCKET\ncd ~ && rm -rf ~/lab6"}],"cost":"Free in practice: CloudFront's always-free tier covers 1 TB of data transfer out and 10 million requests per month; public keys, key groups and OAC have no charge; S3 storage of one small file is negligible. What could cost money: a distribution left enabled and discovered by bots (still small), adding a WAF web ACL or a paid flat-rate plan, or real-time logs.","check":[["Users must download one large installer with a link that expires in 1 hour; a members area has hundreds of files. Signed URLs or signed cookies for each?","Signed URL for the single installer (works with any client, easy to email). Signed cookies for the members area so all files are covered without rewriting every URL."],["After switching an S3 origin from OAI to OAC, objects encrypted with SSE-KMS return 403. Why?","The KMS key policy must allow the cloudfront.amazonaws.com service principal to kms:Decrypt with an AWS:SourceArn condition for the distribution. OAI never supported SSE-KMS, OAC does but needs this key-policy grant."],["What is the difference between a CloudFront key group and the legacy CloudFront key pair?","Key groups contain public keys you upload; any IAM principal with CloudFront permissions can manage them and you can rotate up to 5 keys per group. Legacy key pairs are created by the root user per account and are discouraged. Both are referenced by the Key-Pair-Id in the signed URL."]]}],"cues":[["Orders/messages are lost when a downstream system is slow","Amazon SQS (+ dead-letter queue)","A queue stores work durably until the consumer catches up; the DLQ keeps messages that keep failing.","2.4"],["One event must reach several independent systems (billing, shipping, email)","SNS topic → one SQS queue per system (fan-out)","Each consumer gets its own copy and its own queue, so one failing system doesn't block the others.","2.4"],["Route events by their content to different targets, including SaaS sources","Amazon EventBridge (rules)","Rules match on event content; also archive/replay and scheduled events.","4.4"],["Strict order and exactly-once processing","SQS FIFO (message group ID)","Order is kept per message group; deduplication within 5 minutes.","2.4"],["Many consumers must read the same stream in order, with replay","Kinesis Data Streams","Ordered per partition key, several consumers (enhanced fan-out), retention up to 365 days; Amazon MSK if Kafka is required.","2.5"],["Load streaming data into S3/Redshift/OpenSearch with no code","Amazon Data Firehose","Managed buffering, conversion and delivery; near real time, not real time.","2.5"],["Existing app uses JMS, AMQP, MQTT or STOMP and code can't change","Amazon MQ","Managed ActiveMQ/RabbitMQ keeps the existing protocol.","4.3"],["Workflow with steps, retries, waits or human approval, or longer than 15 minutes","AWS Step Functions","Orchestration with built-in retry/catch; Lambda alone stops at 15 minutes.","4.4"],["Dozens of VPCs and on-premises need to talk to each other","AWS Transit Gateway (shared with AWS RAM)","A regional hub with transitive routing; peering is 1:1 and non-transitive.","1.1"],["Direct Connect must reach many VPCs in several Regions/accounts","Transit VIF → Direct Connect gateway → Transit Gateway","A DX gateway spans Regions; a transit VIF lands on Transit Gateways (or attach the DX gateway to Cloud WAN).","1.1"],["Expose one service to many consumer VPCs, even with overlapping CIDRs","AWS PrivateLink (endpoint service behind an NLB)","One-way, service-level access; needs a Network Load Balancer or Gateway Load Balancer.","1.1"],["On-premises servers must resolve AWS private DNS names","Route 53 Resolver inbound endpoint","Inbound = on-prem → AWS names; outbound endpoint + forwarding rules = AWS → on-prem names.","1.1"],["Private access to S3 or DynamoDB with no NAT and no cost","Gateway VPC endpoint (route table entry)","Free and private; other services need (paid) interface endpoints.","2.3"],["Bucket must accept requests only from our VPC","Bucket policy Deny unless aws:SourceVpce (or aws:SourceVpc)","aws:SourceIp doesn't work through endpoints because traffic uses private IPs.","2.3"],["Encrypted, consistent, high-bandwidth link to on-premises","AWS Direct Connect (+ MACsec on 10/100/400 Gbps, or VPN over DX)","DX itself isn't encrypted; a Site-to-Site VPN is the cheap backup.","1.1"],["Static IP addresses, TCP/UDP, fastest global failover","AWS Global Accelerator","Two anycast IPs over the AWS backbone; CloudFront is for HTTP caching.","2.5"],["Global users, slow static content","Amazon CloudFront (S3 origin + origin access control)","Edge caching; OAC keeps the bucket private.","2.5"],["Same database query repeated thousands of times a minute","Amazon ElastiCache (Valkey / Redis OSS)","A cache in front of the database; read replicas are the alternative for read scaling.","2.5"],["Microsecond reads on DynamoDB with minimal code change","DynamoDB Accelerator (DAX)","API-compatible cache for DynamoDB.","2.5"],["Lambda functions exhaust database connections","Amazon RDS Proxy","Pools and reuses connections; also shortens failover for clients.","2.4"],["Credentials must rotate automatically","AWS Secrets Manager","Built-in rotation for RDS, Aurora, Redshift, DocumentDB; Parameter Store has no built-in rotation.","2.3"],["Every use of the encryption key must be auditable","SSE-KMS (KMS calls logged in CloudTrail)","SSE-S3 gives no per-use record; use a customer managed key for policy control and cross-account. S3 Bucket Keys cut KMS calls, so turn them off if every object's key use must be logged.","2.3"],["No access keys on servers","IAM role (instance profile / task role); on-prem: IAM Roles Anywhere","Temporary credentials that rotate automatically.","1.2"],["SQL injection, bad bots, too many requests from a few IPs","AWS WAF (managed rules, Bot Control, rate-based rule) on CloudFront/ALB","WAF filters bad requests; Shield handles floods.","2.3"],["Large DDoS, 24/7 expert help, refund of attack scaling costs","AWS Shield Advanced (Shield Response Team, DDoS cost protection)","Shield Standard is free and automatic for layer 3/4 floods.","2.3"],["Workforce sign-in to many AWS accounts with Okta/Entra ID","IAM Identity Center + SAML + SCIM + permission sets","Central SSO; permission sets become roles in each account.","1.2"],["App's customers sign up and sign in","Amazon Cognito user pools (identity pools for AWS credentials)","Customer identity, not workforce access to accounts.","1.2"],["Enable a security service for all current and future accounts","Delegated administrator + auto-enable (from the management account)","GuardDuty, Security Hub CSPM, Inspector, Macie and Detective auto-enable new accounts; Config recorders are deployed with StackSets/Control Tower, and Backup uses backup policies. Regional services: set up per Region.","1.4"],["Prevent anyone, even admins, from doing X in member accounts","Service control policy (SCP)","SCPs only limit; they never grant, and don't affect the management account.","1.4"],["Many accounts with guardrails and a standard account setup","AWS Control Tower (Account Factory / AFT)","Landing zone with OUs, controls, log archive and audit accounts.","1.4"],["Tamper-proof central logs","Organization CloudTrail trail → Log Archive account S3 with Object Lock","Member accounts can't turn off an organization trail; log file integrity validation shows whether logs were changed.","1.4"],["Show costs per team/project","Cost allocation tags activated in the payer account (+ Cost Categories)","Tags must be activated; backfill up to 12 months on request.","1.5"],["Steady compute across EC2, Fargate and Lambda, changing families/Regions","Compute Savings Plans","Most flexible commitment, up to 66%; EC2 Instance SP is up to 72% but locked to a family and Region.","1.5"],["Interruptible batch or stateless work at the lowest price","EC2 Spot Instances","Up to ~90% off; never for steady, non-interruptible load.","2.6"],["Alert or act when spend crosses a threshold","AWS Budgets (+ budget actions)","Budgets alert; budget actions can apply an IAM policy/SCP or stop EC2/RDS.","1.5"],["Unusual spend spike with no fixed threshold","AWS Cost Anomaly Detection","ML-based monitors with alerts.","3.5"],["Right-size over-provisioned instances","AWS Compute Optimizer","Covers EC2, EBS, Lambda, ECS on Fargate, RDS and more.","3.5"],["RTO hours, lowest cost DR","Backup and restore (AWS Backup copies to another Region)","Cheapest; rebuild with IaC on failover.","1.3"],["RTO minutes, smaller copy of everything already running","Warm standby","Scaled-down full stack in the DR Region; scale up on failover.","1.3"],["Data replicated live, compute off until failover","Pilot light","Core data live; servers launched only in a disaster.","1.3"],["Relational DB with RPO ~1 second across Regions","Aurora Global Database","Storage-level replication; switchover = planned, failover = unplanned.","2.2"],["Writes in several Regions at once (NoSQL)","DynamoDB global tables","Active-active; last-writer-wins by default, or multi-Region strong consistency.","2.2"],["Servers (on-prem or EC2) need DR with RPO in seconds","AWS Elastic Disaster Recovery","Continuous block replication to a low-cost staging area.","1.3"],["Reliable manual Region failover switch","Route 53 ARC routing controls (or Region switch)","Data-plane switches that don't depend on the failed Region.","2.2"],["Prove the system survives failures","AWS Fault Injection Service (with CloudWatch alarm stop conditions)","Controlled experiments that stop automatically.","3.4"],["Instances return HTTP 500 but are never replaced","Auto Scaling group with ELB health checks","The default EC2 status check only sees whether the VM runs.","3.4"],["Rehost servers with minimal downtime and no code changes","AWS Application Migration Service (MGN)","Continuous block replication, test launch, cutover.","4.2"],["Move a database with minimal downtime (same or different engine)","AWS DMS full load + CDC (+ schema conversion for a new engine)","Heterogeneous moves need SCT or DMS Schema Conversion first.","4.2"],["Copy file shares or object data into S3/EFS/FSx","AWS DataSync","Scheduled, verified bulk transfer; Storage Gateway is for ongoing hybrid access.","4.2"],["Partners keep sending files over SFTP","AWS Transfer Family","Managed SFTP/FTPS/FTP/AS2 into S3 or EFS.","4.2"],["Discover servers and plan migration waves (new project)","AWS Transform","Migration Hub and Application Discovery Service are closed to new customers.","4.1"],["Windows SMB shares with Active Directory","Amazon FSx for Windows File Server","EFS is NFS for Linux; FSx for NetApp ONTAP if the same data needs both SMB and NFS.","4.3"],["Shared Linux file system across AZs","Amazon EFS","NFS, elastic, multi-AZ.","4.3"],["Containers with the least operational overhead","Amazon ECS on AWS Fargate","No servers to manage; EKS when Kubernetes is required.","4.3"],["Ad-hoc SQL on data in S3, least ops","Amazon Athena (+ Glue Data Catalog)","Serverless, pay per data scanned; Parquet and partitions cut cost.","4.4"],["Table/column/row permissions on a data lake across accounts","AWS Lake Formation","Fine-grained data-lake permissions shared through RAM.","1.2"],["Feature flags or gradual config rollout with auto-rollback","AWS AppConfig","CloudWatch Evidently is discontinued.","2.1"],["Release to 10% of traffic first, roll back on alarms","CodeDeploy canary (Lambda alias / ECS) with CloudWatch alarms","Linear and canary configs with alarm rollback; ECS also has built-in blue/green, canary and linear deployments (2025).","2.1"],["Protect a production database from stack deletion or replacement","CloudFormation DeletionPolicy/UpdateReplacePolicy: Retain or Snapshot (+ stack policy, termination protection)","Stack policy blocks updates; termination protection blocks deleting the stack.","2.1"],["Run commands/patch fleets without SSH or bastions","Systems Manager Session Manager / Run Command / Patch Manager","No inbound ports; actions are logged.","3.1"],["Detect configuration drift and auto-fix it","AWS Config rule + SSM Automation remediation","Config records and evaluates; Automation fixes. For drift from IaC templates, use CloudFormation drift detection.","3.2"],["Threat detection (compromised credentials, crypto-mining)","Amazon GuardDuty","Detects; respond with EventBridge → Lambda/SSM.","3.2"],["Find sensitive data (PII) in S3","Amazon Macie","Inspector scans EC2/ECR/Lambda for vulnerabilities, not data.","3.2"]]}</script>

<script>
/* Loads the question bank from the page's database, then starts the trainer. */
(function(){
  function say(html){var el=document.getElementById('boot');if(el)el.innerHTML=html;}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  async function boot(){
    var db=null,user=null,downloads=null;
    try{
      if(window.claude&&window.claude.use){
        var r=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
        db=r[0];user=r[1];downloads=r[2];
      }
    }catch(e){}
    if(!db){say('<h2>Sign in to study</h2><p class="note">The question bank lives in this page’s database. Open the page on claude.ai while signed in to load it.</p>');return;}
    var slow=setTimeout(function(){say('Still loading the question bank… If this takes long, check your connection; the page keeps trying.');},10000);
    try{
      var res=await Promise.all([db.collection('questions').limit(1000).get(),db.doc('meta/bank').get(),db.doc('meta/patterns').get()]);
      clearTimeout(slow);
      var qs=res[0],meta=res[1],pats=res[2];
      if(qs.empty||!meta.exists){say('<h2>The question bank is empty</h2><p class="note">No questions are stored yet. Ask Claude to load the question bank into this page.</p>');return;}
      var q=qs.docs.map(function(d){var o=clone(d.data());o._id=d.id;return o;}).sort(function(a,b){return a.i-b.i;});
      var data=clone(meta.data());data.q=q;
      var pm=pats.exists?(clone(pats.data()).list||[]):[];
      var pmap={};q.forEach(function(x){pmap[x.i]={p:x.pt||(pm[0]&&pm[0].id),confidence:'high',source:'reviewed'};});
      var canEdit=false;try{if(user){canEdit=!!(await user.canEdit())||!!(await user.isOwner());}}catch(e){}
      window.__startTrainer(data,pm,pmap,{db:db,user:user,downloads:downloads,canEdit:canEdit});
    }catch(e){
      clearTimeout(slow);
      say('<h2>Could not load the question bank</h2><p class="note">'+String((e&&(e.message||e.code))||e).replace(/[<>&]/g,'')+'. Reload the page to try again.</p>');
    }
  }
  boot();
})();

</script>

function svcLinks(html,seen){let inA=false;

function explHTML(q){
  let e=q.e.replace(PDFJUNK,' ').trim();
  let ss=e.split(/(?<=[a-z0-9)%"'\u201d\]]\.|[!?])\s+(?=[A-Z(])/);
  // re-attach bare option letters like "A." to the sentence that follows
  const fixed=[];for(let k=0;k<ss.length;k++){if(/^\(?[A-F][.)]$/.test(ss[k])&&k+1<ss.length){fixed.push(ss[k]+' '+ss[k+1]);k++}else fixed.push(ss[k])}
  const OPT=/^(?:(?:Options?|Answers?|Choices?)\s+\(?([A-F])\b|\(?([A-F])[.):]\s)/;
  const ps=[];let cur=null;
  fixed.forEach(x=>{const m=OPT.exec(x);
    if(m){cur={l:m[1]||m[2],t:x};ps.push(cur);return}
    if(!cur||cur.l&&cur.t.length>420||!cur.l&&cur.t.length>320){cur={l:null,t:x};ps.push(cur);return}
    cur.t+=' '+x});
  const seen=new Set();
  return ps.map(p=>{const body=svcLinks(linkify(p.l?p.t.replace(/^\(?[A-F][.):]\s+/,''):p.t),seen);
    if(!p.l)return`<p>${body}</p>`;const ok=q.a.includes(LET.indexOf(p.l));
    return`<p class="op"><span class="lb${ok?' ok':''}" title="${ok?'A correct option':'Not a correct option'}">${p.l}</span><span>${body}</span></p>`}).join('');
}
const STEPV='Create|Configure|Assign|Register|Provide|Deploy|Set up|Use|Enable|Add|Attach|Launch|Migrate|Store|Update|Modify|Install|Replace|Move|Implement|Establish|Associate|Expose|Define|Build|Copy|Schedule|Invoke|Send|Turn on|Share|Write|Grant|Remove|Delete|Change|Point|Specify|Select|Place|Increase|Decrease|Convert|Refactor|Rehost|Import|Export|Apply|Encrypt|Restrict|Allow|Deny|Subscribe|Publish|Order|Purchase|Stop|Start|Ensure|Tag|Rotate|Monitor|Automate|Forward|Mount';
const STEP_RE=new RegExp('([a-z0-9)%\\]])(?:\\.\\s+(?=[A-Z])|\\s+(?=(?:'+STEPV+')\\b))','g');
function wHTML(q){const w=q.w,seen=new Set();

  const pdf=(q.e||'').match(/https?:\/\/[^\s<]+/g)||[];

function optLines(html){return html.split(/(<[^>]+>)/).map(p=>p.startsWith('<')?p:p.replace(STEP_RE,(m,c)=>m.includes('.')?c+'.<br>':c+'<br>')).join('')}
function chainHTML(v){if(!v||!v.length)return'<span class="muted">No AWS service named in the answer (a pure concept or setting).</span>';return v.map(s=>'<a class="n" href="'+docURL(s)+'" target="_blank" rel="noopener" title="Open the AWS page for '+esc(s)+'">'+icoTag(s)+esc(s)+'</a>').join('<span class="ar">→</span>')}

let D=null; // {queue:[ids], pos, label, cur:{id,sel:Set,done,correct}, total, right}
function startDrill(opt){

  if(opt.kind==='svc'){filter=q=>q.v.includes(opt.svc);label='Answers using '+opt.svc}
  if(opt.kind==='dom'){filter=q=>q.dm===opt.d;label=domName(opt.d)}
  if(opt.kind==='ts'){filter=q=>q.ts===opt.ts;label='Task '+tsName(opt.ts)}
  if(opt.kind==='list'){ids=opt.ids.slice();label=opt.label}
  else{
    const miss=shuffle(missedList(filter)),due=shuffle(dueList(filter));
    let nw=newList(filter);if(opt.kind==='today'){const r=new Map(nw.map(id=>[id,Math.random()]));nw.sort((a,b)=>(wrank(byId[a].ts)-wrank(byId[b].ts))||(r.get(a)-r.get(b)));}
    const lim=opt.kind==='today'?Math.max(0,S.set.newPerDay-newToday()):20;
    ids=[...miss,...due,...nw.slice(0,lim)];
    if(opt.kind!=='today'&&!ids.length){ids=shuffle(Q.filter(filter).map(q=>q.i)).slice(0,20)}
  }
  D={queue:ids,pos:0,label,total:ids.length,right:0,answered:0,cur:null,diff:false,clue:true,af:!!S.set.af,gd:!!S.set.gd};

  {const rb=document.querySelector('#v-drill #ruleIn');if(rb)rb.oninput=()=>{S.rules=S.rules||{};const v=rb.value.trim();if(v)S.rules[q.i]={t:v,d:today(),u:Date.now()};else delete S.rules[q.i];save();};}

function choose(i){
  const q=curQ(),c=D.cur;if(!q||c.done||i>=q.o.length)return;if((D.af||D.gd)&&!c.rev)return;
  if(q.a.length===1){c.sel=new Set([i]);check();return}
  c.sel.has(i)?c.sel.delete(i):c.sel.add(i);renderDrill();
}
function check(){
  const q=curQ(),c=D.cur;if(!c.sel.size||c.done)return;
  c.done=true;c.correct=c.sel.size===q.a.length&&q.a.every(i=>c.sel.has(i));
  if(!c.firstDone){c.firstDone=true;D.answered++;if(c.correct)D.right++}
  if(!c.correct){record(q.i,false);D.queue.splice(Math.min(D.queue.length,D.pos+5),0,q.i)}
  renderDrill();
  const v=document.querySelector('#v-drill .verdict');if(v)v.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function advance(conf){
  const q=curQ();if(conf!==null)record(q.i,true,conf);
  D.pos++;D.cur=null;render();window.scrollTo(0,0);
}

function exChoose(i){const q=byId[E.ids[E.pos]];if(i>=q.o.length)return;let a=new Set(E.ans[q.i]||[]);if(q.a.length===1)a=new Set([i]);else a.has(i)?a.delete(i):a.add(i);E.ans[q.i]=[...a];renderExam()}

  const sts=[['','Any status'],['nw','New · exam guide'],['new','Not seen'],['missed','Last answer wrong'],['learning','Learning'],['mastered','Mastered'],['flagged','Flagged'],['disputed','Corrected key'],['noted','Has a note']];

    <div class="panel" style="padding:4px 14px"><div class="list" id="blist"></div></div>`;
  const draw=()=>{
    const terms=B.q.toLowerCase().split(/\s+/).filter(Boolean);
    const L=Q.filter(q=>{
      if(B.t&&!q.t.includes(+B.t))return false;
      if(B.st==='flagged'&&!S.flag[q.i])return false;

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(view==='home'&&k==='Enter'){e.preventDefault();startDrill({kind:'today'});return}
  if(view==='drill'&&D&&curQ()){
    const c=D.cur;let idx=-1;
    if(/^[1-8]$/.test(k))idx=+k-1;else if(/^[a-fA-F]$/.test(k)&&!c.done)idx=LET.indexOf(k.toUpperCase());
    if(idx>=0&&!c.done){e.preventDefault();choose(idx);return}
    if(k==='w'||k==='W'){D.af=!D.af;S.set.af=D.af;save();renderDrill();return}
    if(k==='r'||k==='R'){D.gd=!D.gd;S.set.gd=D.gd;save();renderDrill();return}
    if(k==='Enter'){e.preventDefault();if(c.wk){wkNext();return}if((D.af||D.gd)&&!c.rev&&!c.done){c.rev=true;renderDrill();return}if(!c.done)check();else if(c.correct)advance(true);else advance(null);return}
    if((k==='g'||k==='G')&&c.done&&c.correct){advance(false);return}
    if(k==='x'||k==='X'){D.diff=!D.diff;renderDrill();return}
    if(k==='z'||k==='Z'){D.clue=!D.clue;renderDrill();return}
    if(k==='i'||k==='I'){toggleIcons();return}
    if(k==='m'||k==='M'){const id=curQ().i;S.flag[id]=!S.flag[id];if(!S.flag[id])delete S.flag[id];save();renderDrill();return}
  }
  if(view==='exam'&&E&&!E.done){
    let idx=-1;if(/^[1-8]$/.test(k))idx=+k-1;else if(/^[a-hA-H]$/.test(k))idx=LET.indexOf(k.toUpperCase());
    if(idx>=0){e.preventDefault();exChoose(idx);return}
    if(k==='Enter'||k==='ArrowRight'){e.preventDefault();exNext();return}
    if(k==='ArrowLeft'){E.pos=Math.max(0,E.pos-1);renderExam();return}
    if(k==='i'||k==='I'){toggleIcons();return}
  }
});

  },true)}catch(e){}
}
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="AWS_Service_Mind_Map"]');if(!a)return;
  e.preventDefault();openMap('#'+(a.getAttribute('href').split('#')[1]||''));
});
$('#openMap').onclick=()=>openMap('');

/* ---------- Edit tab (owner and editors) ---------- */
const ED={q:'',sel:null,draft:null,msg:'',t:null};
const LETTERS='ABCDEFGH';
function renderEdit(){
  const el=$('#v-edit');
  if(!CTX.canEdit){el.innerHTML='<div class="panel"><p>Only the page owner and editors can change questions.</p></div>';return}
  const term=ED.q.trim().toLowerCase();
  const hits=term?Q.filter(q=>q.r.some(l=>l.toLowerCase()===term)||(q.r.join(' ')+' '+q.s).toLowerCase().includes(term)).slice(0,30):[];
  const cur=ED.draft||(ED.sel!=null?byId[ED.sel]:null);
  el.innerHTML=`<div class="panel" style="display:grid;gap:10px"><h2>Edit questions</h2>
    <p class="muted">Changes go straight into the question bank and appear for everyone who opens this page. Study progress is not touched.</p>
    <div class="row"><input id="edQ" type="search" value="${esc(ED.q)}" placeholder="Label (A276) or words from the question" aria-label="Find a question" style="flex:1 1 260px;min-width:0"><button type="button" class="btn small" id="edNew">New question</button></div>
    ${term?`<div class="edhits">${hits.length?hits.map(q=>`<button type="button" class="item" data-ed="${q.i}"><span class="id">${esc(q.r.join(' · '))}</span><span class="tx">${esc(q.s.slice(0,160))}</span></button>`).join(''):'<p class="note">No question matches.</p>'}</div>`:'<p class="note">Type a label such as A276, or a few words from the question.</p>'}
  </div>${cur?edForm(cur):''}`;
  const inp=$('#edQ');
  inp.oninput=()=>{ED.q=inp.value;clearTimeout(ED.t);ED.t=setTimeout(()=>{renderEdit();const i=$('#edQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{ED.sel=+b.dataset.ed;ED.draft=null;ED.msg='';renderEdit();$('#edForm').scrollIntoView({block:'start'})});
  $('#edNew').onclick=newQuestion;
  if(cur)wireForm(cur);
}
function edForm(q){
  const w=q.w||{y:'',o:{}},wo=w.o||{};
  const pt=q.pt||(PATAUTO[q.i]&&PATAUTO[q.i].p);
  const isNew=!byId[q.i];
  return `<form class="panel edform" id="edForm" novalidate>
  <div class="row" style="justify-content:space-between"><h3>${isNew?'New question':'Question '+esc(q.r.join(' · '))}</h3>${isNew?'':`<button type="button" class="btn small" id="edTry">Try it in Drill</button>`}</div>
  ${ED.msg?`<div class="edmsg" role="status">${ED.msg}</div>`:''}
  <div class="edgrid">
    <label class="f" for="edR">Labels (comma separated)<input id="edR" type="text" value="${esc(q.r.join(', '))}"></label>
    <label class="f" for="edTs">Exam task<select id="edTs">${Object.keys(TSN).map(k=>`<option value="${k}" ${q.ts===k?'selected':''}>${k} ${esc(TSN[k])}</option>`).join('')}</select></label>
    <label class="f" for="edPt">Pattern<select id="edPt">${PATMETA.map(m=>`<option value="${m.id}" ${pt===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
  </div>
  <label class="f" for="edS">Question text<textarea id="edS" rows="8">${esc(q.s)}</textarea></label>
  <label class="f" for="edD">Deciding words (optional, e.g. LEAST operational overhead)<input id="edD" type="text" value="${esc(q.d||'')}"></label>
  <div class="edopts">${q.o.map((o,i)=>`<div class="edopt">
    <div class="row"><b>${LETTERS[i]}</b><label class="edck"><input type="checkbox" name="edA" value="${i}" ${(q.a||[]).includes(i)?'checked':''}> Correct answer</label></div>
    <textarea data-o="${i}" rows="3" aria-label="Option ${LETTERS[i]}">${esc(o)}</textarea>
    <label class="f" for="edW${i}">Why ${LETTERS[i]} is right or wrong<textarea id="edW${i}" data-w="${LETTERS[i]}" rows="2">${esc(wo[LETTERS[i]]||'')}</textarea></label>
  </div>`).join('')}</div>
  <div class="row"><button type="button" class="btn small" id="edAdd" ${q.o.length>=8?'disabled':''}>Add option</button><button type="button" class="btn small" id="edDel" ${q.o.length<=2?'disabled':''}>Remove last option</button></div>
  <label class="f" for="edY">Why (main explanation)<textarea id="edY" rows="4">${esc(w.y||'')}</textarea></label>
  <label class="f" for="edV">Answer chain: services in the right answer, in order (comma separated)<input id="edV" type="text" value="${esc((q.v||[]).join(', '))}"></label>
  <fieldset class="edtypes"><legend class="note">Scenario types</legend>${Object.keys(TYPES).map(k=>`<label class="edck"><input type="checkbox" name="edT" value="${k}" ${(q.t||[]).includes(+k)?'checked':''}> ${esc(TYPES[k])}</label>`).join('')}</fieldset>
  <details class="xb"><summary>Notes and source text</summary><div style="display:grid;gap:10px;margin-top:8px">
    <label class="f" for="edSt">Status today (a service closed or renamed)<textarea id="edSt" rows="2">${esc(q.st||'')}</textarea></label>
    <label class="f" for="edAlt">Disputed (why another answer is also argued)<textarea id="edAlt" rows="2">${esc(q.alt||'')}</textarea></label>
    <label class="f" for="edNt">Note (e.g. an image missing from the PDF)<textarea id="edNt" rows="2">${esc(q.nt||'')}</textarea></label>
    <label class="f" for="edE">Original explanation from the source<textarea id="edE" rows="4">${esc(q.e||'')}</textarea></label>
  </div></details>
  <div class="row"><button type="submit" class="btn primary" id="edSave">${isNew?'Add question':'Save changes'}</button><button type="button" class="btn" id="edCancel">Close</button></div>
  </form>`;
}
function readForm(base){
  const f=$('#edForm'),n=JSON.parse(JSON.stringify(base));
  const o=[...f.querySelectorAll('textarea[data-o]')].map(t=>t.value.trim());
  const wo={};f.querySelectorAll('textarea[data-w]').forEach(t=>{const L=t.dataset.w;if(t.value.trim()&&LETTERS.indexOf(L)<o.length)wo[L]=t.value.trim()});
  n.r=$('#edR').value.split(/[,·\s]+/).map(x=>x.trim()).filter(Boolean);
  n.ts=$('#edTs').value;n.dm=+n.ts[0];n.pt=$('#edPt').value;
  n.s=$('#edS').value.trim();n.o=o;
  n.a=[...f.querySelectorAll('input[name=edA]:checked')].map(c=>+c.value).filter(i=>i<o.length).sort();
  n.v=$('#edV').value.split(',').map(x=>x.trim()).filter(Boolean);
  n.t=[...f.querySelectorAll('input[name=edT]:checked')].map(c=>+c.value);
  const y=$('#edY').value.trim();
  if(y||Object.keys(wo).length||base.w)n.w={...(n.w||{}),y,o:wo,s:(n.w&&n.w.s)||[]};
  const opt=(k,id)=>{const v=$(id).value.trim();if(v)n[k]=v;else delete n[k]};
  opt('d','#edD');opt('st','#edSt');opt('alt','#edAlt');opt('nt','#edNt');
  n.e=$('#edE').value.trim();
  return n;
}
function checkQ(n){
  const errs=[];
  if(!n.r.length)errs.push('Add at least one label, for example N68.');
  n.r.forEach(l=>{
    if(!/^[A-Za-z0-9_.-]{1,40}$/.test(l))errs.push('Label "'+l+'" may use only letters, digits, dot, dash and underscore.');
    const o=Q.find(x=>x.i!==n.i&&x.r.includes(l));if(o)errs.push('Label '+l+' is already used by another question.');
  });
  if(n.s.length<20)errs.push('Write the question text.');
  if(n.o.length<2)errs.push('Give at least two options.');
  if(n.o.some(x=>!x))errs.push('Fill in every option, or remove the empty one.');
  if(!n.a.length)errs.push('Tick the correct answer.');
  if(!TSN[n.ts])errs.push('Pick an exam task.');
  return errs;
}
async function saveQ(cur){
  const n=readForm(cur),errs=checkQ(n);
  if(errs.length){ED.draft=n;ED.msg='<b>Not saved.</b> '+errs.map(esc).join(' ');renderEdit();return}
  const id=n._id||n.r[0],body={...n};delete body._id;
  const btn=$('#edSave');if(btn){btn.disabled=true;btn.textContent='Saving…'}
  try{await CTX.db.doc('questions/'+id).set(body)}
  catch(e){ED.draft=n;ED.msg='<b>Not saved.</b> '+(e&&e.code==='invalid_argument'?'Only the owner and editors can change questions.':esc((e&&e.message)||'The database did not answer. Try again.'));renderEdit();return}
  n._id=id;
  if(byId[n.i]){const q=byId[n.i];Object.keys(q).forEach(k=>delete q[k]);Object.assign(q,n)}
  else{Q.push(n);byId[n.i]=n}
  PATAUTO[n.i]={p:n.pt,confidence:'high',source:'reviewed'};
  ED.draft=null;ED.sel=n.i;ED.msg='Saved '+esc(n.r.join(' · '))+'.';renderEdit();
}
function newQuestion(){
  const i=Math.max(...Q.map(q=>q.i))+1;
  const nmax=Math.max(0,...Q.flatMap(q=>q.r).filter(l=>/^N\d+$/.test(l)).map(l=>+l.slice(1)));
  ED.sel=null;ED.msg='';
  ED.draft={i,r:['N'+(nmax+1)],s:'',o:['','','',''],a:[],e:'',t:[],v:[],dm:1,ts:Object.keys(TSN)[0],pt:PATMETA[0]&&PATMETA[0].id,nw:1,w:{y:'',o:{},s:[]}};
  renderEdit();$('#edForm').scrollIntoView({block:'start'});
}
function wireForm(cur){
  const f=$('#edForm');
  f.onsubmit=e=>{e.preventDefault();saveQ(cur)};
  $('#edAdd').onclick=()=>{const d=readForm(cur);if(d.o.length<8)d.o.push('');ED.draft=d;ED.msg='';renderEdit()};
  $('#edDel').onclick=()=>{const d=readForm(cur);if(d.o.length>2){d.o.pop();d.a=d.a.filter(i=>i<d.o.length);if(d.w&&d.w.o)delete d.w.o[LETTERS[d.o.length]]}ED.draft=d;ED.msg='';renderEdit()};
  $('#edCancel').onclick=()=>{ED.draft=null;ED.sel=null;ED.msg='';renderEdit()};
  const tr=$('#edTry');if(tr)tr.onclick=()=>startDrill({kind:'list',ids:[cur.i],label:'Edited question'});
}

};
</script>
